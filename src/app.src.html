<title>Powerosso App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one app column (phone width) centred; sticky brand header, bottom tab bar.
   Palette taken from the Team Powerosso crest: black shield, gold trim, crimson POWER, bear brown, cream. Dark-first. */
:root{
  --bg:#0b0a0c; --surface:#16141a; --surface-2:#211e25; --line:#332e2a; --fg:#f6f2ea; --muted:#a59d90;
  --gold:#d4ad5e; --gold-2:#efd594; --red:#c3242f; --red-fg:#ff5b63; --brown:#9a6a44; --green:#5cc489; --amber:#e8b64a;
  --on-red:#fff8ef;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f1e9da; --line:#ddd0b9; --fg:#140f0c; --muted:#6c6052;
  --gold:#9c7426; --gold-2:#7a5a18; --red:#a3141f; --red-fg:#a3141f; --brown:#7a4f2e; --green:#1d7a45; --amber:#9a6a00; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f1e9da; --line:#ddd0b9; --fg:#140f0c; --muted:#6c6052;
  --gold:#9c7426; --gold-2:#7a5a18; --red:#a3141f; --red-fg:#a3141f; --brown:#7a4f2e; --green:#1d7a45; --amber:#9a6a00; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.blk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--gold);padding:10px 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:46px;height:auto;flex:0 0 auto}
.brand .who{min-width:0;flex:1}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gold{color:var(--gold)}
.macro{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.macro h1{font:800 32px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.weeks{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.wk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:5px 10px;font:600 13px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:52px}
.wk small{font:500 9px var(--mono);color:var(--muted);letter-spacing:.04em}
.wk[aria-pressed="true"]{background:var(--gold);color:#140f0c;border-color:var(--gold)}
.wk[aria-pressed="true"] small{color:#140f0c}
.wkinfo{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.wkinfo b{color:var(--fg);font-weight:600}
.banner{background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:480px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 13px var(--body);padding:12px 4px 10px;cursor:pointer;position:relative}
nav.tabs button[aria-current="true"]{color:var(--fg);box-shadow:inset 0 3px 0 var(--gold)}
nav.tabs .badge{position:absolute;top:6px;margin-left:4px;background:var(--red);color:var(--on-red);font:600 10px var(--mono);border-radius:999px;padding:1px 5px}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.h2{font:700 24px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.pill{font:500 11px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.pill.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.pill.red{color:var(--red-fg);border-color:color-mix(in srgb,var(--red-fg) 45%,transparent)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--red);color:var(--on-red);font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.goldb{background:var(--gold);color:#140f0c}
.btn.sm{padding:9px 12px;font-size:15px}
.btn.inline{width:auto;display:inline-block}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.day .dn{font:800 30px/1 var(--display);text-align:center;color:var(--muted)}
.day .dn small{display:block;font:500 10px var(--mono);letter-spacing:.06em}
.day.done .dn{color:var(--gold)}
.day .t{font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.dots i.d{background:var(--gold)}.dots i.c{background:var(--red)}
.exname{font:700 26px/1.05 var(--display);text-transform:uppercase;margin:4px 0 2px;text-wrap:balance}
.load{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.load .kg{font:800 64px/1 var(--display);color:var(--fg)}
.load .u{font:600 20px var(--display);color:var(--gold)}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.spec div{background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.spec b{display:block;font:600 16px var(--mono);overflow-wrap:anywhere}
.spec span{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inputs input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:600 22px var(--mono);padding:9px 4px;text-align:center}
input.t,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:15px var(--body);padding:10px}
textarea{resize:vertical;min-height:64px}
.setlog{display:flex;flex-wrap:wrap;gap:6px}
.setlog span{font:500 12px var(--mono);background:var(--surface-2);border-radius:8px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 11px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#140f0c}
.note{border-left:3px solid var(--gold);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:3px}
.note.bad{border-color:var(--red-fg)}.note.ok{border-color:var(--green)}.note.done{opacity:.65}
.note .meta{font:500 11px var(--mono);color:var(--muted);letter-spacing:.02em}
.note .reply{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 8px}
.timer{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 95%,transparent);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.timer[hidden]{display:none}
.timer .in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ring{position:relative;width:min(78vw,280px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tt b{font:800 72px/1 var(--display);font-variant-numeric:tabular-nums}
.timer .go{color:var(--green);font-weight:600}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .v{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi .p{font-size:12px;color:var(--muted)}
.kpi .l{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.tbl.wrap td{white-space:normal;font-size:12.5px}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbl td.pl{color:var(--muted)}
.hb{display:grid;grid-template-columns:90px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.hb .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hb .tr b{display:block;height:100%;border-radius:5px}
.warn{border-left:3px solid var(--amber);padding:6px 0 6px 10px;font-size:13px}
.warn.chk{border-color:var(--red-fg)}
.warn small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px}
.file{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;position:relative}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.toast{background:color-mix(in srgb,var(--green) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:13px}
.toast.err{background:color-mix(in srgb,var(--red-fg) 14%,var(--surface));border-color:color-mix(in srgb,var(--red-fg) 40%,transparent)}
.ath{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);background:var(--surface-2);color:var(--gold);border:1px solid var(--gold)}
.link{font:500 12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
.dayplan{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.splash img{width:min(60vw,240px)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .2s ease both}@keyframes in{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<div class="app">
  <div id="banner"></div>
  <header class="blk" id="hdr" hidden></header>
  <main id="main"><div class="splash"><img src="LOGO_SRC" alt="Team Powerosso"><div class="eyebrow">Cargando tu planificación…</div></div></main>
</div>
<nav class="tabs" id="nav" hidden><div id="tabs"></div></nav>
<div class="timer" id="timer" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/*PARSER*/
const LOGO='LOGO_SRC';
const ARTIFACT_URL='https://claude.ai/artifact/4MaRbmVh4f9RWDxb79btCP';
const OBS=['Intensidad perfecta','Podría hacer más','Muy pesado','Molestia / dolor','Duda técnica'];
const EFF=7; // serie efectiva: RPE >= 7, igual que tu hoja DATOS ANÁLISIS

// ---------- almacenamiento: Supabase (versión GitHub), base del artifact (db) o este navegador ----------
const SB=window.POWEROSSO_SUPABASE||{};
const SB_ERR=e=>flash(e&&/row-level security|permission/i.test(e.message||'')?'No tienes permiso para guardar esto.':'No se pudo guardar. Revisa tu conexión.',true);
const Store={kind:'local',db:null,sb:null,q:{},subs:[],cache:{},
  async init(){ if(SB.url&&SB.anonKey&&window.supabase){ this.kind='supa'; this.sb=window.supabase.createClient(SB.url,SB.anonKey,{auth:{flowType:'pkce',persistSession:true,detectSessionInUrl:true}}); return }
    let db=null; try{ if(window.claude&&window.claude.use) db=await window.claude.use('db') }catch(e){} if(db){this.kind='db';this.db=db} },
  // filas de Supabase <-> documentos de la app
  fromRow(coll,r){ return coll==='athletes'?{...r.data,email:r.email||'',coach:!!r.coach}:r.data },
  toRow(coll,id,b){ const t=new Date().toISOString(); return coll==='athletes'?{id,email:(b.email||'').trim().toLowerCase()||null,coach:!!b.coach,data:b,updated_at:t}:{id,aid:b.aid,data:b,updated_at:t} },
  listenSupa(coll,cb){ const o=this.cache[coll]={}, cols=coll==='athletes'?'id,email,coach,data':'id,data';
    const load=async()=>{ let from=0; for(;;){ const {data,error}=await this.sb.from(coll).select(cols).range(from,from+999); if(error){flash('No se pudieron cargar los datos. Recarga la página.',true);break} data.forEach(r=>o[r.id]=this.fromRow(coll,r)); if(data.length<1000) break; from+=1000 } cb(Object.assign({},o)) };
    this.sb.channel('rt-'+coll).on('postgres_changes',{event:'*',schema:'public',table:coll},p=>{ if(p.eventType==='DELETE') delete o[p.old.id]; else o[p.new.id]=this.fromRow(coll,p.new); cb(Object.assign({},o)) }).subscribe();
    load() },
  local(){try{return JSON.parse(localStorage.getItem('powerosso.v3'))||{}}catch(e){return {}}},
  saveLocal(o){try{localStorage.setItem('powerosso.v3',JSON.stringify(o))}catch(e){}},
  listen(coll,cb){ if(this.kind==='supa') return this.listenSupa(coll,cb); if(this.kind==='db'){ return this.db.collection(coll).onSnapshot(s=>{const o={}; s.docs.forEach(d=>o[d.id]=d.data()); cb(o)}, e=>{flash('Se perdió la conexión con los datos. Recarga la página.',true)}) }
    const f=()=>cb(Object.assign({},this.local()[coll]||{})); this.subs.push(f); f(); },
  put(coll,id,body){ DATA[coll][id]=body; if(this.kind==='supa'){ this.cache[coll][id]=body; const k=coll+'/'+id; this.q[k]=(this.q[k]||Promise.resolve()).then(async()=>{const {error}=await this.sb.from(coll).upsert(this.toRow(coll,id,body)); if(error) SB_ERR(error)}); return this.q[k] }
    if(this.kind==='db'){ const k=coll+'/'+id; this.q[k]=(this.q[k]||Promise.resolve()).then(()=>this.db.collection(coll).doc(id).set(body)).catch(e=>flash(e&&e.code==='invalid_argument'?'No tienes permiso para guardar aquí. Pide a tu coach que te comparta la app como editor.':e&&e.code==='quota_exceeded'?'La base de datos está llena.':'No se pudo guardar. Revisa tu conexión.',true)); return this.q[k] }
    const o=this.local(); (o[coll]=o[coll]||{})[id]=body; this.saveLocal(o); return Promise.resolve() },
  del(coll,id){ delete DATA[coll][id]; if(this.kind==='supa'){ delete this.cache[coll][id]; return this.sb.from(coll).delete().eq('id',id).then(({error})=>error&&SB_ERR(error)) }
    if(this.kind==='db') return this.db.collection(coll).doc(id).delete().catch(()=>{}); const o=this.local(); if(o[coll]) delete o[coll][id]; this.saveLocal(o); return Promise.resolve() }
};
const DATA={athletes:{},logs:{},notes:{}};
const S={ready:0, isCoach:false, mode:'loading', aid:null, coachAid:null, tab:'entrenar', ctab:'alumnos', view:'dias', week:null, day:null, ex:0, toast:'', toastErr:false, confirm:null, importMsg:null, obsOpen:false, obsTag:null, timer:null, pending:null, adding:false};
function flash(msg,err){S.toast=msg;S.toastErr=!!err;render()}

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>n==null||isNaN(n)?'—':(+n).toLocaleString('es-CL',{maximumFractionDigits:d,minimumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const title=s=>esc(s).toLowerCase().replace(/(^|[\s(–-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const fmtRest=s=>s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:`${s} s`;
const e1rm=(kg,r,rpe)=>kg*(1+(r+(10-rpe))/30);
const fdate=ts=>{try{return new Date(ts).toLocaleDateString('es-CL',{day:'numeric',month:'short'})}catch(e){return ''}};
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||'alumno';
const rnd=()=>Math.random().toString(36).slice(2,6);
const ATH=()=>DATA.athletes[S.aid];
const PLAN=()=>ATH()&&ATH().plan;
const wkObj=n=>PLAN().weeks.find(w=>w.n===n);
const logId=(aid,w,d)=>`${aid}~${w}-${d}`;
const dayLog=(w,d,aid=S.aid)=>DATA.logs[logId(aid,w,d)];
const dayName=d=>d.weekday?title(d.weekday):`Día ${d.n}`;
const dayShort=d=>d.weekday?title(d.weekday).slice(0,3):`D${d.n}`;
const phase=w=>esc(String(w.label||'').replace(/^SEMANA\s*\d+\s*[·:–-]?\s*/i,'').trim());
const notesOf=aid=>Object.entries(DATA.notes).filter(([k,n])=>n.aid===aid).map(([id,n])=>({id,...n})).sort((a,b)=>b.at-a.at);
const unread=aid=>notesOf(aid).filter(n=>!n.reviewed).length;
const APP_URL=()=>location.origin+location.pathname;
const linkFor=aid=>Store.kind==='supa'?APP_URL():`${Store.kind==='db'?ARTIFACT_URL:location.href.split('#')[0]}#${aid}`;
const me=()=>esc(S.email||'');
const sessionLine=()=>Store.kind==='supa'?`<div class="muted small" style="margin-top:14px">Conectado como ${me()} · <button class="chip" data-act="logout">Cerrar sesión</button></div>`:'';

// ---------- métricas (mismas definiciones que tu DASHBOARD) ----------
function planMetrics(day){let t=0,c=0,s=0,e=0,rs=0,rn=0;
  day.exercises.forEach(x=>{const kg=x.kg||0, reps=x.repsN||0; t+=kg*reps*x.sets; c+=kg*reps*x.sets*(x.rpeN||0)/10; s+=x.sets; if((x.rpeN||0)>=EFF)e+=x.sets; if(x.rpeN){rs+=x.rpeN*x.sets;rn+=x.sets}});
  return {ton:t,carga:c,series:s,eff:e,rpe:rn?rs/rn:null,_r:rs,_n:rn}}
function realMetrics(log){let t=0,c=0,s=0,e=0,rs=0,rn=0; if(!log) return {ton:0,carga:0,series:0,eff:0,rpe:null,_r:0,_n:0};
  Object.values(log.sets||{}).forEach(arr=>arr.forEach(st=>{const kg=+st.kg||0,r=+st.reps||0,rpe=+st.rpe||0; t+=kg*r; c+=kg*r*rpe/10; s++; if(rpe>=EFF)e++; if(rpe){rs+=rpe;rn++}}));
  return {ton:t,carga:c,series:s,eff:e,rpe:rn?rs/rn:null,_r:rs,_n:rn}}
function weekMetrics(w,real){const a={ton:0,carga:0,series:0,eff:0,_r:0,_n:0};
  w.days.forEach(d=>{const m=real?realMetrics(dayLog(w.n,d.n)):planMetrics(d); for(const k in a)a[k]+=m[k]}); a.rpe=a._n?a._r/a._n:null; return a}
function heaviest(w,cat){let plan=null,real=null;
  w.days.forEach(d=>d.exercises.forEach((x,i)=>{ if(LIFT(x.name)!==cat) return; if(x.kg!=null) plan=Math.max(plan||0,x.kg); const st=(dayLog(w.n,d.n)||{sets:{}}).sets[i]; if(st&&st.length) real=Math.max(real||0,...st.map(s=>+s.kg||0)) }));
  return {plan,real}}
function weekDone(w,aid=S.aid){return w.days.filter(d=>(dayLog(w.n,d.n,aid)||{}).done).length}
function currentWeek(aid=S.aid){const W=DATA.athletes[aid].plan.weeks; let last=-1; W.forEach((w,i)=>{ if(w.days.some(d=>dayLog(w.n,d.n,aid))) last=i }); if(last<0) return W[0].n; const w=W[last]; if(w.days.every(d=>(dayLog(w.n,d.n,aid)||{}).done) && W[last+1]) return W[last+1].n; return w.n}

function brand(sub,name){return `<div class="brand"><img src="${LOGO}" alt="Team Powerosso"><div class="who"><div class="eyebrow">${sub}</div><div style="font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em">${name}</div></div></div>`}
function athleteHeader(){const a=ATH(), P=a.plan, w=wkObj(S.week), pm=weekMetrics(w,false), done=weekDone(w);
  const rpes=w.days.flatMap(d=>d.exercises.map(x=>x.rpeN).filter(Boolean)); const ph=phase(w);
  return `<div class="brand"><img src="${LOGO}" alt="Team Powerosso"><div class="who"><div class="eyebrow">Macrobloque · ${esc(a.name)}</div>
    <div class="macro"><h1>${esc(P.macro)}</h1><span class="pill ${w.deload?'warn':'gold'}">${w.deload?'Descarga':'Semana '+w.n}</span></div></div></div>
  <div class="weeks" role="group" aria-label="Semana">${P.weeks.map(x=>{const dn=weekDone(x);return `<button class="wk" data-week="${x.n}" aria-pressed="${x.n===S.week}">S${x.n}<small>${x.deload?'DESC.':dn+'/'+x.days.length}</small></button>`}).join('')}</div>
  <div class="wkinfo">${ph?`<span><b>${title(ph)}</b></span>`:''}<span>${w.days.length} sesiones · ${w.days.map(dayShort).join(' · ')}</span>${rpes.length?`<span>RPE plan <b class="num">${fmt(Math.min(...rpes),1)}–${fmt(Math.max(...rpes),1)}</b></span>`:''}<span>Tonelaje plan <b class="num">${fmt(pm.ton/1000,1)} t</b></span><span>Hechas <b class="num">${done}/${w.days.length}</b></span></div>`}

function vDias(){const w=wkObj(S.week), P=PLAN();
  const det=P.details?`<div class="card small"><div class="eyebrow" style="margin-bottom:4px">${esc(P.title||'Detalles del bloque')}</div>${esc(P.details).split(/ · (?![^(]*\))/).map(s=>`<div>${s}</div>`).join('')}</div>`:'';
  return `${toastHtml()}<h2 class="h2">¿Qué día entrenas hoy?</h2>
  ${w.days.map(d=>{const L=dayLog(w.n,d.n), pm=planMetrics(d), done=L&&L.done, nSets=d.exercises.reduce((a,x)=>a+x.sets,0), doneSets=L?Object.values(L.sets||{}).reduce((a,s)=>a+s.length,0):0;
    return `<button class="card day ${done?'done':''}" data-day="${d.n}"><div class="dn">${d.n}<small>${dayShort(d).toUpperCase()}</small></div>
    <div><div class="t">${title(d.focus)||dayName(d)}</div><div class="small muted">${d.exercises.length} ejercicios · ${nSets} series · ${fmt(pm.ton/1000,1)} t plan</div>${L&&!done?`<div class="bar" style="margin-top:6px"><b style="width:${100*doneSets/nSets}%"></b></div>`:''}</div>
    <span class="pill ${done?'ok':L?'warn':''}">${done?'Hecho':L?'En curso':'Pendiente'}</span></button>`}).join('')}${det}`}

function ensureLog(){const id=logId(S.aid,S.week,S.day); if(DATA.logs[id]&&Object.isFrozen(DATA.logs[id])) DATA.logs[id]=JSON.parse(JSON.stringify(DATA.logs[id])); if(!DATA.logs[id]) DATA.logs[id]={aid:S.aid,w:S.week,d:S.day,sets:{},done:false,date:new Date().toISOString().slice(0,10)}; return DATA.logs[id]}
function saveLog(){const id=logId(S.aid,S.week,S.day); const L=JSON.parse(JSON.stringify(DATA.logs[id])); L.updatedAt=Date.now(); Store.put('logs',id,L)}

function exNotes(w,d,i){return notesOf(S.aid).filter(n=>n.w===w&&n.d===d&&n.ex===i)}
function noteHtml(n,coach){const cls=/Molestia|pesado/.test(n.tag||'')?'bad':/más/.test(n.tag||'')?'ok':'';
  return `<div class="note ${cls} ${n.reviewed&&coach?'done':''}"><div class="meta">${coach?esc(DATA.athletes[n.aid]?.name||'')+' · ':''}S${n.w} · ${esc(n.dayLabel||'Día '+n.d)} · ${fdate(n.at)}</div>
  ${n.exName?`<div class="small muted">${title(n.exName)}</div>`:''}
  <div>${n.tag?`<b>${esc(n.tag)}</b>${n.text?' · ':''}`:''}${esc(n.text||'')}</div>
  ${n.reply?`<div class="reply"><span class="gold">Coach:</span> ${esc(n.reply)}</div>`:''}
  ${coach?`<div class="row" style="justify-content:flex-start;gap:6px;margin-top:4px">${S.replyTo===n.id?'':`<button class="chip" data-reply="${n.id}">Responder</button>`}<button class="chip" data-review="${n.id}" aria-pressed="${!!n.reviewed}">${n.reviewed?'Revisada':'Marcar revisada'}</button></div>
  ${S.replyTo===n.id?`<textarea id="reply-txt" placeholder="Tu respuesta para ${esc(DATA.athletes[n.aid]?.name||'el alumno')}">${esc(n.reply||'')}</textarea><div class="btns"><button class="btn ghost sm" data-act="reply-cancel">Cancelar</button><button class="btn goldb sm" data-act="reply-save" data-id="${n.id}">Guardar respuesta</button></div>`:''}`:''}</div>`}

function vSesion(){const w=wkObj(S.week), d=w.days.find(x=>x.n===S.day), L=ensureLog(); const x=d.exercises[S.ex]; const done=(L.sets[S.ex]||[]);
  const allDone=done.length>=x.sets, next=d.exercises[S.ex+1], last=done[done.length-1];
  const kgTxt=x.kg!=null?`<span class="kg num">${fmt(x.kg,1)}</span><span class="u">kg</span>`:`<span class="kg" style="font-size:40px">${esc(x.load?title(x.load):'A criterio')}</span>`;
  const def={kg:last?last.kg??'':(x.kg??''), reps:last?last.reps:(/AMRAP|>=/i.test(x.reps)?'':(parseInt(x.reps)||'')), rpe:last?last.rpe??'':(x.rpeN||'')};
  const ns=exNotes(S.week,S.day,S.ex);
  return `<div class="row"><button class="btn ghost sm inline" data-act="back">← Días</button><span class="eyebrow">${dayName(d)} · ${title(d.focus)}</span></div>
  <div class="dots" aria-label="Ejercicio ${S.ex+1} de ${d.exercises.length}">${d.exercises.map((e,i)=>`<i class="${(L.sets[i]||[]).length>=e.sets?'d':i===S.ex?'c':''}"></i>`).join('')}</div>
  <div class="card">
    <div class="row"><span class="eyebrow">Ejercicio ${S.ex+1} de ${d.exercises.length}</span><span class="pill">${x.pct?`${fmt(x.pct*100)} % RM`:LIFT(x.name)==='Accesorio'?'Accesorio':LIFT(x.name)}</span></div>
    <div class="exname">${title(x.name)}</div>
    <div class="load">${kgTxt}${x.range?`<span class="muted num small">rango ${esc(x.range)}</span>`:''}</div>
    <div class="spec"><div><b>${x.sets}</b><span>Series</span></div><div><b>${esc(x.reps||'—')}</b><span>Reps</span></div><div><b>${esc(x.rpe??'—')}</b><span>RPE</span></div><div><b>${fmtRest(x.rest.max)}</b><span>Descanso</span></div></div>
  </div>
  ${toastHtml()}
  ${done.length?`<div class="setlog">${done.map((s,i)=>`<span>S${i+1} · ${s.kg!=null&&s.kg!==''?fmt(+s.kg,1)+'×':''}${s.reps} @${fmt(+s.rpe,1)}</span>`).join('')}</div>`:''}
  ${!allDone?`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Serie ${done.length+1} de ${x.sets}${/AMRAP|FALLO|>=/i.test(x.reps+x.name)?' · anota cuántas hiciste':''}</div>
    <div class="inputs"><label class="f">kg<input id="in-kg" inputmode="decimal" value="${esc(def.kg)}"></label><label class="f">reps<input id="in-reps" inputmode="numeric" value="${esc(def.reps)}" placeholder="?"></label><label class="f">RPE<input id="in-rpe" inputmode="decimal" value="${esc(def.rpe)}"></label></div>
    <button class="btn" style="margin-top:10px" data-act="set">Serie hecha · descanso ${fmtRest(x.rest.max)}</button></div>`:
    `<div class="card"><div class="row"><b>Ejercicio completo</b><span class="pill ok">${done.length}/${x.sets} series</span></div>
     ${next?`<div class="small muted" style="margin-top:6px">Siguiente: <b style="color:var(--fg)">${title(next.name)}</b> · ${next.kg!=null?fmt(next.kg,1)+' kg':esc(next.load||'')} · ${next.sets}×${esc(next.reps)}</div>`:''}
     <button class="btn" style="margin-top:10px" data-act="${next?'nextex':'finish'}">${next?'Siguiente ejercicio':'Terminar sesión'}</button></div>`}
  <div class="card"><div class="row"><span class="eyebrow">Observación para tu coach</span>${ns.length?`<span class="pill gold">${ns.length}</span>`:''}</div>
    ${ns.map(n=>noteHtml(n,false)).join('')}
    ${S.obsOpen?`<div class="chips" style="margin-top:8px">${OBS.map(o=>`<button class="chip" data-obs="${o}" aria-pressed="${S.obsTag===o}">${o}</button>`).join('')}</div>
      <textarea id="obs-txt" style="margin-top:8px" placeholder="Cuéntale a tu coach cómo se sintió (opcional)"></textarea>
      <div class="btns" style="margin-top:8px"><button class="btn ghost sm" data-act="obs-cancel">Cancelar</button><button class="btn goldb sm" data-act="obs-save">Guardar observación</button></div>`
    :`<button class="btn ghost sm" style="margin-top:8px" data-act="obs-open">Dejar observación</button>`}</div>
  <div class="btns"><button class="btn ghost sm" data-act="prevex" ${S.ex?'':'disabled'}>Anterior</button><button class="btn ghost sm" data-act="${next?'skip':'finish'}">${next?'Saltar ejercicio':'Terminar sesión'}</button></div>`}

function vResumen(){const w=wkObj(S.week), d=w.days.find(x=>x.n===S.day), L=dayLog(w.n,d.n), pm=planMetrics(d), rm=realMetrics(L);
  return `<div class="eyebrow">Semana ${w.n} · ${dayName(d)}</div><h2 class="h2">Resumen · ${title(d.focus)}</h2>
  ${kpis(rm,pm)}${dayTable(w,d,false)}
  <button class="btn" data-act="todash">Ver dashboard de la semana</button><button class="btn ghost" data-act="back">Volver a los días</button>`}

function dayTable(w,d,coach){const L=dayLog(w.n,d.n);
  return `<div class="card"><div class="eyebrow" style="margin-bottom:6px">${coach?`${dayName(d)} · ${title(d.focus)}`:'Lo que hiciste'}</div><div class="tbl wrap"><table><thead><tr><th>Ejercicio</th><th>Plan</th><th>Real</th></tr></thead><tbody>
  ${d.exercises.map((x,i)=>{const st=(L&&L.sets[i])||[]; const best=st.length?st.reduce((a,s)=>(+s.kg>=+a.kg?s:a)):null; const ns=exNotes(w.n,d.n,i);
    return `<tr><td>${title(x.name)}${ns.length?`<div class="small gold">${ns.map(n=>esc(n.tag||'Nota')+(n.text?': '+esc(n.text):'')).join('<br>')}</div>`:''}</td><td class="pl num">${x.sets}×${esc(x.reps)}${x.kg!=null?'<br>'+fmt(x.kg,1)+' kg':''}${x.rpe!=null?' @'+esc(x.rpe):''}</td><td class="num">${st.length?`${st.length}/${x.sets}<br>${best.kg!=null&&best.kg!==''?fmt(+best.kg,1)+'×':''}${best.reps} @${fmt(+best.rpe,1)}`:'<span class="muted">—</span>'}</td></tr>`}).join('')}
  </tbody></table></div></div>`}

function kpis(r,p){const k=(l,v,pv,u='')=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}${u}</div><div class="p">plan ${pv}${u}</div></div>`;
  return `<div class="kpis">${k('Tonelaje',fmt(r.ton/1000,2),fmt(p.ton/1000,2),' t')}${k('Carga (kg×RPE/10)',fmt(r.carga/1000,2),fmt(p.carga/1000,2),' t')}${k('Series efectivas',fmt(r.eff),fmt(p.eff))}${k('RPE medio',fmt(r.rpe,1),fmt(p.rpe,1))}</div>`}

function vDash(){const w=wkObj(S.week), rm=weekMetrics(w,true), pm=weekMetrics(w,false), done=weekDone(w);
  const ex=w.days.flatMap(d=>{const L=dayLog(w.n,d.n); return L?d.exercises.map((x,i)=>({d,x,st:(L.sets||{})[i]||[]})).filter(o=>o.st.length):[]});
  const cats={'Sentadilla':0,'Banca':0,'Peso muerto':0,'Accesorio':0}; ex.forEach(o=>o.st.forEach(s=>cats[LIFT(o.x.name)]+=(+s.kg||0)*(+s.reps||0)));
  const cmax=Math.max(1,...Object.values(cats)); const ccol={'Sentadilla':'var(--red)','Banca':'var(--gold)','Peso muerto':'var(--brown)','Accesorio':'var(--muted)'};
  return `<div class="row"><div><div class="eyebrow">Semana ${w.n}${phase(w)?' · '+title(phase(w)):''}</div><h2 class="h2">Dashboard semanal</h2></div><span class="pill ${done===w.days.length?'ok':'warn'}">${done}/${w.days.length} sesiones</span></div>
  ${kpis(rm,pm)}
  <div class="card"><div class="row"><span class="eyebrow">Tonelaje por día</span><span class="legend"><span><i style="background:var(--surface-2);outline:1px solid var(--line)"></i>Plan</span><span><i style="background:var(--red)"></i>Real</span></span></div>${dayChart(w)}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Tonelaje real por levantamiento</div><div style="display:flex;flex-direction:column;gap:8px">
  ${Object.entries(cats).map(([c,v])=>`<div class="hb"><span>${c}</span><div class="tr"><b style="width:${100*v/cmax}%;background:${ccol[c]}"></b></div><span class="num" style="text-align:right">${fmt(v/1000,2)} t</span></div>`).join('')}</div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Peso más alto por semana (kg)</div>${topTable()}<div class="muted small" style="margin-top:6px">Número fuerte = levantado en la app · gris = planificado.</div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Ejercicios realizados con la app</div>
  ${ex.length?`<div class="tbl"><table><thead><tr><th>Ejercicio</th><th>Día</th><th>Series</th><th>Mejor</th><th>e1RM</th></tr></thead><tbody>${ex.map(o=>{const b=o.st.reduce((a,s)=>(+s.kg>=+a.kg?s:a)); const e=(o.x.kg!=null&&+b.reps&&+b.kg)?e1rm(+b.kg,+b.reps,+b.rpe||8):null; return `<tr><td>${title(o.x.name)}</td><td>${dayShort(o.d)}</td><td class="num">${o.st.length}/${o.x.sets}</td><td class="num">${b.kg!=null&&b.kg!==''?fmt(+b.kg,1):esc(title(o.x.load||'—'))}×${b.reps}</td><td class="num">${LIFT(o.x.name)!=='Accesorio'&&e?fmt(e,0):'—'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="muted">Todavía no hay sesiones registradas esta semana. Empieza un día desde Entrenar.</div>`}</div>`}

function dayChart(w){const W=320,H=150,P=26,bw=(W-P)/w.days.length; const vals=w.days.map(d=>({p:planMetrics(d).ton,r:realMetrics(dayLog(w.n,d.n)).ton}));
  const mx=Math.max(1,...vals.flatMap(v=>[v.p,v.r])); const step=mx>20000?10000:mx>8000?5000:2000; const top=Math.ceil(mx/step)*step; const y=v=>H-18-(v/top)*(H-30);
  let g=''; for(let t=0;t<=top;t+=step){g+=`<line x1="${P}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P-4}" y="${y(t)+3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t/1000}t</text>`}
  const bars=vals.map((v,i)=>{const x=P+i*bw+bw*0.15, b=bw*0.34; return `<rect x="${x}" y="${y(v.p)}" width="${b}" height="${H-18-y(v.p)}" rx="2" fill="var(--surface-2)" stroke="var(--line)"/><rect x="${x+b+2}" y="${y(v.r)}" width="${b}" height="${H-18-y(v.r)}" rx="2" fill="var(--red)"/><text x="${x+b}" y="${H-4}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${dayShort(w.days[i])}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tonelaje plan y real por día">${g}${bars}</svg>`}

function topTable(){const W=PLAN().weeks.filter(w=>!w.deload);
  return `<div class="tbl"><table><thead><tr><th>Levantamiento</th>${W.map(w=>`<th>S${w.n}</th>`).join('')}</tr></thead><tbody>
  ${['Sentadilla','Banca','Peso muerto'].map(c=>`<tr><td>${c}</td>${W.map(w=>{const h=heaviest(w,c); return h.real?`<td class="num"><b>${fmt(h.real,1)}</b></td>`:`<td class="num pl">${h.plan!=null?fmt(h.plan,1):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}

function vMisNotas(){const ns=notesOf(S.aid);

    <label class="file" style="margin-top:10px"><input type="file" id="new-xlsx" accept=".xlsx,.xls,.xlsm"><b>Elegir su planificación (.xlsx)</b><span class="muted small" id="new-file-lbl">La app busca sola la hoja con SEMANA / DÍA / EJERCICIO.</span></label>

  :`<button class="btn goldb" data-act="add">Agregar alumno</button>`}
  ${Store.kind==='local'?`<div class="muted small">Modo sin conexión: los datos se guardan solo en este navegador.</div>`:''}${sessionLine()}`}

function vNotasCoach(){const all=Object.entries(DATA.notes).map(([id,n])=>({id,...n})).sort((a,b)=>(a.reviewed?1:0)-(b.reviewed?1:0)||b.at-a.at);
  const f=S.nfilter||''; const shown=all.filter(n=>!f||n.aid===f);
  const ids=[...new Set(all.map(n=>n.aid))];
  return `<h2 class="h2">Observaciones</h2>
  <div class="chips"><button class="chip" data-nf="" aria-pressed="${!f}">Todos</button>${ids.map(id=>`<button class="chip" data-nf="${id}" aria-pressed="${f===id}">${esc(DATA.athletes[id]?.name||id)}${unread(id)?` · ${unread(id)}`:''}</button>`).join('')}</div>
  ${shown.length?`<div class="card" style="display:flex;flex-direction:column;gap:12px">${shown.map(n=>noteHtml(n,true)).join('')}</div>`:`<div class="card muted">Sin observaciones todavía. Aparecen aquí cuando un alumno deja una en un ejercicio.</div>`}`}

function vCoachAthlete(){const a=ATH(), w=wkObj(S.week); const sub=S.csub||'rutina';
  const tabs=[['rutina','Rutina'],['dash','Dashboard'],['notas','Observaciones'+(unread(S.aid)?` (${unread(S.aid)})`:'')],['cargar','Cargar Excel']];
  let body='';
  if(sub==='rutina') body=w.days.map(d=>dayTable(w,d,true)).join('');
  if(sub==='dash') body=vDash();
  if(sub==='notas'){const ns=notesOf(S.aid); body=ns.length?`<div class="card" style="display:flex;flex-direction:column;gap:12px">${ns.map(n=>noteHtml(n,true)).join('')}</div>`:`<div class="card muted">${esc(a.name)} todavía no deja observaciones.</div>`}
  if(sub==='cargar') body=vCargar();
  return `<div class="row"><button class="btn ghost sm inline" data-act="coach-back">← Alumnos</button>${a.coach?'':`<button class="chip" data-copy="${S.aid}">Copiar link</button>`}</div>
  ${toastHtml()}<div class="chips">${tabs.map(([k,l])=>`<button class="chip" data-csub="${k}" aria-pressed="${sub===k}">${l}</button>`).join('')}</div>${body}`}

function vCargar(){const P=PLAN(), w=P.weeks, nEx=w.reduce((a,x)=>a+x.days.reduce((b,d)=>b+d.exercises.length,0),0);
  const chk=(P.warnings||[]).filter(x=>x.kind==='check'), miss=(P.warnings||[]).filter(x=>x.kind!=='check');
  const W=a=>a.map(x=>`<div class="warn ${x.kind==='check'?'chk':''}">${esc(x.msg)}<small>Fila ${x.row} · ${esc(x.where||'')}</small></div>`).join('');
  const params=Object.entries(P.params||{});
  return `${S.importMsg?`<div class="toast">${esc(S.importMsg)}</div>`:''}
  <div class="card"><div class="eyebrow">Hoja “${esc(P.sheet)}”</div><div style="font-weight:600;margin-top:2px">${esc(P.title)}</div>
  <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="l">Semanas</div><div class="v">${w.length}</div><div class="p">S${w[0].n}–S${w[w.length-1].n}${w.some(x=>x.deload)?' · con descarga':''}</div></div><div class="kpi"><div class="l">Ejercicios</div><div class="v">${nEx}</div><div class="p">${w.reduce((a,x)=>a+x.days.length,0)} sesiones</div></div></div>
  ${params.length?`<div class="tbl" style="margin-top:10px"><table><tbody>${params.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${fmt(v,1)}</td></tr>`).join('')}</tbody></table></div>`:''}</div>
  <label class="file card"><input type="file" id="xlsx" accept=".xlsx,.xls,.xlsm"><b>Reemplazar con otro Excel</b><span class="muted small">Los registros que ya hizo se mantienen.</span></label>
  ${chk.length?`<div class="card"><div class="row" style="margin-bottom:6px"><span class="eyebrow">Revisa en la planilla</span><span class="pill red">${chk.length}</span></div>${W(chk)}</div>`:''}
  ${miss.length?`<div class="card"><div class="row" style="margin-bottom:6px"><span class="eyebrow">Datos que faltan</span><span class="pill warn">${miss.length}</span></div>${W(miss)}<div class="muted small" style="margin-top:6px">El alumno los ve “a criterio”, 1 serie, con 2 min de descanso por defecto.</div></div>`:''}`}

function toastHtml(){return S.toast?`<div class="toast ${S.toastErr?'err':''}">${esc(S.toast)}</div>`:''}

// ---------- temporizador ----------
let ac=null, tick=null, wake=null;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.21)})}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(rest,label){S.timer={end:Date.now()+rest.max*1000,total:rest.max,min:rest.min,label,beeped:false};
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  clearInterval(tick); tick=setInterval(drawTimer,250); drawTimer()}
function stopTimer(){clearInterval(tick);S.timer=null;$('#timer').hidden=true;try{wake&&wake.release()}catch(e){}wake=null}
function drawTimer(){const T=S.timer; if(!T) return; const left=Math.max(0,Math.round((T.end-Date.now())/1000)); const el=$('#timer'); el.hidden=false;
  const ready=(T.total-left)>=T.min; if(left===0&&!T.beeped){T.beeped=true;beep()}
  const C=2*Math.PI*54, frac=T.total?left/T.total:0;
  el.innerHTML=`<div class="in"><img src="${LOGO}" alt="" style="width:64px"><div class="eyebrow">Descanso</div><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle cx="60" cy="60" r="54" fill="none" stroke="${left===0?'var(--green)':'var(--gold)'}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><div class="tt"><b>${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b><span class="muted num">de ${fmtRest(T.total)}</span></div></div>
  <div class="${ready?'go':'muted'}">${left===0?'¡A la barra!':ready?'Ya cumpliste el mínimo ('+fmtRest(T.min)+'). Puedes ir cuando estés listo.':'Mínimo recomendado '+fmtRest(T.min)}</div>
  <div class="small muted">${esc(T.label)}</div>
  <div class="btns3"><button class="btn ghost sm" data-t="-15">−15 s</button><button class="btn ghost sm" data-t="+30">+30 s</button><button class="btn sm" data-t="skip">${left===0?'Listo':'Saltar'}</button></div></div>`}

// ---------- render ----------
function vLogin(){return `<div class="splash"><img src="${LOGO}" alt="Team Powerosso"><h2 class="h2">Powerosso App</h2>${toastHtml()}
  ${S.sent?`<div class="muted">Te enviamos un correo a <b>${esc(S.sent)}</b>. Ábrelo en este mismo teléfono y toca el link para entrar.</div>
    <label class="f" style="margin-top:12px;text-align:left">¿El correo trae un código? Escríbelo aquí<input class="t" id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></label>
    <div class="btns" style="margin-top:10px"><button class="btn ghost sm" data-act="login-back">Usar otro email</button><button class="btn goldb sm" data-act="login-code">Entrar con código</button></div>`
  :`<div class="muted">Entra con el email que le diste a tu coach. Te llega un link para entrar, sin contraseña.</div>
    <label class="f" style="margin-top:12px;text-align:left">Tu email<input class="t" type="email" id="login-email" autocomplete="email" placeholder="tu@correo.com"></label>
    <button class="btn goldb" style="margin-top:10px" data-act="login-send">Enviarme el link</button>`}</div>`}

function render(){
  const hdr=$('#hdr'), nav=$('#nav'), ban=$('#banner');
  if(S.mode==='loading') return;
  if(S.mode==='login'){hdr.hidden=true;nav.hidden=true;ban.innerHTML='';$('#main').innerHTML=vLogin();return}
  if(S.mode==='nolink'){hdr.hidden=true;nav.hidden=true;ban.innerHTML='';$('#main').innerHTML=`<div class="splash"><img src="${LOGO}" alt="Team Powerosso"><h2 class="h2">Powerosso App</h2>${toastHtml()}<div class="muted">${Store.kind==='supa'?`El email ${me()} todavía no tiene una planificación asignada. Pídele a tu coach que lo agregue.`:'Abre el link personal que te envió tu coach para ver tu planificación.'}</div>${sessionLine()}</div>`;return}
  if(S.mode==='athlete'){
    if(!ATH()){S.mode=S.isCoach?'coach':'nolink';return render()}
    if(S.week==null||!wkObj(S.week)) S.week=currentWeek();
    ban.innerHTML=S.isCoach?`<div class="banner"><span>Estás viendo la app como <b>${esc(ATH().name)}</b></span><button class="chip" data-act="to-coach">Volver al panel</button></div>`:'';
    hdr.hidden=false; hdr.innerHTML=athleteHeader();
    const un=notesOf(S.aid).filter(n=>n.reply&&!n.seen).length;
    $('#main').innerHTML=S.tab==='dashboard'?vDash():S.tab==='notas'?vMisNotas()+(S.isCoach?'':sessionLine()):S.view==='sesion'?vSesion():S.view==='resumen'?vResumen():vDias();
    nav.hidden=false; $('#tabs').innerHTML=[['entrenar','Entrenar'],['dashboard','Dashboard'],['notas','Mis notas']].map(([k,l])=>`<button data-tab="${k}" aria-current="${S.tab===k}">${l}${k==='notas'&&un?`<span class="badge">${un}</span>`:''}</button>`).join('');
  } else { // coach
    ban.innerHTML='';
    if(S.ctab==='alumno'&&ATH()){ if(S.week==null||!wkObj(S.week)) S.week=currentWeek(); hdr.hidden=false; hdr.innerHTML=athleteHeader(); $('#main').innerHTML=vCoachAthlete() }
    else { if(S.ctab==='alumno') S.ctab='alumnos'; hdr.hidden=false; hdr.innerHTML=brand('Team Powerosso','Panel del coach'); $('#main').innerHTML=S.ctab==='notas'?vNotasCoach():vAlumnos() }
    const un=Object.values(DATA.notes).filter(n=>!n.reviewed).length;
    nav.hidden=false; $('#tabs').innerHTML=[['alumnos','Alumnos'],['notas','Observaciones']].map(([k,l])=>`<button data-ctab="${k}" aria-current="${S.ctab===k||(k==='alumnos'&&S.ctab==='alumno')}">${l}${k==='notas'&&un?`<span class="badge">${un}</span>`:''}</button>`).join('');
  }
  const f=$('#xlsx'); if(f) f.addEventListener('change',e=>readXlsx(e.target.files[0],p=>{const a=JSON.parse(JSON.stringify(ATH())); a.plan=p; a.updatedAt=Date.now(); Store.put('athletes',S.aid,a); S.week=null; S.importMsg=`Cargada la hoja “${p.sheet}”: ${p.weeks.length} semanas.`; render()}));
  const nf=$('#new-xlsx'); if(nf) nf.addEventListener('change',e=>{const file=e.target.files[0]; if(!file) return; readXlsx(file,p=>{S.pending=p; $('#new-file-lbl').textContent=`Lista: hoja “${p.sheet}”, ${p.weeks.length} semanas.`})});
}
function nextLabel(){const d=wkObj(S.week).days.find(x=>x.n===S.day), x=d.exercises[S.ex], n=(ensureLog().sets[S.ex]||[]).length;
  if(n<x.sets) return `Siguiente: serie ${n+1} de ${x.sets} · ${title(x.name)}`; const nx=d.exercises[S.ex+1]; return nx?`Siguiente ejercicio: ${title(nx.name)}`:'Última serie del día'}
function readXlsx(file,ok){ if(!file) return; if(typeof XLSX==='undefined'){flash('No se pudo cargar el lector de Excel. Revisa tu conexión.',true);return}
  const rd=new FileReader(); rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'}); let best=null;
    for(const n of wb.SheetNames){const ws=wb.Sheets[n]; if(!ws['!ref']) continue; const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
      const p=parsePlan(rows,n,XLSX.utils.decode_range(ws['!ref']).s.r+1); const ex=p.weeks.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.exercises.length,0),0);
      if(ex && (!best||ex>best.ex)) best={p,ex}}
    if(!best) return flash(`No encontré una hoja con el formato SEMANA / DÍA / EJERCICIO en “${file.name}”.`,true);
    ok(best.p)}catch(err){flash('No pude leer ese archivo. ¿Es un .xlsx?',true)}};
  rd.readAsArrayBuffer(file)}
function copy(txt){try{navigator.clipboard.writeText(txt).then(()=>flash('Link copiado.')).catch(()=>flash('Mantén presionado el link para copiarlo.'))}catch(e){flash('Mantén presionado el link para copiarlo.')}}

document.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; const a=b.dataset;
  if(a.t){ if(!S.timer) return; if(a.t==='skip') return stopTimer(); S.timer.end+=(a.t==='+30'?30:-15)*1000; S.timer.beeped=false; return drawTimer() }
  if(a.week){S.week=+a.week; S.view='dias'; S.toast=''; return render()}
  if(a.tab){S.tab=a.tab; S.toast=''; if(a.tab==='entrenar'&&S.view==='resumen')S.view='dias';
    if(a.tab==='notas'){ notesOf(S.aid).filter(n=>n.reply&&!n.seen).forEach(n=>{const {id,...body}=n; Store.put('notes',id,{...body,seen:true})}) } return render()}
  if(a.ctab){S.ctab=a.ctab; S.toast=''; S.replyTo=null; return render()}
  if(a.open){S.aid=a.open; S.ctab='alumno'; S.csub='rutina'; S.week=null; S.toast=''; S.importMsg=null; return render()}
  if(a.train){location.hash=a.train; return}
  if(a.copy) return copy(linkFor(a.copy));
  if(a.email){ const v=($('#em-'+a.email).value||'').trim().toLowerCase(); if(v&&!/^\S+@\S+\.\S+$/.test(v)) return flash('Revisa el email.',true);
    if(v&&Object.entries(DATA.athletes).some(([k,x])=>k!==a.email&&(x.email||'')===v)) return flash('Ese email ya está asignado a otro alumno.',true);
    const at=JSON.parse(JSON.stringify(DATA.athletes[a.email])); at.email=v; Store.put('athletes',a.email,at); return flash(v?`Email guardado. ${at.name.split(' ')[0]} ya puede entrar con ${v}.`:'Email borrado.') }
  if(a.csub){S.csub=a.csub; S.importMsg=null; return render()}
  if(a.nf!==undefined){S.nfilter=a.nf; return render()}
  if(a.review){const n=DATA.notes[a.review]; Store.put('notes',a.review,{...n,reviewed:!n.reviewed}); return render()}
  if(a.reply){S.replyTo=a.reply; render(); const t=$('#reply-txt'); t&&t.focus(); return}
  if(a.day){S.day=+a.day; S.view='sesion'; S.toast=''; S.obsOpen=false; const L=dayLog(S.week,S.day), d=wkObj(S.week).days.find(x=>x.n===S.day);
    S.ex=L?Math.max(0,d.exercises.findIndex((x,i)=>((L.sets||{})[i]||[]).length<x.sets)):0; return render()}
  if(a.obs){S.obsTag=S.obsTag===a.obs?null:a.obs; document.querySelectorAll('[data-obs]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.obs===S.obsTag)); return}
  const act=a.act; if(!act) return;
  const d=S.day&&PLAN()&&wkObj(S.week)&&wkObj(S.week).days.find(x=>x.n===S.day);
  switch(act){
    case 'back': S.view='dias'; S.toast=''; return render();
    case 'login-send': { const em=($('#login-email').value||'').trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(em)) return flash('Escribe tu email.',true);
      b.disabled=true; Store.sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:APP_URL()}}).then(({error})=>{ if(error){ b.disabled=false; return flash(/rate|seconds/i.test(error.message)?'Espera un minuto antes de pedir otro link.':'No se pudo enviar el correo. Intenta de nuevo.',true)} S.sent=em; S.toast=''; render() }); return }
    case 'login-back': S.sent=null; S.toast=''; return render();
    case 'login-code': { const tk=($('#otp').value||'').trim(); if(!/^\d{6,}$/.test(tk)) return flash('Escribe el código del correo.',true);
      Store.sb.auth.verifyOtp({email:S.sent,token:tk,type:'email'}).then(({error})=>{ if(error) return flash('Ese código no sirve o ya venció. Pide otro link.',true); location.reload() }); return }
    case 'logout': Store.sb.auth.signOut().then(()=>{ history.replaceState(null,'',APP_URL()); location.reload() }); return;
    case 'set': { const x=d.exercises[S.ex], L=ensureLog(); const num=v=>parseFloat(String(v).replace(',','.'));
      const kg=num($('#in-kg').value), reps=parseInt($('#in-reps').value), rpe=num($('#in-rpe').value);
      if(isNaN(reps)) return flash('Anota cuántas repeticiones hiciste.',true);
      (L.sets[S.ex]=L.sets[S.ex]||[]).push({kg:isNaN(kg)?null:kg,reps,rpe:isNaN(rpe)?null:rpe,t:Date.now()}); saveLog();
      const tgt=x.rpeN; S.toast=tgt&&!isNaN(rpe)&&Math.abs(rpe-tgt)>=1?`RPE ${fmt(rpe,1)} vs plan ${fmt(tgt,1)}. Si quieres, deja una observación para tu coach.`:''; S.toastErr=false;
      render(); return startTimer(x.rest,nextLabel()) }
    case 'nextex': case 'skip': S.ex=Math.min(S.ex+1,d.exercises.length-1); S.toast=''; S.obsOpen=false; return render();
    case 'prevex': S.ex=Math.max(0,S.ex-1); S.toast=''; S.obsOpen=false; return render();
    case 'finish': { const L=ensureLog(); L.done=true; saveLog(); stopTimer(); S.view='resumen'; S.toast=''; return render() }
    case 'todash': S.tab='dashboard'; S.view='dias'; return render();
    case 'obs-open': S.obsOpen=true; S.obsTag=null; render(); return;
    case 'obs-cancel': S.obsOpen=false; return render();
    case 'obs-save': { const txt=($('#obs-txt').value||'').trim(); if(!S.obsTag&&!txt) return flash('Elige una opción o escribe algo.',true);
      const x=d.exercises[S.ex], id=`${S.aid}~${Date.now().toString(36)}${rnd()}`;
      Store.put('notes',id,{aid:S.aid,w:S.week,d:S.day,dayLabel:dayName(d),ex:S.ex,exName:x.name,tag:S.obsTag||'',text:txt,at:Date.now(),reviewed:false,reply:''});
      S.obsOpen=false; S.toast='Observación guardada. Tu coach la verá en su panel.'; S.toastErr=false; return render() }
    case 'to-coach': history.replaceState(null,'',location.pathname+location.search); return route();
    case 'coach-back': S.ctab='alumnos'; S.toast=''; return render();
    case 'add': S.adding=true; S.pending=null; return render();
    case 'add-cancel': S.adding=false; return render();
    case 'add-save': { const name=($('#new-name').value||'').trim(); if(!name) return flash('Escribe el nombre del alumno.',true); if(!S.pending) return flash('Elige su Excel antes de crear el alumno.',true);
      const email=(($('#new-email')||{}).value||'').trim().toLowerCase(); if(email&&!/^\S+@\S+\.\S+$/.test(email)) return flash('Revisa el email del alumno.',true);
      if(email&&Object.values(DATA.athletes).some(x=>(x.email||'')===email)) return flash('Ese email ya está asignado a otro alumno.',true);
      const id=`${slug(name.split(' ')[0])}-${rnd()}`; Store.put('athletes',id,{name,email,plan:S.pending,coach:false,createdAt:Date.now()}); S.adding=false; S.pending=null; S.toast=`${name} agregado. Copia su link y envíaselo.`; S.toastErr=false; return render() }
    case 'reply-cancel': S.replyTo=null; return render();
    case 'reply-save': { const n=DATA.notes[a.id], txt=($('#reply-txt').value||'').trim(); Store.put('notes',a.id,{...n,reply:txt,reviewed:true,seen:false}); S.replyTo=null; return render() }
  }
});

function route(){ const h=decodeURIComponent((location.hash||'').slice(1));
  stopTimer(); S.toast=''; S.view='dias'; S.tab='entrenar'; S.week=null;
  if(h&&DATA.athletes[h]){S.mode='athlete'; S.aid=h}
  else if(!S.isCoach&&S.myAid&&DATA.athletes[S.myAid]){S.mode='athlete'; S.aid=S.myAid}
  else if(S.isCoach){S.mode='coach'; if(S.ctab!=='notas') S.ctab='alumnos'}
  else S.mode=h&&S.ready<3?'loading':'nolink';
  render()}
window.addEventListener('hashchange',route);
// no borrar lo que alguien está escribiendo cuando llegan datos nuevos
function softRender(){const ae=document.activeElement; if(ae&&/INPUT|TEXTAREA/.test(ae.tagName)&&ae.closest('main')){S.dirty=true;return} render()}
document.addEventListener('focusout',()=>setTimeout(()=>{const ae=document.activeElement; if(S.dirty&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName))){S.dirty=false;render()}},50));

(async function boot(){
  await Store.init();
  if(Store.kind==='supa'){ const {data}=await Store.sb.auth.getSession(); const ses=data&&data.session;
    if(/[?&]code=/.test(location.search)) history.replaceState(null,'',APP_URL()+location.hash);
    if(!ses){ S.mode='login'; render(); return }
    S.email=(ses.user.email||'').toLowerCase() }
  else if(Store.kind==='db'){ let u=null; try{u=await window.claude.use('user')}catch(e){} S.isCoach=u?await u.isOwner():false }
  else S.isCoach=true;
  const who=()=>{ if(Store.kind!=='supa') return; const mine=Object.entries(DATA.athletes).find(([k,a])=>(a.email||'')===S.email); S.myAid=mine?mine[0]:null; S.isCoach=!!(mine&&mine[1].coach) };
  const loaded=new Set(); ['athletes','logs','notes'].forEach(c=>Store.listen(c,o=>{DATA[c]=o; if(c==='athletes') who(); if(loaded.size<3){ loaded.add(c); S.ready=loaded.size; if(loaded.size===3) route() } else softRender()}));
})();
</script>
