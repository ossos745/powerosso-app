<style>
/* Layout: one app column (phone width) centred; sticky brand header, bottom tab bar.
   Palette taken from the Team Powerosso crest: black shield, gold trim, crimson POWER, bear brown, cream. Dark-first. */
:root{
  --bg:#0b0a0c; --surface:#16141a; --surface-2:#211e25; --line:#332e2a; --fg:#f6f2ea; --muted:#a59d90;
  --gold:#d4ad5e; --gold-2:#efd594; --red:#c3242f; --red-fg:#ff5b63; --brown:#9a6a44; --green:#5cc489; --amber:#e8b64a;
  --on-red:#fff8ef;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f1e9da; --line:#ddd0b9; --fg:#140f0c; --muted:#6c6052;
  --gold:#9c7426; --gold-2:#7a5a18; --red:#a3141f; --red-fg:#a3141f; --brown:#7a4f2e; --green:#1d7a45; --amber:#9a6a00; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f1e9da; --line:#ddd0b9; --fg:#140f0c; --muted:#6c6052;
  --gold:#9c7426; --gold-2:#7a5a18; --red:#a3141f; --red-fg:#a3141f; --brown:#7a4f2e; --green:#1d7a45; --amber:#9a6a00; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.blk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--gold);padding:10px 16px 10px}
.brand{display:flex;align-items:center;gap:10px}

.brand .who{min-width:0;flex:1}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.macro h1{font:800 32px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.weeks{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.wk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:5px 10px;font:600 13px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:52px}
.wk small{font:500 9px var(--mono);color:var(--muted);letter-spacing:.04em}
.wk[aria-pressed="true"]{background:var(--gold);color:#140f0c;border-color:var(--gold)}
.wk[aria-pressed="true"] small{color:#140f0c}
.wkinfo{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.wkinfo b{color:var(--fg);font-weight:600}
.banner{background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

.hb{display:grid;grid-template-columns:90px 1fr 64px;gap:8px;align-items:center;font-size:13px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
/*PARSER*/
const LOGO='LOGO_SRC';
const ARTIFACT_URL='https://claude.ai/artifact/4MaRbmVh4f9RWDxb79btCP';
const OBS=['Intensidad perfecta','Podría hacer más','Muy pesado','Molestia / dolor','Duda técnica'];
const EFF=7; // serie efectiva: RPE >= 7, igual que tu hoja DATOS ANÁLISIS

// ---------- almacenamiento: Supabase (versión GitHub, link con clave ?k=), base del artifact (db) o este navegador ----------
const SB=window.POWEROSSO_SUPABASE||{};
const urlToken=()=>{try{return new URLSearchParams(location.search).get('k')||''}catch(e){return ''}};
// la app instalada se abre sin ?k=: recuerda el link de esta persona (el del coach no se reemplaza por el de un alumno)
const savedToken={get(){try{return localStorage.getItem('powerosso.k')||''}catch(e){return ''}},
  set(t,coach){try{ if(!coach&&localStorage.getItem('powerosso.kc')==='1'&&localStorage.getItem('powerosso.k')&&localStorage.getItem('powerosso.k')!==t) return; localStorage.setItem('powerosso.k',t); localStorage.setItem('powerosso.kc',coach?'1':'0') }catch(e){}},
  clear(){try{localStorage.removeItem('powerosso.k');localStorage.removeItem('powerosso.kc')}catch(e){}}};
async function rpc(fn,args){ const r=await fetch(`${SB.url.replace(/\/$/,'')}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB.anonKey,Authorization:'Bearer '+SB.anonKey,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){} if(!r.ok){const e=new Error((j&&j.message)||t||r.statusText); e.status=r.status; throw e} return j }
const Store={kind:'local',db:null,q:{},subs:[],token:'',since:null,pulls:0,pending:new Set(),files:{},parsed:{},
  async init(){ if(SB.url&&SB.anonKey){ this.kind='supa'; this.token=urlToken()||savedToken.get(); this.fromSaved=!urlToken(); return }
    let db=null; try{ if(window.claude&&window.claude.use) db=await window.claude.use('db') }catch(e){} if(db){this.kind='db';this.db=db} },
  // Supabase: trae todo lo visible para esta clave (o solo lo cambiado) y lee las planillas nuevas
  async pull(full){ full=full||!this.since||(++this.pulls%15===0);
    const r=await rpc('pw_load',{p_token:this.token,p_since:full?null:this.since});
    this.since=new Date(Date.parse(r.now)-5000).toISOString(); S.isCoach=!!r.me.coach; S.myAid=r.me.id;
    let changed=full; for(const c of ['athletes','logs','notes']){ const inc=r[c]||{}; if(full){ const keep={}; for(const k of Object.keys(DATA[c])) if(this.pending.has(c+'/'+k)) keep[k]=DATA[c][k]; DATA[c]=Object.assign({},inc,keep) }
      else for(const k in inc){ if(this.pending.has(c+'/'+k)) continue; DATA[c][k]=inc[k]; changed=true } }
    if(full) this.files=Object.assign({},r.files); else Object.assign(this.files,r.files||{});
    if(await this.readFiles()) changed=true; return changed },
  async readFiles(){ let ch=false; const need=[...new Set(Object.values(DATA.athletes).map(a=>a.file).filter(Boolean))];
    for(const name of need){ const mt=this.files[name]; if(mt===undefined) continue; if(this.parsed[name]&&this.parsed[name].mtime===mt) continue;
      try{ const b64=await rpc('pw_file',{p_token:this.token,p_name:name}); if(!b64) continue; this.parsed[name]={mtime:mt,...wbPlans(XLSX.read(b64,{type:'base64'}))}; ch=true }catch(e){ console.warn('planilla',name,e) } }
    return ch },
  local(){try{return JSON.parse(localStorage.getItem('powerosso.v3'))||{}}catch(e){return {}}},
  saveLocal(o){try{localStorage.setItem('powerosso.v3',JSON.stringify(o))}catch(e){}},
  listen(coll,cb){ if(this.kind==='db'){ return this.db.collection(coll).onSnapshot(s=>{const o={}; s.docs.forEach(d=>o[d.id]=d.data()); cb(o)}, e=>{flash('Se perdió la conexión con los datos. Recarga la página.',true)}) }
    const f=()=>cb(Object.assign({},this.local()[coll]||{})); this.subs.push(f); f(); },
  put(coll,id,body){ DATA[coll][id]=body; if(this.kind==='supa'){ const k=coll+'/'+id; this.pending.add(k);
      this.q[k]=(this.q[k]||Promise.resolve()).then(()=>rpc('pw_put',{p_token:this.token,p_coll:coll,p_id:id,p_data:body})).catch(e=>flash(e.status===403||/permiso/.test(e.message)?'No tienes permiso para guardar esto.':'No se pudo guardar. Revisa tu conexión.',true)).finally(()=>this.pending.delete(k)); return this.q[k] }
    if(this.kind==='db'){ const k=coll+'/'+id; this.q[k]=(this.q[k]||Promise.resolve()).then(()=>this.db.collection(coll).doc(id).set(body)).catch(e=>flash(e&&e.code==='invalid_argument'?'No tienes permiso para guardar aquí. Pide a tu coach que te comparta la app como editor.':e&&e.code==='quota_exceeded'?'La base de datos está llena.':'No se pudo guardar. Revisa tu conexión.',true)); return this.q[k] }
    const o=this.local(); (o[coll]=o[coll]||{})[id]=body; this.saveLocal(o); return Promise.resolve() },
  del(coll,id){ delete DATA[coll][id]; if(this.kind==='supa') return rpc('pw_del',{p_token:this.token,p_coll:coll,p_id:id}).catch(()=>flash('No se pudo borrar.',true));
    if(this.kind==='db') return this.db.collection(coll).doc(id).delete().catch(()=>{}); const o=this.local(); if(o[coll]) delete o[coll][id]; this.saveLocal(o); return Promise.resolve() }
};
const DATA={athletes:{},logs:{},notes:{}};
// Mesociclos: solo cuentan las hojas cuyo nombre contiene una de estas palabras (sin importar mayúsculas ni tildes)
const MESOS=[['HIPERTROFIA','Hipertrofia',/HIPERTROFIA/],['FUERZA BASE','Fuerza base',/FUERZA\s*BASE/],['VOLUMEN','Volumen',/VOLUMEN/],['PEAKING','Peaking',/PEAKING/],['TAPERING','Tapering',/TAP+ERING/]];
const normU=t=>String(t||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
// serie Bilbo = la serie AMRAP de banca Bilbo (no las "(BILBO +20 kg)")
const isBilbo=x=>!!x&&/BILBO/.test(normU(x.name))&&!/BILBO\s*\+/.test(normU(x.name));
const rm1=(kg,reps)=>(+kg>0&&+reps>0)?(+kg)*(+reps)*0.03+(+kg):null;  // 1RM = peso × reps × 0,03 + peso
// fecha del entrenamiento: la última vez que se registró algo en ese día
const sessDate=L=>{const ts=Object.values(L.sets||{}).flat().map(s=>s&&s.t||0); return L.trainedAt||L.finishedAt||(ts.length?Math.max(...ts):0)||Date.parse(L.date)||0};
const mesoLabel=k=>(MESOS.find(m=>m[0]===k)||[k,k])[1];
function wbPlans(wb){ const plans={}, skipped=[];
  for(const n of wb.SheetNames){ const m=MESOS.find(x=>x[2].test(normU(n))); if(!m) continue; const ws=wb.Sheets[n]; if(!ws||!ws['!ref']) continue;
    const p=parsePlan(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),n,XLSX.utils.decode_range(ws['!ref']).s.r+1);
    const ex=p.weeks.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.exercises.length,0),0); if(!ex){skipped.push(n);continue}
    p.weeks=p.weeks.filter(w=>w.days.some(d=>d.exercises.length)); p.meso=m[0]; p.macro=m[1].toUpperCase(); p.nEx=ex;
    if(!plans[m[0]]||ex>plans[m[0]].nEx) plans[m[0]]=p }
  return {plans,skipped,sheets:wb.SheetNames} }
// planes de un alumno: de su planilla en Supabase, o guardados en su ficha (artifact / navegador)
function plansOf(a){ if(!a) return {}; if(Store.kind==='supa') return (Store.parsed[a.file]||{}).plans||{}; if(a.plans) return a.plans; if(a.plan) return {[a.plan.meso||'HIPERTROFIA']:a.plan}; return {} }
function mesoOf(a){ const P=plansOf(a); if(a&&a.meso&&P[a.meso]) return a.meso; const m=MESOS.find(x=>P[x[0]]); return m?m[0]:null }
const planOf=a=>{const k=mesoOf(a); return k?plansOf(a)[k]:null};

// ---------- métricas (mismas definiciones que tu DASHBOARD) ----------
function planMetrics(day){let t=0,c=0,s=0,e=0,rs=0,rn=0;
  day.exercises.forEach(x=>{const kg=x.kg||0, reps=x.repsN||0; t+=kg*reps*x.sets; c+=kg*reps*x.sets*(x.rpeN||0)/10; s+=x.sets; if((x.rpeN||0)>=EFF)e+=x.sets; if(x.rpeN){rs+=x.rpeN*x.sets;rn+=x.sets}});
  return {ton:t,carga:c,series:s,eff:e,rpe:rn?rs/rn:null,_r:rs,_n:rn}}
function realMetrics(log){let t=0,c=0,s=0,e=0,rs=0,rn=0; if(!log) return {ton:0,carga:0,series:0,eff:0,rpe:null,_r:0,_n:0};
  Object.values(log.sets||{}).forEach(arr=>arr.forEach(st=>{const kg=+st.kg||0,r=+st.reps||0,rpe=+(st.rpe??st.rpePlan)||0; t+=kg*r; c+=kg*r*rpe/10; s++; if(rpe>=EFF)e++; if(rpe){rs+=rpe;rn++}}));
  return {ton:t,carga:c,series:s,eff:e,rpe:rn?rs/rn:null,_r:rs,_n:rn}}
function weekMetrics(w,real){const a={ton:0,carga:0,series:0,eff:0,_r:0,_n:0};
  w.days.forEach(d=>{const m=real?realMetrics(dayLog(w.n,d.n)):planMetrics(d); for(const k in a)a[k]+=m[k]}); a.rpe=a._n?a._r/a._n:null; return a}
function heaviest(w,cat){let plan=null,real=null;
  w.days.forEach(d=>d.exercises.forEach((x,i)=>{ if(LIFT(x.name)!==cat) return; if(x.kg!=null) plan=Math.max(plan||0,x.kg); const st=(dayLog(w.n,d.n)||{sets:{}}).sets[i]; if(st&&st.length) real=Math.max(real||0,...st.map(s=>+s.kg||0)) }));
  return {plan,real}}
function weekDone(w,aid=S.aid){return w.days.filter(d=>(dayLog(w.n,d.n,aid)||{}).done).length}
function currentWeek(aid=S.aid){const W=planOf(DATA.athletes[aid]).weeks; let last=-1; W.forEach((w,i)=>{ if(w.days.some(d=>dayLog(w.n,d.n,aid))) last=i }); if(last<0) return W[0].n; const w=W[last]; if(w.days.every(d=>(dayLog(w.n,d.n,aid)||{}).done) && W[last+1]) return W[last+1].n; return w.n}

function dayTable(w,d,coach){const L=dayLog(w.n,d.n);

function kpis(r,p,kg){const k=(l,v,pv,u='')=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}${u}</div><div class="p">plan ${pv}${u}</div></div>`;

// grupos musculares por nombre del ejercicio (el orden importa: "curl femoral" antes que "curl")
const MUSC=[['Isquios y glúteos',/CURL FEMORAL|FEMORAL|DEADLIFT|PESO MUERTO|RUMANO|HIP\s*THRUST|BUENOS DIAS|GOOD MORNING|GLUTE|PUENTE|BLOCK\s*PULL|NORDIC|PATADA/],
  ['Cuádriceps',/SQUAT|SENTADILLA|PRENSA|BULGARA|CUADRI|ZANCADA|ESTOCADA|HACK|LEG PRESS|STEP|SISSY|GOBLET/],
  ['Brazos',/CURL|BICEP|TRICEP|FRANCES|MARTILLO|PRESS CERRADO|COPA|KICKBACK|PUSH ?DOWN/],
  ['Hombros',/MILITAR|HOMBRO|ELEVACION|LATERAL|FACE ?PULL|OVERHEAD|ARNOLD|PAJARO|POSTERIOR/],
  ['Pecho',/BANCA|BENCH|INCLINADO|DECLINADO|APERTURA|FONDOS|PEC|FLEXION|CRUCE|PUSH ?UP/],
  ['Espalda',/JALON|REMO|DOMINADA|PULL|ROW|DORSAL|PULLOVER|ENCOGIMIENTO|LUMBAR/],
  ['Core',/ABDOM|PLANCHA|CORE|CRUNCH|RUEDA|PALLOF|OBLICUO/]];
const MCOL={'Cuádriceps':'var(--red)','Isquios y glúteos':'var(--brown)','Pecho':'var(--gold)','Espalda':'#5f8fa8','Hombros':'#c47a3a','Brazos':'#8fa864','Core':'#a58fc4','Otros':'var(--muted)'};
const muscle=n=>{const t=normU(n); const m=MUSC.find(x=>x[1].test(t)); return m?m[0]:'Otros'};
function pieMuscles(pairs,kg){ const real={}, plan={};
  pairs.forEach(([w,d])=>{ const L=dayLog(w.n,d.n); d.exercises.forEach((x,i)=>{ const g=muscle(x.name); plan[g]=(plan[g]||0)+(x.kg||0)*(x.repsN||0)*x.sets;
    ((L&&L.sets[i])||[]).forEach(st=>real[g]=(real[g]||0)+(+st.kg||0)*(+st.reps||0)) }) });
  const useReal=Object.values(real).some(v=>v>0), src=useReal?real:plan, tot=Object.values(src).reduce((a,b)=>a+b,0);
  if(!tot) return `<div class="muted small">Aún no hay ${kg?'kilos':'tonelaje'} registrado${kg?'s':''}.</div>`;
  const items=Object.entries(src).filter(([g,v])=>v>0).sort((a,b)=>b[1]-a[1]); let ang=-Math.PI/2; const R=60,c=66;
  const arcs=items.map(([g,v])=>{ const f=v/tot; if(f>0.9999) return `<circle cx="${c}" cy="${c}" r="${R}" fill="${MCOL[g]}"/>`; const a2=ang+f*2*Math.PI;
    const p=`M${c},${c} L${c+R*Math.cos(ang)},${c+R*Math.sin(ang)} A${R},${R} 0 ${f>.5?1:0} 1 ${c+R*Math.cos(a2)},${c+R*Math.sin(a2)} Z`; ang=a2; return `<path d="${p}" fill="${MCOL[g]}" stroke="var(--surface)" stroke-width="1.5"/>` }).join('');
  return `<div class="pie"><svg viewBox="0 0 132 132" role="img" aria-label="Tonelaje por grupo muscular">${arcs}<circle cx="${c}" cy="${c}" r="30" fill="var(--surface)"/><text x="${c}" y="${c-2}" text-anchor="middle" font-size="${kg?12:15}" font-weight="700" fill="var(--fg)" font-family="var(--mono)">${kg?fmt(tot):fmt(tot/1000,1)}</text><text x="${c}" y="${c+13}" text-anchor="middle" font-size="10" fill="var(--muted)">${kg?'kg':'t'} ${useReal?'real':'plan'}</text></svg>
  <ul>${items.map(([g,v])=>`<li><i style="background:${MCOL[g]}"></i><span>${g}</span><span class="num">${kg?fmt(v)+' kg':fmt(v/1000,2)+' t'} · <b>${fmt(100*v/tot)}%</b></span></li>`).join('')}</ul></div>
  ${useReal?'':'<div class="muted small" style="margin-top:6px">Todavía sin series registradas: se muestra lo planificado.</div>'}`}
function vDash(){const w=wkObj(S.week), rm=weekMetrics(w,true), pm=weekMetrics(w,false), done=weekDone(w);
  const pd=S.pieDay&&w.days.find(d=>d.n===S.pieDay); const pieSel=pd?[[w,pd]]:w.days.map(d=>[w,d]);
  const ex=w.days.flatMap(d=>{const L=dayLog(w.n,d.n); return L?d.exercises.map((x,i)=>({d,x,st:(L.sets||{})[i]||[]})).filter(o=>o.st.length):[]});
  const cats={'Sentadilla':0,'Banca':0,'Peso muerto':0,'Accesorio':0}; ex.forEach(o=>o.st.forEach(s=>cats[LIFT(o.x.name)]+=(+s.kg||0)*(+s.reps||0)));
  const cmax=Math.max(1,...Object.values(cats)); const ccol={'Sentadilla':'var(--red)','Banca':'var(--gold)','Peso muerto':'var(--brown)','Accesorio':'var(--muted)'};
  return `<div class="row"><div><div class="eyebrow">Semana ${w.n}${phase(w)?' · '+title(phase(w)):''}</div><h2 class="h2">Dashboard semanal</h2></div><span class="pill ${done===w.days.length?'ok':'warn'}">${done}/${w.days.length} sesiones</span></div>
  ${kpis(rm,pm)}

  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Tonelaje real por levantamiento</div><div style="display:flex;flex-direction:column;gap:8px">
  ${Object.entries(cats).map(([c,v])=>`<div class="hb"><span>${c}</span><div class="tr"><b style="width:${100*v/cmax}%;background:${ccol[c]}"></b></div><span class="num" style="text-align:right">${fmt(v/1000,2)} t</span></div>`).join('')}</div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Peso más alto por semana (kg)</div>${topTable()}<div class="muted small" style="margin-top:6px">Número fuerte = levantado en la app · gris = planificado.</div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Ejercicios realizados con la app</div>
  ${ex.length?`<div class="tbl"><table><thead><tr><th>Ejercicio</th><th>Día</th><th>Series</th><th>Mejor</th><th>e1RM</th></tr></thead><tbody>${ex.map(o=>{const b=o.st.reduce((a,s)=>(+s.kg>=+a.kg?s:a)); const e=(o.x.kg!=null&&+b.reps&&+b.kg)?e1rm(+b.kg,+b.reps,+(b.rpe??b.rpePlan)||8):null; return `<tr><td>${title(o.x.name)}</td><td>${dayShort(o.d)}</td><td class="num">${o.st.length}/${o.x.sets}</td><td class="num">${b.kg!=null&&b.kg!==''?fmt(+b.kg,1):esc(title(o.x.load||'—'))}×${b.reps}</td><td class="num">${LIFT(o.x.name)!=='Accesorio'&&e?fmt(e,0):'—'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="muted">Todavía no hay sesiones registradas esta semana. Empieza un día desde Entrenar.</div>`}</div>
  ${S.mode==='athlete'?`<button class="btn ghost" data-act="tomenu">Volver al menú</button>`:''}`}

function dayChart(w){const W=320,H=150,P=26,bw=(W-P)/w.days.length; const vals=w.days.map(d=>({p:planMetrics(d).ton,r:realMetrics(dayLog(w.n,d.n)).ton}));
  const mx=Math.max(1,...vals.flatMap(v=>[v.p,v.r])); const step=mx>20000?10000:mx>8000?5000:2000; const top=Math.ceil(mx/step)*step; const y=v=>H-18-(v/top)*(H-30);
  let g=''; for(let t=0;t<=top;t+=step){g+=`<line x1="${P}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P-4}" y="${y(t)+3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t/1000}t</text>`}
  const bars=vals.map((v,i)=>{const x=P+i*bw+bw*0.15, b=bw*0.34; return `<rect x="${x}" y="${y(v.p)}" width="${b}" height="${H-18-y(v.p)}" rx="2" fill="var(--surface-2)" stroke="var(--line)"/><rect x="${x+b+2}" y="${y(v.r)}" width="${b}" height="${H-18-y(v.r)}" rx="2" fill="var(--red)"/><text x="${x+b}" y="${H-4}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${dayShort(w.days[i])}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tonelaje plan y real por día">${g}${bars}</svg>`}

function topTable(){const W=PLAN().weeks.filter(w=>!w.deload);
  return `<div class="tbl"><table><thead><tr><th>Levantamiento</th>${W.map(w=>`<th>S${w.n}</th>`).join('')}</tr></thead><tbody>
  ${['Sentadilla','Banca','Peso muerto'].map(c=>`<tr><td>${c}</td>${W.map(w=>{const h=heaviest(w,c); return h.real?`<td class="num"><b>${fmt(h.real,1)}</b></td>`:`<td class="num pl">${h.plan!=null?fmt(h.plan,1):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}

function delPanel(aid){ const a=DATA.athletes[aid]; const others=Object.entries(DATA.athletes).filter(([k,x])=>k!==aid).sort((x,y)=>String(x[1].name).localeCompare(y[1].name));

  <div class="small muted" style="margin-top:6px">Si este alumno apareció porque renombraste un Excel, pásale la planilla al alumno correcto: así el actualizador (.bat) la reconoce y no lo vuelve a crear. Si la borras y el Excel sigue en tu carpeta Alumnos con ese nombre, el actualizador lo creará de nuevo.</div>`:''}
  <div class="btns" style="margin-top:10px"><button class="btn ghost sm" data-act="del-cancel">Cancelar</button><button class="btn sm" data-act="del-ok" data-id="${aid}">Eliminar</button></div></div>`}
async function delAthlete(aid,toAid){ const at=DATA.athletes[aid]; if(!at) return; const file=at.file;
  try{
    if(toAid&&file&&DATA.athletes[toAid]){ const t=JSON.parse(JSON.stringify(DATA.athletes[toAid])); t.file=file; if(at.plans) t.plans=at.plans; delete t.plan; t.updatedAt=Date.now(); await Store.put('athletes',toAid,t) }
    await Store.del('athletes',aid);
    Object.keys(DATA.logs).filter(k=>DATA.logs[k].aid===aid).forEach(k=>Store.kind==='supa'?delete DATA.logs[k]:Store.del('logs',k));
    Object.keys(DATA.notes).filter(k=>DATA.notes[k].aid===aid).forEach(k=>Store.kind==='supa'?delete DATA.notes[k]:Store.del('notes',k));
    if(Store.kind==='supa'){ if(file&&!toAid&&!Object.values(DATA.athletes).some(x=>x.file===file)) await rpc('pw_del',{p_token:Store.token,p_coll:'files',p_id:file}).catch(()=>{}); await Store.pull(true) }
  }catch(e){ return flash('No se pudo eliminar. Revisa tu conexión.',true) }
  S.delAsk=null; if(S.aid===aid){ S.ctab='alumnos'; S.aid=null }
  flash(`${at.name} eliminado${toAid?`. Su planilla ahora es de ${DATA.athletes[toAid]?.name||'otro alumno'}`:''}.`) }
function vRespaldo(){const coachId=Object.keys(DATA.athletes).find(k=>DATA.athletes[k].coach);

  <div class="small muted" style="margin-top:12px">Excel con una hoja por alumno: RPE planificado vs real de cada serie y sus observaciones, por fecha.</div>
  <button class="btn goldb sm" style="margin-top:6px" data-act="xls">Exportar Excel (RPE y observaciones)</button>
  <div class="btns" style="margin-top:10px"><button class="btn ghost sm" data-act="export">Exportar respaldo</button><label class="btn ghost sm" style="position:relative">Importar respaldo<input type="file" id="imp" accept=".json,application/json" style="position:absolute;inset:0;opacity:0"></label></div></div>`}

// ---------- RPE planificado vs real ----------
const fdLong=ts=>{try{return new Date(ts).toLocaleDateString('es-CL',{day:'numeric',month:'long'})}catch(e){return ''}};
const fdNum=ts=>{try{return new Date(ts).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return ''}};
const hasR=v=>v!=null&&v!==''&&!isNaN(+v);
const sgn=v=>v==null?'—':(v>0.05?'+':v<-0.05?'−':'±')+fmt(Math.abs(v),1);
const dcls=v=>v>=1?'over':v<=-1?'under':'';
const avgOf=v=>v.length?v.reduce((p,q)=>p+q,0)/v.length:null;
// sesiones registradas de un alumno, con su día de la planilla, de la más antigua a la más nueva
function sessionsOf(aid){ const a=DATA.athletes[aid]||{};
  return Object.entries(DATA.logs).filter(([id,L])=>L.aid===aid).map(([id,L])=>{ const P=plansOf(a)[L.meso]||planOf(a), w=P&&P.weeks.find(x=>x.n===L.w), d=w&&w.days.find(x=>x.n===L.d);
    const t=sessDate(L); return {id,L,d,t} }).sort((x,y)=>x.t-y.t) }
// una fila por serie hecha: RPE plan y RPE real
function rpeRows(aid){ return sessionsOf(aid).flatMap(o=>Object.entries(o.L.sets||{}).flatMap(([i,arr])=>{ const x=o.d&&o.d.exercises[i];
  return (arr||[]).map((s,k)=>({...o,i:+i,x,name:x?title(x.name):'Ejercicio '+(+i+1),k:k+1,s,plan:hasR(s.rpePlan)?+s.rpePlan:(x&&x.rpeN)||null,real:hasR(s.rpe)?+s.rpe:null})) })) }
function rpeStats(rows){ const c=rows.filter(r=>r.plan!=null&&r.real!=null), v=c.map(r=>r.real-r.plan), n=v.length; if(!n) return null; const m=avgOf(v);
  return {n,mean:m,abs:avgOf(v.map(Math.abs)),sd:Math.sqrt(avgOf(v.map(x=>(x-m)**2))),over:v.filter(x=>x>=1).length/n,under:v.filter(x=>x<=-1).length/n,ok:v.filter(x=>Math.abs(x)<=0.5).length/n,
    plan:avgOf(c.map(r=>r.plan)),real:avgOf(c.map(r=>r.real))} }
const dayTitle=(L,d)=>`Entrenamiento S${L.w} Día ${L.d}`;

function vRpeCoach(){ const f=S.rfilter||'';
  const rows=Object.entries(DATA.logs).map(([id,L])=>({id,...L})).filter(L=>DATA.athletes[L.aid]&&(L.rpeDay||Object.values(L.sets||{}).some(a=>(a||[]).length)));
  const ids=[...new Set(rows.map(r=>r.aid))]; const when=sessDate;
  const shown=rows.filter(r=>!f||r.aid===f).sort((a,b)=>when(b)-when(a));
  const pr=(pl,re,dec,unit='')=>pl==null&&re==null?'<span class="muted">—</span>':`<span class="pl">${pl!=null?fmt(pl,dec):'—'}</span> → <b>${re!=null?fmt(re,dec):'—'}</b>${unit}${pl!=null&&re!=null?`<div class="small ${dcls(re-pl)}">${sgn(re-pl)}</div>`:''}`;
  const card=L=>{ const a=DATA.athletes[L.aid], P=plansOf(a)[L.meso]||planOf(a), w=P&&P.weeks.find(x=>x.n===L.w), d=w&&w.days.find(x=>x.n===L.d);
    const idx=d?d.exercises.map((x,i)=>i):Object.keys(L.sets||{}).map(Number);
    const ex=[...new Set([...idx,...Object.keys(L.sets||{}).map(Number)])].sort((p,q)=>p-q).map(i=>({x:d&&d.exercises[i],i,arr:((L.sets||{})[i])||[]}));
    const all=ex.flatMap(o=>o.arr.filter(s=>hasR(s.rpe)).map(s=>+s.rpe)), avg=avgOf(all);
    const planAvg=avgOf(ex.flatMap(o=>o.arr.filter(s=>hasR(s.rpe)).map(s=>+(s.rpePlan||(o.x&&o.x.rpeN))||0)).filter(Boolean));
    const rm=realMetrics(L), pm=d?planMetrics(d):null;
    const k=(l,v,p)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="p">${p}</div></div>`;
    return `<div class="card"><div class="eyebrow">${esc(a.name)}${L.meso?' · '+esc(mesoLabel(L.meso)):''}${d?' · '+esc(dayName(d))+(d.focus?' · '+esc(title(d.focus)):''):''}</div>
    <div class="rtitle">${dayTitle(L,d)} · ${fdLong(when(L))}</div>
    <div class="kpis">${k('RPE día',L.rpeDay?L.rpeDay+'<span class="small muted">/10</span>':'—',L.rpeDay?'Sesión completa':'No lo anotó')}
    ${k('RPE promedio de series',avg!=null?fmt(avg,1):'—',planAvg?`plan ${fmt(planAvg,1)} · ${all.length} series`:`${all.length} series con RPE`)}
    ${k('Kilos levantados',fmt(rm.ton)+'<span class="small muted"> kg</span>',pm?`plan ${fmt(pm.ton)} kg${pm.ton?' · '+fmt(100*rm.ton/pm.ton)+'%':''}`:'')}
    ${k('Series hechas',`${rm.series}${pm?'<span class="small muted">/'+pm.series+'</span>':''}`,pm&&pm.series?fmt(100*rm.series/pm.series)+'% de lo planificado':'')}</div>
    <div class="eyebrow" style="margin:12px 0 6px">Plan → real por ejercicio</div>
    <div class="tbl wrap"><table><thead><tr><th>Ejercicio</th><th>Series</th><th>Kg</th><th>RPE</th></tr></thead><tbody>
    ${ex.map(o=>{ const x=o.x, n=o.arr.length, kgs=o.arr.map(s=>+s.kg).filter(v=>v>0), kre=avgOf(kgs), kpl=x&&x.kg!=null?+x.kg:null;
      const rpl=+(((o.arr[0]||{}).rpePlan)||(x&&x.rpeN))||null, rre=avgOf(o.arr.filter(s=>hasR(s.rpe)).map(s=>+s.rpe));
      const bil=isBilbo(x)?o.arr.filter(s=>rm1(s.kg,s.reps)).map(s=>`<div class="small gold">Bilbo: ${fmt(+s.kg,1)} kg × ${s.reps} reps → 1RM est. <b>${fmt(rm1(s.kg,s.reps),1)} kg</b></div>`).join(''):'';
      const sp=x?x.sets:null;
      return `<tr><td>${x?title(x.name):'Ejercicio '+(o.i+1)}${x?`<div class="small muted">plan ${x.sets}×${esc(x.reps||'—')}</div>`:''}${n?`<div class="small muted">${o.arr.map((s,j)=>`S${j+1} ${hasR(s.kg)&&+s.kg?fmt(+s.kg,1)+'×':''}${s.reps??'—'}${hasR(s.rpe)?' @'+fmt(+s.rpe,1):''}`).join(' · ')}</div>`:''}${bil}</td>
      <td class="num"><b class="${sp&&n<sp?'under':''}">${n}</b><span class="pl">/${sp??'—'}</span></td><td class="num">${n?pr(kpl,kre,1):`<span class="pl">${kpl!=null?fmt(kpl,1):'—'}</span>`}</td><td class="num">${pr(rpl,rre,1)}</td></tr>`}).join('')}
    </tbody></table></div></div>` };
  return `<h2 class="h2">Plan vs real</h2><div class="muted small">Cada día de entrenamiento: lo planificado frente a lo que el alumno hizo en series, kg y RPE. Debajo de cada valor va la diferencia (real − plan). En celeste, menos de lo planificado; en color, 1 punto de RPE o más sobre el plan.</div>
  <div class="chips"><button class="chip" data-rf="" aria-pressed="${!f}">Todos</button>${ids.map(id=>`<button class="chip" data-rf="${id}" aria-pressed="${f===id}">${esc(DATA.athletes[id]?.name||id)}</button>`).join('')}</div>
  ${shown.length?shown.map(card).join(''):`<div class="card muted">Todavía no hay entrenamientos registrados. Aparecen aquí cuando un alumno marca series.</div>`}`}

// ---------- Estadísticas ----------
const H6=182.5*864e5;
function periods(){ const ts=Object.values(DATA.logs).map(sessDate).filter(Boolean), set=new Set(ts.map(t=>{const d=new Date(t); return d.getFullYear()+'-'+(d.getMonth()<6?1:2)}));
  return [['6m','Últimos 6 meses'],...[...set].sort().reverse().map(k=>{const [y,h]=k.split('-'); return [k,(h==='1'?'Ene–Jun ':'Jul–Dic ')+y]}),['all','Todo']] }
const inPer=t=>{const p=S.period||'all'; if(p==='all') return true; if(p==='6m') return t>=Date.now()-H6; const d=new Date(t), [y,h]=p.split('-'); return d.getFullYear()===+y&&(d.getMonth()<6?'1':'2')===h};
// rendimiento de un alumno en el periodo: lo hecho frente a lo planificado en las sesiones que registró
function perf(aid){ const ss=sessionsOf(aid).filter(o=>o.d&&inPer(o.t)&&Object.values(o.L.sets||{}).some(a=>(a||[]).length)); let kr=0,kp=0,sr=0,sp=0;
  ss.forEach(o=>{ const rm=realMetrics(o.L), pm=planMetrics(o.d); kr+=rm.ton; kp+=pm.ton; sr+=rm.series; sp+=pm.series });
  const rows=rpeRows(aid).filter(r=>inPer(r.t)), st=rpeStats(rows), bil=bilboPts(aid);
  return {aid,name:DATA.athletes[aid].name,n:ss.length,done:ss.filter(o=>o.L.done).length,kr,kp,kpct:kp?kr/kp:null,sr,sp,spct:sp?sr/sp:null,st,bil,
    rpeDay:avgOf(ss.map(o=>+o.L.rpeDay).filter(Boolean)),bilUp:bil.length>1?bil[bil.length-1].v-bil[0].v:null} }
// mejor 1RM estimado Bilbo de cada sesión
function bilboPts(aid){ return sessionsOf(aid).filter(o=>inPer(o.t)).map(o=>{ let best=null; Object.entries(o.L.sets||{}).forEach(([i,arr])=>{ const x=o.d&&o.d.exercises[i]; if(!isBilbo(x)&&!(arr||[]).some(s=>s.bilbo)) return;
    (arr||[]).forEach(s=>{const v=rm1(s.kg,s.reps); if(v&&(!best||v>best.v)) best={v,kg:+s.kg,reps:+s.reps}}) }); return best&&{...best,t:o.t,L:o.L} }).filter(Boolean) }
function lineChart(pts,lbl){ const W=320,H=170,P=34,B=24; if(!pts.length) return '';
  const vs=pts.map(p=>p.v), lo=Math.floor((Math.min(...vs)-2)/5)*5, hi=Math.ceil((Math.max(...vs)+2)/5)*5, x=i=>pts.length===1?(W+P)/2:P+8+i*(W-P-16)/(pts.length-1), y=v=>H-B-(v-lo)/(hi-lo||1)*(H-B-12);
  let g=''; const st=Math.max(5,Math.ceil((hi-lo)/4/5)*5); for(let t=lo;t<=hi;t+=st) g+=`<line x1="${P}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${P-4}" y="${y(t)+3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`;
  const every=Math.ceil(pts.length/6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(lbl)}">${g}<polyline fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--gold)" stroke="var(--surface)" stroke-width="1.5"/>${i%every===0||i===pts.length-1?`<text x="${x(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${esc(fdate(p.t))}</text>`:''}`).join('')}</svg>`}
// barras horizontales: items [{l, v, txt, col}], ref = línea de referencia (p. ej. 100 %)
function hbars(items,{min=0,max,ref,zero}={}){ if(!items.length) return '<div class="muted small">Sin datos en este periodo.</div>';
  const vs=items.map(i=>i.v).filter(v=>v!=null); max=max??Math.max(ref||0,...vs,0.0001); min=Math.min(min,...vs); const pos=v=>100*(v-min)/((max-min)||1);
  return `<div style="display:flex;flex-direction:column;gap:8px">${items.map(i=>{ const z=pos(zero??Math.max(min,0)), p=i.v==null?z:pos(i.v), l=Math.min(z,p), w=Math.abs(p-z);
    return `<div class="hb w"><span>${esc(i.l)}</span><div class="tr" style="position:relative;overflow:visible">${i.v==null?'':`<b style="position:absolute;left:${l}%;width:${Math.max(w,.8)}%;top:0;bottom:0;background:${i.col||'var(--gold)'}"></b>`}${ref!=null?`<i style="position:absolute;left:${pos(ref)}%;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6"></i>`:''}</div><span class="num" style="text-align:right">${i.txt}</span></div>`}).join('')}</div>`}

function vStats(){ const pers=periods(); if(!pers.some(p=>p[0]===(S.period||'all'))) S.period='all';
  const ids=Object.keys(DATA.athletes).filter(id=>sessionsOf(id).some(o=>Object.values(o.L.sets||{}).some(a=>(a||[]).length))).sort((x,y)=>String(DATA.athletes[x].name).localeCompare(DATA.athletes[y].name));
  const f=ids.includes(S.cfilter)?S.cfilter:'';
  const xlsBtn=`<button class="btn goldb sm" data-act="xls">Exportar Excel (RPE y observaciones)</button>`;
  const head=`<h2 class="h2">Estadísticas</h2>
  <div class="chips"><button class="chip" data-cf="" aria-pressed="${!f}">General</button>${ids.map(id=>`<button class="chip" data-cf="${id}" aria-pressed="${f===id}">${esc(DATA.athletes[id].name)}</button>`).join('')}</div>
  <div class="chips">${pers.map(([k,l])=>`<button class="chip" data-per="${k}" aria-pressed="${(S.period||'all')===k}">${l}</button>`).join('')}</div>`;
  if(!ids.length) return `${head}<div class="card muted">Todavía no hay entrenamientos registrados.</div>${xlsBtn}`;
  return head+(f?vStatsAlumno(f):vStatsGeneral(ids))+xlsBtn }

function vStatsAlumno(f){ const P=perf(f), rows=rpeRows(f).filter(r=>inPer(r.t)), st=P.st, pct=v=>v==null?'—':fmt(100*v)+'%', mk=(l,v,p)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="p">${p}</div></div>`;
  if(!P.n) return `<div class="card muted">${esc(P.name)} no tiene entrenamientos en este periodo.</div>`;
  const by={}; rows.filter(r=>r.real!=null&&r.plan!=null).forEach(r=>(by[r.name]=by[r.name]||[]).push(r));
  const exT=Object.entries(by).map(([n,a])=>({n,st:rpeStats(a)})).sort((x,y)=>Math.abs(y.st.mean)-Math.abs(x.st.mean));
  return `<div class="card"><div class="eyebrow" style="margin-bottom:8px">${esc(P.name)} · ${P.n} sesiones registradas</div>
  <div class="kpis">${mk('Kilos levantados',fmt(P.kr)+' kg',`plan ${fmt(P.kp)} kg · ${pct(P.kpct)}`)}${mk('Series hechas',fmt(P.sr),`plan ${fmt(P.sp)} · ${pct(P.spct)}`)}${mk('Sesiones completas',`${P.done}/${P.n}`,'terminadas con “Terminar sesión”')}${mk('RPE del día',P.rpeDay!=null?fmt(P.rpeDay,1):'—','promedio')}</div></div>
  ${st?`<div class="card"><div class="eyebrow" style="margin-bottom:8px">RPE planificado vs real · ${st.n} series comparadas</div>
  <div class="kpis">${mk('Diferencia media',`<span class="${dcls(st.mean)}">${sgn(st.mean)}</span>`,`plan ${fmt(st.plan,1)} → real ${fmt(st.real,1)}`)}${mk('Variación media',fmt(st.abs,1),'diferencia absoluta por serie')}
  ${mk('Desviación estándar',fmt(st.sd,1),'qué tan dispersa es la diferencia')}${mk('Dentro de ±0,5',pct(st.ok),'series cerca del plan')}</div>
  <div class="sbar"><b style="width:${100*st.under}%;background:#7fb0c9"></b><b style="width:${100*(1-st.under-st.over)}%;background:var(--surface-2)"></b><b style="width:${100*st.over}%;background:var(--gold)"></b></div>
  <div class="row small" style="margin-top:4px"><span class="under">${pct(st.under)} 1+ bajo el plan</span><span class="over">${pct(st.over)} 1+ sobre el plan</span></div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Por ejercicio</div><div class="tbl wrap"><table><thead><tr><th>Ejercicio</th><th>Series</th><th>Plan</th><th>Real</th><th>Dif.</th><th>DE</th></tr></thead><tbody>
  ${exT.map(e=>`<tr><td>${esc(e.n)}</td><td class="num">${e.st.n}</td><td class="num pl">${fmt(e.st.plan,1)}</td><td class="num">${fmt(e.st.real,1)}</td><td class="num ${dcls(e.st.mean)}"><b>${sgn(e.st.mean)}</b></td><td class="num">${fmt(e.st.sd,1)}</td></tr>`).join('')}</tbody></table></div></div>`
  :`<div class="card muted">Sin RPE real anotado en este periodo.</div>`}
  ${P.bil.length?`<div class="card"><div class="row"><span class="eyebrow">Avance método Bilbo · 1RM estimado</span>${P.bilUp!=null?`<span class="pill ${P.bilUp>=0?'ok':'red'}">${P.bilUp>=0?'+':'−'}${fmt(Math.abs(P.bilUp),1)} kg</span>`:''}</div>
  ${lineChart(P.bil,'1RM estimado Bilbo por sesión')}
  <div class="tbl" style="margin-top:6px"><table><thead><tr><th>Fecha</th><th>Sesión</th><th>Serie</th><th>1RM est.</th></tr></thead><tbody>${P.bil.slice().reverse().map(b=>`<tr><td>${fdate(b.t)}</td><td>S${b.L.w} D${b.L.d}</td><td class="num">${fmt(b.kg,1)}×${b.reps}</td><td class="num"><b>${fmt(b.v,1)}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="muted small" style="margin-top:6px">1RM = peso × reps × 0,03 + peso, con la serie Bilbo de cada sesión.</div></div>`:''}`}

function vStatsGeneral(ids){ const A=ids.map(perf).filter(p=>p.n); const pct=v=>v==null?'—':fmt(100*v)+'%';
  if(!A.length) return `<div class="card muted">No hay entrenamientos en este periodo.</div>`;
  const tot=A.reduce((o,p)=>({n:o.n+p.n,kr:o.kr+p.kr,kp:o.kp+p.kp,sr:o.sr+p.sr,sp:o.sp+p.sp}),{n:0,kr:0,kp:0,sr:0,sp:0});
  const allSt=rpeStats(ids.flatMap(id=>rpeRows(id).filter(r=>inPer(r.t))));
  const mk=(l,v,p)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="p">${p}</div></div>`;
  const col=v=>v==null?'var(--muted)':v>=0.95?'var(--green)':v>=0.8?'var(--gold)':'var(--red)';
  const bilA=A.filter(p=>p.bil.length);
  return `<div class="kpis">${mk('Alumnos activos',A.length,'con sesiones en el periodo')}${mk('Sesiones',fmt(tot.n),'registradas en total')}
  ${mk('Kilos levantados',pct(tot.kp?tot.kr/tot.kp:null),`${fmt(tot.kr)} de ${fmt(tot.kp)} kg plan`)}${mk('RPE real − plan',allSt?`<span class="${dcls(allSt.mean)}">${sgn(allSt.mean)}</span>`:'—',allSt?`${allSt.n} series comparadas`:'sin RPE real')}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">Cumplimiento de kilos vs lo planificado</div><div class="muted small" style="margin-bottom:8px">En las sesiones registradas. La línea marca el 100 %.</div>
  ${hbars(A.map(p=>({l:p.name.split(' ')[0],v:p.kpct==null?null:100*p.kpct,txt:pct(p.kpct),col:col(p.kpct)})),{ref:100})}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">Series hechas vs planificadas</div><div class="muted small" style="margin-bottom:8px">Cuántas de las series de cada sesión registrada completó.</div>
  ${hbars(A.map(p=>({l:p.name.split(' ')[0],v:p.spct==null?null:100*p.spct,txt:pct(p.spct),col:col(p.spct)})),{ref:100})}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">RPE real respecto al plan</div><div class="muted small" style="margin-bottom:8px">A la derecha, se sintió más duro de lo planificado; a la izquierda, más fácil.</div>
  ${hbars(A.filter(p=>p.st).map(p=>({l:p.name.split(' ')[0],v:p.st.mean,txt:sgn(p.st.mean),col:p.st.mean>=1?'var(--gold)':p.st.mean<=-1?'#7fb0c9':'var(--muted)'})),{min:-2,max:2,zero:0,ref:0})}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Sesiones registradas</div>
  ${hbars(A.map(p=>({l:p.name.split(' ')[0],v:p.n,txt:`${p.n} (${p.done} compl.)`,col:'var(--brown)'})))}</div>
  ${bilA.length?`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Progreso Bilbo (1RM estimado)</div><div class="muted small" style="margin-bottom:8px">Primera vs última sesión del periodo.</div>
  ${hbars(bilA.map(p=>({l:p.name.split(' ')[0],v:p.bilUp??0,txt:`${fmt(p.bil[0].v,1)} → ${fmt(p.bil[p.bil.length-1].v,1)} kg`,col:(p.bilUp??0)>=0?'var(--green)':'var(--red)'})),{zero:0})}</div>`:''}
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Resumen por alumno</div><div class="tbl"><table><thead><tr><th>Alumno</th><th>Ses.</th><th>Kilos</th><th>Series</th><th>Dif. RPE</th><th>RPE día</th></tr></thead><tbody>
  ${A.map(p=>`<tr><td><button class="chip" data-cf="${p.aid}">${esc(p.name.split(' ')[0])}</button></td><td class="num">${p.n}</td><td class="num">${pct(p.kpct)}</td><td class="num">${pct(p.spct)}</td><td class="num ${p.st?dcls(p.st.mean):''}"><b>${p.st?sgn(p.st.mean):'—'}</b></td><td class="num">${p.rpeDay!=null?fmt(p.rpeDay,1):'—'}</td></tr>`).join('')}</tbody></table></div>
  <div class="muted small" style="margin-top:6px">Kilos y series: lo hecho sobre lo planificado en las sesiones que registró. Toca un nombre para ver su detalle.</div></div>`}

// Excel: una hoja por alumno con cada serie (RPE plan vs real) y sus observaciones, por fecha

  const ready=(T.total-left)>=T.min; if(left===0&&!T.beeped) restDone();

function summary(){ const out={}; for(const [aid,a] of Object.entries(DATA.athletes)){ const o=out[a.name||aid]={};
    for(const [mk,plan] of Object.entries(plansOf(a))) o[mesoLabel(mk)]=plan.weeks.map(w=>{ const t={ton:0,carga:0,series:0,eff:0,_r:0,_n:0}; let done=0;
      w.days.forEach(d=>{const L=dayLog(w.n,d.n,aid,mk); if(L&&L.done) done++; const m=realMetrics(L); for(const k in t)t[k]+=m[k]});
      return {semana:w.n,sesiones:`${done}/${w.days.length}`,tonelaje:Math.round(t.ton),carga:Math.round(t.carga),series:t.series,seriesEfectivas:t.eff,rpeMedio:t._n?+(t._r/t._n).toFixed(2):null} }) }
  return out }

  ${D('6. Saltar, volver y series no hechas',`<ul><li><b>Saltar ejercicio</b> sin marcar "Serie hecha" cuenta como que <b>esas series no se hicieron</b>. Tu coach lo ve así en su panel.</li><li>Si hiciste una serie, márcala siempre con "Serie hecha", aunque sea con otro peso o reps.</li><li><b>Anterior</b> te lleva al ejercicio previo para completar series que te faltaron.</li><li>Para <b>corregir el RPE</b> de una serie ya hecha, toca esa serie (S1, S2…) arriba de la tarjeta, escribe el nuevo valor y aprieta ✓.</li><li>Puedes salir y volver: el día queda <b>En curso</b> y retomas donde quedaste.</li></ul>`)}
  ${D('7. Serie Bilbo y 1RM estimado',`<ul><li>En la serie de <b>Press de banca Bilbo</b>, al escribir las reps ves tu <b>1RM estimado</b>: peso × reps × 0,03 + peso.</li><li>Queda guardado y tu coach ve tu avance sesión a sesión.</li></ul>`)}
  ${D('8. Observaciones para tu coach',`<ul><li>En cada ejercicio puedes tocar <b>Dejar observación</b>: elige una opción (Intensidad perfecta, Podría hacer más, Muy pesado, Molestia / dolor, Duda técnica) y escribe un comentario si quieres.</li><li>Tu coach recibe el aviso y te puede responder. Las respuestas aparecen en <b>Mis notas</b>.</li></ul>`)}
  ${D('9. Terminar la sesión y resumen',`<ul><li>En el último ejercicio aparece <b>Terminar sesión</b>. Luego marcas el RPE del día y ves el <b>resumen</b>: kilos levantados, carga, series efectivas, RPE medio y grupos musculares, comparados con el plan.</li></ul>`)}
  ${D('10. Dashboard',`<ul><li><b>Kilos levantados / tonelaje</b>: suma de kg × reps de tus series.</li><li><b>Carga</b>: tonelaje × RPE / 10.</li><li><b>Series efectivas</b>: series con RPE 7 o más.</li><li>También ves los grupos musculares trabajados, el tonelaje por día y por levantamiento, y tu peso más alto por semana.</li></ul>`)}
  ${D('11. Tema y avisos',`<ul><li>En <b>Tema</b> eliges el color de la app (dorado, rojo, azul, verde o rosa) y su tonalidad. Se guarda en tu teléfono.</li><li>Ahí también activas y pruebas el aviso del descanso.</li></ul>`)}
  ${D('12. Si algo no funciona',`<ul><li>Revisa tu internet y vuelve a abrir la app.</li><li>Si dice que el link no es válido, pídele a tu coach tu link actual.</li><li>Si no te llegan los avisos: permite las notificaciones de Chrome (o Powerosso) en los ajustes del teléfono y quita el ahorro de batería para Chrome. Con la pantalla bloqueada mucho rato, algunos teléfonos pausan la app.</li></ul>`)}
  </div>`}
function vAvisos(){ const st=!('Notification' in window)?'no':Notification.permission;
  return `<div class="card"><div class="eyebrow" style="margin-bottom:4px">Aviso al terminar el descanso</div>
  <div class="small muted" style="margin-bottom:10px">Cuando se acaba el descanso, el teléfono suena, vibra y te llega una notificación, aunque estés fuera de la app. Si tienes un reloj conectado que recibe las notificaciones del teléfono, también vibra en el reloj.</div>
  ${st==='granted'?`<div class="row"><span class="pill ok">Avisos activados</span><button class="chip" data-act="notif-on">Probar aviso</button></div>`
   :st==='denied'?`<div class="pill red">Notificaciones bloqueadas</div><div class="small muted" style="margin-top:6px">Actívalas en Ajustes del teléfono → Apps → Chrome (o Powerosso) → Notificaciones, y vuelve a abrir la app.</div>`
   :st==='no'?`<div class="small muted">Este navegador no permite notificaciones. Instala la app desde Chrome (⋮ → Instalar app).</div>`
   :`<button class="btn goldb sm" data-act="notif-on">Activar avisos</button>`}</div>`}
function vTema(){ const t=getTheme(), a=ACC.find(x=>x[0]===t.acc);
  return `<div class="card"><div class="eyebrow" style="margin-bottom:4px">Personalización</div><div class="small muted" style="margin-bottom:10px">Elige el color de la app (negro y blanco con tu color). Se guarda en este teléfono.</div>
  <div class="chips">${ACC.map(x=>`<button class="chip" data-theme="${x[0]}" aria-pressed="${t.acc===x[0]}"><i class="sw" style="background:${(x[2][t.acc===x[0]?t.tone:'medio']||x[2].medio)[0]}"></i>${x[1]}</button>`).join('')}</div>
  ${Object.keys(a[2]).length>1?`<div class="small muted" style="margin:10px 0 6px">Tonalidad</div><div class="chips">${TONES.map(([k,l])=>`<button class="chip" data-tone="${k}" aria-pressed="${t.tone===k}"><i class="sw" style="background:${a[2][k][0]}"></i>${l}</button>`).join('')}</div>`:''}</div>`}
const installBanner=()=>installEv?`<div class="banner"><span>Instala Powerosso como app en tu teléfono</span><button class="chip" data-act="install">Instalar</button></div>`:'';
(async function boot(){
  await Store.init();
  try{ if(Store.kind==='supa'&&'serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}) }catch(e){}
  if(Store.kind==='supa'){
    if(!Store.token){ S.mode='nolink'; return render() }
    try{ await Store.pull(true) }catch(e){ S.mode='nolink'; if(e.status){ S.badLink=true; if(Store.fromSaved) savedToken.clear() } else S.netErr=true; return render() }
    savedToken.set(Store.token,S.isCoach);
    S.ready=3; route();
    const again=()=>{ if(document.hidden) return; Store.pull(false).then(ch=>ch&&softRender()).catch(()=>{}) };
    setInterval(again,20000); document.addEventListener('visibilitychange',again); return }
  if(Store.kind==='db'){ let u=null; try{u=await window.claude.use('user')}catch(e){} S.isCoach=u?await u.isOwner():false }
  else S.isCoach=true;
  const loaded=new Set(); ['athletes','logs','notes'].forEach(c=>Store.listen(c,o=>{DATA[c]=o; if(loaded.size<3){ loaded.add(c); S.ready=loaded.size; if(loaded.size===3) route() } else softRender()}));
})();
</script>
