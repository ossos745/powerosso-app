<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Powerosso">
<script>
// Si el celular abre la página en "modo escritorio" (ignora el ancho del teléfono), se agranda para que se vea como app.
(function(){try{var fit=function(){var d=document.documentElement;
  if(('ontouchstart' in window||navigator.maxTouchPoints>0)&&screen.width<700&&window.innerWidth>screen.width*1.4){d.style.zoom=(window.innerWidth/screen.width).toFixed(3)}else d.style.zoom=''};
  fit();addEventListener('resize',fit)}catch(e){}})();
</script>
<title>Powerosso App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one app column (phone width) centred; sticky brand header, bottom tab bar.
   Palette taken from the Team Powerosso crest: black shield, gold trim, crimson POWER, bear brown, cream. Dark-first. */
:root{
  --bg:#0b0a0c; --surface:#16141a; --surface-2:#211e25; --line:#332e2a; --fg:#f6f2ea; --muted:#a59d90;
  --gold:#d4ad5e; --gold-2:#efd594; --red:#c3242f; --red-fg:#ff5b63; --brown:#9a6a44; --green:#5cc489; --amber:#e8b64a;
  --on-red:#fff8ef;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f1e9da; --line:#ddd0b9; --fg:#140f0c; --muted:#6c6052;
  --gold:#9c7426; --gold-2:#7a5a18; --red:#a3141f; --red-fg:#a3141f; --brown:#7a4f2e; --green:#1d7a45; --amber:#9a6a00; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f1e9da; --line:#ddd0b9; --fg:#140f0c; --muted:#6c6052;
  --gold:#9c7426; --gold-2:#7a5a18; --red:#a3141f; --red-fg:#a3141f; --brown:#7a4f2e; --green:#1d7a45; --amber:#9a6a00; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.blk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--gold);padding:10px 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:46px;height:auto;flex:0 0 auto}
.brand .who{min-width:0;flex:1}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gold{color:var(--gold)}
.macro{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.macro h1{font:800 32px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.weeks{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.wk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:5px 10px;font:600 13px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:52px}
.wk small{font:500 9px var(--mono);color:var(--muted);letter-spacing:.04em}
.wk[aria-pressed="true"]{background:var(--gold);color:#140f0c;border-color:var(--gold)}
.wk[aria-pressed="true"] small{color:#140f0c}
.wkinfo{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.wkinfo b{color:var(--fg);font-weight:600}
.banner{background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:480px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font:600 13px var(--body);padding:12px 2px 10px;cursor:pointer;position:relative}
nav.tabs button[aria-current="true"]{color:var(--fg);box-shadow:inset 0 3px 0 var(--gold)}
nav.tabs div:has(> button:nth-child(5)) button{font-size:12px}
.help details{border-top:1px solid var(--line);padding:10px 0}
.help details:first-of-type{border-top:0}
.help summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.help summary::after{content:'+';color:var(--gold);font:700 18px var(--mono)}
.help details[open] summary::after{content:'−'}
.help ul{margin:8px 0 0;padding-left:18px}.help li{margin:4px 0}.help p{margin:8px 0 0}
nav.tabs .badge{position:absolute;top:6px;margin-left:4px;background:var(--red);color:var(--on-red);font:600 10px var(--mono);border-radius:999px;padding:1px 5px}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.h2{font:700 24px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.pill{font:500 11px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.pill.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.pill.red{color:var(--red-fg);border-color:color-mix(in srgb,var(--red-fg) 45%,transparent)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--red);color:var(--on-red);font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.goldb{background:var(--gold);color:#140f0c}
.btn.sm{padding:9px 12px;font-size:15px}
.btn.inline{width:auto;display:inline-block}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.day .dn{font:800 30px/1 var(--display);text-align:center;color:var(--muted)}
.day .dn small{display:block;font:500 10px var(--mono);letter-spacing:.06em}
.day.done .dn{color:var(--gold)}
.day .t{font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.dots i.d{background:var(--gold)}.dots i.c{background:var(--red)}
.exname{font:700 26px/1.05 var(--display);text-transform:uppercase;margin:4px 0 2px;text-wrap:balance}
.load{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.load .kg{font:800 64px/1 var(--display);color:var(--fg)}
.load .u{font:600 20px var(--display);color:var(--gold)}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.spec div{background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.spec b{display:block;font:600 16px var(--mono);overflow-wrap:anywhere}
.spec span{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inputs input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:600 22px var(--mono);padding:9px 4px;text-align:center}
input.t,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:15px var(--body);padding:10px}
textarea{resize:vertical;min-height:64px}
.setlog{display:flex;flex-wrap:wrap;gap:6px}
.setlog span{font:500 12px var(--mono);background:var(--surface-2);border-radius:8px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 11px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#140f0c}
.note{border-left:3px solid var(--gold);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:3px}
.note.bad{border-color:var(--red-fg)}.note.ok{border-color:var(--green)}.note.done{opacity:.65}
.note .meta{font:500 11px var(--mono);color:var(--muted);letter-spacing:.02em}
.note .reply{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 8px}
.timer{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 95%,transparent);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.timer[hidden]{display:none}
[hidden]{display:none!important}
.rpebox{width:100%;background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;text-align:left;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 18%,transparent)}
.rpebox .q{font-weight:600;margin-bottom:8px}
.rpebox.plain{border:1px solid var(--line);box-shadow:none;background:var(--surface-2)}
.rpebox.plain input:focus{outline:2px solid var(--muted);border-color:var(--muted)}
.rpebox.ok{border-color:var(--green);box-shadow:none}
.rpein{display:flex;gap:8px}.rpein input{flex:1;min-width:0}
.okbtn{flex:0 0 64px;border:0;border-radius:10px;background:var(--green);color:#06140c;font:800 30px var(--display);cursor:pointer}
.setchip{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.setchip[aria-pressed="true"]{border-color:var(--fg)}
.bilbo{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.bilbo b{font:700 22px var(--display);color:var(--gold-2)}
.chip[aria-pressed="true"] .sw{box-shadow:0 0 0 2px var(--bg);border-color:var(--fg)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.rpebox input{width:100%;font:700 30px var(--mono);text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.rpebox input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.rpe10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.rpe10 button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 16px var(--mono)}
.rpe10 button[aria-pressed=true]{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.pie{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center}
.pie ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.pie li{display:grid;grid-template-columns:12px 1fr auto;gap:6px;align-items:center}
.pie li i{width:10px;height:10px;border-radius:2px}
.timer .in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ring{position:relative;width:min(78vw,280px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tt b{font:800 72px/1 var(--display);font-variant-numeric:tabular-nums}
.timer .go{color:var(--green);font-weight:600}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rtitle{font:800 26px/1.08 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--gold-2);margin:2px 0 10px;text-wrap:balance}
.over{color:var(--gold)} .under{color:#7fb0c9}
.sbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-top:8px}
.sbar b{display:block;height:100%}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .v{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi .p{font-size:12px;color:var(--muted)}
.kpi .l{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.tbl.wkt table{width:max-content;min-width:100%}
.tbl.wkt td .small{white-space:normal;max-width:130px}
.tbl.wkt td:first-child,.tbl.wkt th:first-child{min-width:140px;max-width:170px;position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
.tbl.wrap td{white-space:normal;font-size:12.5px}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbl td.pl{color:var(--muted)}
.hb{display:grid;grid-template-columns:90px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.hb.w{grid-template-columns:80px 1fr 118px}
.hb .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hb .tr b{display:block;height:100%;border-radius:5px}
.warn{border-left:3px solid var(--amber);padding:6px 0 6px 10px;font-size:13px}
.warn.chk{border-color:var(--red-fg)}
.warn small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px}
.file{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;position:relative}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.toast{background:color-mix(in srgb,var(--green) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:13px}
.toast.err{background:color-mix(in srgb,var(--red-fg) 14%,var(--surface));border-color:color-mix(in srgb,var(--red-fg) 40%,transparent)}
.ath{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);background:var(--surface-2);color:var(--gold);border:1px solid var(--gold)}
.link{font:500 12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
.dayplan{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.splash img{width:min(60vw,240px)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .2s ease both}@keyframes in{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}}
/* foto: en celular se ajusta con los dedos, sin barras; formato destacado */
@media (pointer:coarse){.pbars{display:none}}
html.touch .pbars{display:none}
.pfmt-lbl{color:var(--gold);font-weight:700}
.pfmt-sel{appearance:none;-webkit-appearance:none;color:#111;font-weight:700;border:0;border-radius:12px;padding:12px 40px 12px 14px;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.35);background-image:linear-gradient(135deg,var(--gold),var(--gold-2,var(--gold)));position:relative}
.pfmt-lbl{position:relative}.pfmt-lbl::after{content:'▾';position:absolute;right:14px;bottom:11px;color:#111;font-size:18px;pointer-events:none}
.bigt{font:800 34px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--gold);margin:4px 0 2px;text-wrap:balance}
.card.hero{border:1px solid var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 16%,var(--surface)) 0%,var(--surface) 60%)}
.fig{display:block;width:100%;height:auto}.figbox{background:var(--surface-2);border-radius:12px;padding:6px 10px;margin:10px 0}.figbox .fig{max-height:190px}
.mini{width:62px;flex:none;background:var(--surface-2);border-radius:8px;padding:2px}
button.day{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.daymenu{border:1px solid var(--red);margin-top:-6px}
</style>

<div class="app">

<script>
// Powerosso: lector del formato de planificación (hoja tipo "HIPERTROFIA").
// Recibe una matriz de filas (array de arrays, como XLSX.utils.sheet_to_json(ws,{header:1})) y devuelve el plan.
function parsePlan(rows, sheetName, firstRow){
  firstRow = firstRow || 1;
  const S = v => (v === null || v === undefined) ? '' : String(v).trim();
  const up = v => S(v).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const plan = {sheet: sheetName, macro: sheetName, title:'', details:'', params:{}, weeks:[], warnings:[]};
  let week=null, day=null, cols=null, titleCol=1;
  // La columna del título es la de la primera cabecera "EJERCICIO" (si no hay, la primera con "SEMANA n")
  // (la columna donde más se repite "EJERCICIO": así no la confunde una tabla de récords al lado)
  const cnt={}; for (const r of rows) (r||[]).forEach((c,i)=>{ if(up(c)==='EJERCICIO') cnt[i]=(cnt[i]||0)+1 });
  const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a-b)[0]; const found=best!==undefined; if(found) titleCol=+best;
  if(!found) for (const r of rows){ const i=(r||[]).findIndex(c=>/^SEMANA\s*\d+/.test(up(c))); if(i>=0){titleCol=i;break;} }
  const rest = txt => {
    const t = up(txt); if(!t) return null;
    const m = t.match(/(\d+(?:[.,]\d+)?)\s*(?:-|–|A)?\s*(\d+(?:[.,]\d+)?)?\s*(MIN|S|SEG)/);
    if(!m) return null;
    const k = m[3]==='MIN'?60:1, a=parseFloat(m[1].replace(',','.'))*k, b=m[2]?parseFloat(m[2].replace(',','.'))*k:a;
    return {min:Math.round(a), max:Math.round(b), text:S(txt)};
  };
  const repsNum = r => { const t=up(r); if(t==='AMRAP') return 10; const m=t.match(/\d+/g); if(!m) return 0; return m.length>1?(+m[0]+ +m[1])/2:+m[0]; };
  rows.forEach((r, idx) => {
    { const i=(r||[]).findIndex(c=>up(c)==='1RM'); if(i>=0 && rows[idx+1]) for(let c=i+1;c<r.length;c++){ if(S(r[c]) && typeof rows[idx+1][c]==='number') plan.params['1RM '+S(r[c])+' (kg)']=rows[idx+1][c]; } }
    r = r || []; const b = S(r[titleCol]), B = up(r[titleCol]), rowN = idx+firstRow;
    // parámetros a la derecha (pares etiqueta/valor)
    for (let c=titleCol+12;c<r.length-1;c++){ if(typeof r[c+1]==='number' && /1RM|BILBO|\(KG\)/.test(up(r[c])) && !(S(r[c]) in plan.params)) plan.params[S(r[c])]=r[c+1]; }
    if(!b) return;
    // "SEMANA 3 – ...", "HIPERTROFIA SEMANA 3 (RPE 7)" o "SEMANA 3(8 DE JUNIO)"
    const wm = B.match(/^(?:(?:HIPERTROFIA|FUERZA\s*BASE|VOLUMEN|PEAKING|TAP+ERING|DESCARGA)(?:\s*\d+)?\s+)?SEMANA\s*(\d+)\b\s*[–-]?\s*(.*)$/);
    if (wm){ week={n:+wm[1], label:S(b).replace(/^.*?SEMANA\s*\d+\s*[–-]?\s*/i,'').replace(/^\((.*)\)$/,'$1'), deload:/DESCARGA/.test(B), days:[]}; plan.weeks.push(week); day=null; return; }
    const dm = B.match(/^DIA\s*(\d+)\s*[–:-]?\s*(.*)$/);
    if (dm){ if(!week){ plan.warnings.push({row:rowN,msg:'Día antes de la primera semana'}); return; }
      const restTxt=S(b).replace(/^D[IÍií]A\s*\d+\s*[–:-]?\s*/i,''); const ci=restTxt.indexOf(':');
      const WD=/^(LUNES|MARTES|MI[EÉ]RCOLES|JUEVES|VIERNES|S[AÁ]BADO|DOMINGO)\b/i;
      const wd=ci>0?restTxt.slice(0,ci).trim():''; const isWd=WD.test(wd)&&wd.replace(WD,'').trim()==='';
      const lead=!isWd&&ci<0&&restTxt.match(WD);   // "DÍA 4: SÁBADO(FULLBODY)" o "DÍA 1: LUNES"
      day={n:+dm[1], weekday:isWd?wd:lead?lead[1]:'', focus:isWd?restTxt.slice(ci+1).trim():lead?restTxt.slice(lead[0].length).replace(/^[\s(–:-]+|\)\s*$/g,'').trim():restTxt, exercises:[]}; week.days.push(day);
      if(r.slice(titleCol+1).some(v=>/^D[IÍ]A\s*\d+/i.test(S(v)))) plan.warnings.push({row:rowN, where:`Semana ${week.n}`, kind:'check', msg:'Hay una segunda tabla de día al lado (más a la derecha); la app solo carga la de la izquierda'});
      return; }
    if (B==='EJERCICIO'){ cols={}; let stop=false; r.forEach((h,c)=>{ const H=up(h); if(c>titleCol && H==='EJERCICIO') stop=true; if(stop||c<=titleCol) return;
        const k=/^PESO/.test(H)?'kg':H==='SERIES'?'sets':/^REP(ETICION|S\b|$)/.test(H)?'reps':/^RPE(\s*\(@\))?$/.test(H)?'rpe':/^DESCANSO/.test(H)?'rest':/^%/.test(H)?'pct':/^RANGO/.test(H)?'range':null;
        if(k && (cols[k]===undefined || k==='range')) cols[k]=c; }); return; }
    if (!week){ if(!plan.title) plan.title=b; else if(!plan.details) plan.details=b; return; }
    if (!day || !cols || /^OBJETIVO/.test(B)) return;
    const g = k => cols[k]===undefined?undefined:r[cols[k]];

const DATA={athletes:{},logs:{},notes:{}};
// Mesociclos: solo cuentan las hojas cuyo nombre contiene una de estas palabras (sin importar mayúsculas ni tildes)
const MESOS=[['HIPERTROFIA','Hipertrofia',/HIPERTROFIA/],['FUERZA BASE','Fuerza base',/FUERZA\s*BASE/],['VOLUMEN','Volumen',/VOLUMEN/],['PEAKING','Peaking',/PEAKING/],['TAPERING','Tapering',/TAP+ERING/]];
const normU=t=>String(t||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
// serie Bilbo = la serie AMRAP de banca Bilbo (no las "(BILBO +20 kg)")
const isBilbo=x=>!!x&&/BILBO/.test(normU(x.name))&&!/BILBO\s*\+/.test(normU(x.name));
const rm1=(kg,reps)=>(+kg>0&&+reps>0)?(+kg)*(+reps)*0.03+(+kg):null;  // 1RM = peso × reps × 0,03 + peso
// fecha del entrenamiento: la última vez que se registró algo en ese día
const sessDate=L=>{const ts=Object.values(L.sets||{}).flat().map(s=>s&&s.t||0); return L.trainedAt||L.finishedAt||(ts.length?Math.max(...ts):0)||Date.parse(L.date)||0};
// nombre de hoja → mesociclo: ignora espacios, mayúsculas y tildes; "Volumen 2" es otro mesociclo que "Volumen"
function mesoFromSheet(n){ const t=normU(n).replace(/[^A-Z0-9]/g,''); for(const m of MESOS){ if(!m[2].test(t)) continue;
    const mm=t.match(new RegExp(m[2].source.replace('\\s*','')+'(\\d{1,2})(?!\\d)')); const num=mm?+mm[1]:0; return num>1?m[0]+' '+num:m[0] } return null }
const mesoBase=k=>MESOS.find(m=>k===m[0]||String(k).startsWith(m[0]+' '));
const mesoLabel=k=>{ const b=mesoBase(k); return b?b[1]+(k.length>b[0].length?k.slice(b[0].length):''):k };
const mesoOrder=k=>{ const b=mesoBase(k); return b?MESOS.indexOf(b)*100+(+String(k).slice(b[0].length)||1):9999 };
const mesoKeys=a=>Object.keys(plansOf(a)).sort((x,y)=>mesoOrder(x)-mesoOrder(y));
function wbPlans(wb){ const plans={}, skipped=[];
  for(const n of wb.SheetNames){ const k=mesoFromSheet(n); if(!k) continue; const ws=wb.Sheets[n]; if(!ws||!ws['!ref']) continue;
    const p=parsePlan(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),n,XLSX.utils.decode_range(ws['!ref']).s.r+1);
    const ex=p.weeks.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.exercises.length,0),0); if(!ex){skipped.push(n);continue}
    p.weeks=p.weeks.filter(w=>w.days.some(d=>d.exercises.length)); p.meso=k; p.macro=mesoLabel(k).toUpperCase(); p.nEx=ex;
    if(!plans[k]||ex>plans[k].nEx) plans[k]=p }
  return {plans,skipped,sheets:wb.SheetNames} }
// planes de un alumno: de su planilla en Supabase, o guardados en su ficha (artifact / navegador)
function plansOf(a){ if(!a) return {}; if(Store.kind==='supa') return (Store.parsed[a.file]||{}).plans||{}; if(a.plans) return a.plans; if(a.plan) return {[a.plan.meso||'HIPERTROFIA']:a.plan}; return {} }
function mesoOf(a){ const P=plansOf(a); if(a&&a.meso&&P[a.meso]) return a.meso; return mesoKeys(a)[0]||null }
const planOf=a=>{const k=mesoOf(a); return k?plansOf(a)[k]:null};

function planMetrics(day){let t=0,c=0,s=0,e=0,rs=0,rn=0;
  day.exercises.forEach(x=>{const kg=x.kg||0, reps=x.repsN||0; t+=kg*reps*x.sets; c+=kg*reps*x.sets*(x.rpeN||0)/10; s+=x.sets; if((x.rpeN||0)>=EFF)e+=x.sets; if(x.rpeN){rs+=x.rpeN*x.sets;rn+=x.sets}});
  return {ton:t,carga:c,series:s,eff:e,rpe:rn?rs/rn:null,_r:rs,_n:rn}}
function realMetrics(log){let t=0,c=0,s=0,e=0,rs=0,rn=0; if(!log) return {ton:0,carga:0,series:0,eff:0,rpe:null,_r:0,_n:0};
  Object.values(log.sets||{}).forEach(arr=>arr.forEach(st=>{const kg=+st.kg||0,r=+st.reps||0,rpe=+(st.rpe??st.rpePlan)||0; t+=kg*r; c+=kg*r*rpe/10; s++; if(rpe>=EFF)e++; if(rpe){rs+=rpe;rn++}}));
  return {ton:t,carga:c,series:s,eff:e,rpe:rn?rs/rn:null,_r:rs,_n:rn}}
function weekMetrics(w,real){const a={ton:0,carga:0,series:0,eff:0,_r:0,_n:0};
  w.days.forEach(d=>{const m=real?realMetrics(dayLog(w.n,d.n)):planMetrics(d); for(const k in a)a[k]+=m[k]}); a.rpe=a._n?a._r/a._n:null; return a}
function heaviest(w,cat){let plan=null,real=null;
  w.days.forEach(d=>d.exercises.forEach((x,i)=>{ if(LIFT(x.name)!==cat) return; if(x.kg!=null) plan=Math.max(plan||0,x.kg); const st=(dayLog(w.n,d.n)||{sets:{}}).sets[i]; if(st&&st.length) real=Math.max(real||0,...st.map(s=>+s.kg||0)) }));
  return {plan,real}}
function weekDone(w,aid=S.aid){return w.days.filter(d=>(dayLog(w.n,d.n,aid)||{}).done).length}
function currentWeek(aid=S.aid){const W=planOf(DATA.athletes[aid]).weeks; let last=-1; W.forEach((w,i)=>{ if(w.days.some(d=>dayLog(w.n,d.n,aid))) last=i }); if(last<0) return W[0].n; const w=W[last]; if(w.days.every(d=>(dayLog(w.n,d.n,aid)||{}).done) && W[last+1]) return W[last+1].n; return w.n}

function dayChart(w){const W=320,H=150,P=26,bw=(W-P)/w.days.length; const vals=w.days.map(d=>({p:planMetrics(d).ton,r:realMetrics(dayLog(w.n,d.n)).ton}));

  const bars=vals.map((v,i)=>{const x=P+i*bw+bw*0.15, b=bw*0.34; return `<rect x="${x}" y="${y(v.p)}" width="${b}" height="${H-18-y(v.p)}" rx="2" fill="var(--surface-2)" stroke="var(--line)"/><rect x="${x+b+2}" y="${y(v.r)}" width="${b}" height="${H-18-y(v.r)}" rx="2" fill="var(--red)"/><text x="${x+b}" y="${H-4}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${dayShort(w.days[i])}</text>`}).join('');

const fdLong=ts=>{try{return new Date(ts).toLocaleDateString('es-CL',{day:'numeric',month:'long'})}catch(e){return ''}};
const fdNum=ts=>{try{return new Date(ts).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return ''}};
const hasR=v=>v!=null&&v!==''&&!isNaN(+v);
const sgn=v=>v==null?'—':(v>0.05?'+':v<-0.05?'−':'±')+fmt(Math.abs(v),1);
const dcls=v=>v>=1?'over':v<=-1?'under':'';
const avgOf=v=>v.length?v.reduce((p,q)=>p+q,0)/v.length:null;
// sesiones registradas de un alumno, con su día de la planilla, de la más antigua a la más nueva
function sessionsOf(aid){ const a=DATA.athletes[aid]||{};

    const t=sessDate(L); return {id,L,d,t} }).sort((x,y)=>x.t-y.t) }
// una fila por serie hecha: RPE plan y RPE real
function rpeRows(aid){ return sessionsOf(aid).flatMap(o=>Object.entries(o.L.sets||{}).flatMap(([i,arr])=>{ const x=o.d&&o.d.exercises[i];
  return (arr||[]).map((s,k)=>({...o,i:+i,x,name:x?title(x.name):'Ejercicio '+(+i+1),k:k+1,s,plan:hasR(s.rpePlan)?+s.rpePlan:(x&&x.rpeN)||null,real:hasR(s.rpe)?+s.rpe:null})) })) }
function rpeStats(rows){ const c=rows.filter(r=>r.plan!=null&&r.real!=null), v=c.map(r=>r.real-r.plan), n=v.length; if(!n) return null; const m=avgOf(v);
  return {n,mean:m,abs:avgOf(v.map(Math.abs)),sd:Math.sqrt(avgOf(v.map(x=>(x-m)**2))),over:v.filter(x=>x>=1).length/n,under:v.filter(x=>x<=-1).length/n,ok:v.filter(x=>Math.abs(x)<=0.5).length/n,
    plan:avgOf(c.map(r=>r.plan)),real:avgOf(c.map(r=>r.real))} }

      const sp=x?x.sets:null;
      return `<tr><td>${x?title(x.name):'Ejercicio '+(o.i+1)}${x?`<div class="small muted">plan ${x.sets}×${esc(x.reps||'—')}</div>`:''}${n?`<div class="setlog" style="margin-top:4px">${o.arr.map((s,j)=>`<button class="setchip small" data-cset="${L.id}|${o.i}|${j}" aria-pressed="${S.cset===L.id+'|'+o.i+'|'+j}">S${j+1} ${hasR(s.kg)&&+s.kg?fmt(+s.kg,1)+'×':''}${s.reps??'—'} ${hasR(s.rpe)?'@'+fmt(+s.rpe,1)+(s.rpeBy==='coach'?' (coach)':''):'· poner RPE'}</button>`).join('')}</div>`:''}${bil}</td>
      <td class="num"><b class="${sp&&n<sp?'under':''}">${n}</b><span class="pl">/${sp??'—'}</span></td><td class="num">${n?pr(kpl,kre,1):`<span class="pl">${kpl!=null?fmt(kpl,1):'—'}</span>`}</td><td class="num">${pr(rpl,rre,1)}</td></tr>`}).join('')}
    </tbody></table></div>
    ${(()=>{ if(!S.cset||!S.cset.startsWith(L.id+'|')) return ''; const [,ci,cj]=S.cset.split('|'), st=((L.sets||{})[ci]||[])[+cj], x=d&&d.exercises[+ci]; if(!st) return '';
      return `<div class="rpebox plain" style="margin-top:10px"><div class="q">RPE real · ${x?title(x.name):'Ejercicio'} · serie ${+cj+1} <span class="muted small">(${hasR(st.kg)&&+st.kg?fmt(+st.kg,1)+' kg × ':''}${st.reps} reps)</span></div>
      <div class="rpein"><input id="coach-rpe" type="text" inputmode="decimal" autocomplete="off" placeholder="—" value="${hasR(st.rpe)?esc(st.rpe):''}"><button class="okbtn" data-act="cset-ok" aria-label="Guardar RPE">✓</button></div>
      <div class="row" style="margin-top:8px"><span class="small muted">Queda marcado como puesto por el coach. Vacío + ✓ lo quita.</span><button class="chip" data-act="cset-cancel">Cancelar</button></div></div>` })()}
    <div style="margin-top:8px;text-align:right"><button class="chip" data-dellog="${L.id}">Borrar registro de este día</button></div></div>` };
  return `<h2 class="h2">Plan vs real</h2><div class="muted small">Cada día de entrenamiento: lo planificado frente a lo que el alumno hizo en series, kg y RPE. Debajo de cada valor va la diferencia (real − plan). En celeste, menos de lo planificado; en color, 1 punto de RPE o más sobre el plan.</div>
  <div class="chips"><button class="chip" data-rf="" aria-pressed="${!f}">Todos</button>${ids.map(id=>`<button class="chip" data-rf="${id}" aria-pressed="${f===id}">${esc(DATA.athletes[id]?.name||id)}</button>`).join('')}</div>
  ${shown.length?shown.map(card).join(''):`<div class="card muted">Todavía no hay entrenamientos registrados. Aparecen aquí cuando un alumno marca series.</div>`}`}

// ---------- Estadísticas ----------
const H6=182.5*864e5;
function periods(){ const ts=Object.values(DATA.logs).map(sessDate).filter(Boolean), set=new Set(ts.map(t=>{const d=new Date(t); return d.getFullYear()+'-'+(d.getMonth()<6?1:2)}));
  return [['6m','Últimos 6 meses'],...[...set].sort().reverse().map(k=>{const [y,h]=k.split('-'); return [k,(h==='1'?'Ene–Jun ':'Jul–Dic ')+y]}),['all','Todo']] }
const inPer=t=>{const p=S.period||'all'; if(p==='all') return true; if(p==='6m') return t>=Date.now()-H6; const d=new Date(t), [y,h]=p.split('-'); return d.getFullYear()===+y&&(d.getMonth()<6?'1':'2')===h};
// rendimiento de un alumno en el periodo: lo hecho frente a lo planificado en las sesiones que registró
function perf(aid){ const ss=sessionsOf(aid).filter(o=>o.d&&inPer(o.t)&&Object.values(o.L.sets||{}).some(a=>(a||[]).length)); let kr=0,kp=0,sr=0,sp=0;
  ss.forEach(o=>{ const rm=realMetrics(o.L), pm=planMetrics(o.d); kr+=rm.ton; kp+=pm.ton; sr+=rm.series; sp+=pm.series });
  const rows=rpeRows(aid).filter(r=>inPer(r.t)), st=rpeStats(rows), bil=bilboPts(aid);
  return {aid,name:DATA.athletes[aid].name,n:ss.length,done:ss.filter(o=>o.L.done).length,kr,kp,kpct:kp?kr/kp:null,sr,sp,spct:sp?sr/sp:null,st,bil,
    rpeDay:avgOf(ss.map(o=>+o.L.rpeDay).filter(Boolean)),bilUp:bil.length>1?bil[bil.length-1].v-bil[0].v:null} }
// mejor 1RM estimado Bilbo de cada sesión
function bilboPts(aid){ return sessionsOf(aid).filter(o=>inPer(o.t)).map(o=>{ let best=null; Object.entries(o.L.sets||{}).forEach(([i,arr])=>{ const x=o.d&&o.d.exercises[i]; if(!isBilbo(x)&&!(arr||[]).some(s=>s.bilbo)) return;
    (arr||[]).forEach(s=>{const v=rm1(s.kg,s.reps); if(v&&(!best||v>best.v)) best={v,kg:+s.kg,reps:+s.reps}}) }); return best&&{...best,t:o.t,L:o.L} }).filter(Boolean) }
function lineChart(pts,lbl){ const W=320,H=170,P=34,B=24; if(!pts.length) return '';
  const vs=pts.map(p=>p.v), lo=Math.floor((Math.min(...vs)-2)/5)*5, hi=Math.ceil((Math.max(...vs)+2)/5)*5, x=i=>pts.length===1?(W+P)/2:P+8+i*(W-P-16)/(pts.length-1), y=v=>H-B-(v-lo)/(hi-lo||1)*(H-B-12);
  let g=''; const st=Math.max(5,Math.ceil((hi-lo)/4/5)*5); for(let t=lo;t<=hi;t+=st) g+=`<line x1="${P}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${P-4}" y="${y(t)+3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`;
  const every=Math.ceil(pts.length/6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(lbl)}">${g}<polyline fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--gold)" stroke="var(--surface)" stroke-width="1.5"/>${i%every===0||i===pts.length-1?`<text x="${x(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${esc(fdate(p.t))}</text>`:''}`).join('')}</svg>`}
// barras horizontales: items [{l, v, txt, col}], ref = línea de referencia (p. ej. 100 %)
function hbars(items,{min=0,max,ref,zero}={}){ if(!items.length) return '<div class="muted small">Sin datos en este periodo.</div>';
  const vs=items.map(i=>i.v).filter(v=>v!=null); max=max??Math.max(ref||0,...vs,0.0001); min=Math.min(min,...vs); const pos=v=>100*(v-min)/((max-min)||1);
  return `<div style="display:flex;flex-direction:column;gap:8px">${items.map(i=>{ const z=pos(zero??Math.max(min,0)), p=i.v==null?z:pos(i.v), l=Math.min(z,p), w=Math.abs(p-z);
    return `<div class="hb w"><span>${esc(i.l)}</span><div class="tr" style="position:relative;overflow:visible">${i.v==null?'':`<b style="position:absolute;left:${l}%;width:${Math.max(w,.8)}%;top:0;bottom:0;background:${i.col||'var(--gold)'}"></b>`}${ref!=null?`<i style="position:absolute;left:${pos(ref)}%;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6"></i>`:''}</div><span class="num" style="text-align:right">${i.txt}</span></div>`}).join('')}</div>`}

function vStats(){ const pers=periods(); if(!pers.some(p=>p[0]===(S.period||'all'))) S.period='all';
  const ids=Object.keys(DATA.athletes).filter(id=>sessionsOf(id).some(o=>Object.values(o.L.sets||{}).some(a=>(a||[]).length))).sort((x,y)=>String(DATA.athletes[x].name).localeCompare(DATA.athletes[y].name));
  const f=ids.includes(S.cfilter)?S.cfilter:'';
  const xlsBtn=`<button class="btn goldb sm" data-act="xls">Exportar Excel (RPE y observaciones)</button>`;
  const head=`<h2 class="h2">Estadísticas</h2>
  <div class="chips"><button class="chip" data-cf="" aria-pressed="${!f}">General</button>${ids.map(id=>`<button class="chip" data-cf="${id}" aria-pressed="${f===id}">${esc(DATA.athletes[id].name)}</button>`).join('')}</div>
  <div class="chips">${pers.map(([k,l])=>`<button class="chip" data-per="${k}" aria-pressed="${(S.period||'all')===k}">${l}</button>`).join('')}</div>`;
  if(!ids.length) return `${head}<div class="card muted">Todavía no hay entrenamientos registrados.</div>${xlsBtn}`;
  return head+(f?vStatsAlumno(f):vStatsGeneral(ids))+xlsBtn }

function vStatsAlumno(f){ const P=perf(f), rows=rpeRows(f).filter(r=>inPer(r.t)), st=P.st, pct=v=>v==null?'—':fmt(100*v)+'%', mk=(l,v,p)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="p">${p}</div></div>`;
  if(!P.n) return `<div class="card muted">${esc(P.name)} no tiene entrenamientos en este periodo.</div>`;
  const by={}; rows.filter(r=>r.real!=null&&r.plan!=null).forEach(r=>(by[r.name]=by[r.name]||[]).push(r));
  const exT=Object.entries(by).map(([n,a])=>({n,st:rpeStats(a)})).sort((x,y)=>Math.abs(y.st.mean)-Math.abs(x.st.mean));
  return `<div class="card"><div class="eyebrow" style="margin-bottom:8px">${esc(P.name)} · ${P.n} sesiones registradas</div>
  <div class="kpis">${mk('Kilos levantados',fmt(P.kr)+' kg',`plan ${fmt(P.kp)} kg · ${pct(P.kpct)}`)}${mk('Series hechas',fmt(P.sr),`plan ${fmt(P.sp)} · ${pct(P.spct)}`)}${mk('Sesiones completas',`${P.done}/${P.n}`,'terminadas con “Terminar sesión”')}${mk('RPE del día',P.rpeDay!=null?fmt(P.rpeDay,1):'—','promedio')}</div></div>
  ${st?`<div class="card"><div class="eyebrow" style="margin-bottom:8px">RPE planificado vs real · ${st.n} series comparadas</div>
  <div class="kpis">${mk('Diferencia media',`<span class="${dcls(st.mean)}">${sgn(st.mean)}</span>`,`plan ${fmt(st.plan,1)} → real ${fmt(st.real,1)}`)}${mk('Variación media',fmt(st.abs,1),'diferencia absoluta por serie')}
  ${mk('Desviación estándar',fmt(st.sd,1),'qué tan dispersa es la diferencia')}${mk('Dentro de ±0,5',pct(st.ok),'series cerca del plan')}</div>
  <div class="sbar"><b style="width:${100*st.under}%;background:#7fb0c9"></b><b style="width:${100*(1-st.under-st.over)}%;background:var(--surface-2)"></b><b style="width:${100*st.over}%;background:var(--gold)"></b></div>
  <div class="row small" style="margin-top:4px"><span class="under">${pct(st.under)} 1+ bajo el plan</span><span class="over">${pct(st.over)} 1+ sobre el plan</span></div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Por ejercicio</div><div class="tbl wrap"><table><thead><tr><th>Ejercicio</th><th>Series</th><th>Plan</th><th>Real</th><th>Dif.</th><th>DE</th></tr></thead><tbody>
  ${exT.map(e=>`<tr><td>${esc(e.n)}</td><td class="num">${e.st.n}</td><td class="num pl">${fmt(e.st.plan,1)}</td><td class="num">${fmt(e.st.real,1)}</td><td class="num ${dcls(e.st.mean)}"><b>${sgn(e.st.mean)}</b></td><td class="num">${fmt(e.st.sd,1)}</td></tr>`).join('')}</tbody></table></div></div>`
  :`<div class="card muted">Sin RPE real anotado en este periodo.</div>`}
  ${P.bil.length?`<div class="card"><div class="row"><span class="eyebrow">Avance método Bilbo · 1RM estimado</span>${P.bilUp!=null?`<span class="pill ${P.bilUp>=0?'ok':'red'}">${P.bilUp>=0?'+':'−'}${fmt(Math.abs(P.bilUp),1)} kg</span>`:''}</div>
  ${lineChart(P.bil,'1RM estimado Bilbo por sesión')}
  <div class="tbl" style="margin-top:6px"><table><thead><tr><th>Fecha</th><th>Sesión</th><th>Serie</th><th>1RM est.</th></tr></thead><tbody>${P.bil.slice().reverse().map(b=>`<tr><td>${fdate(b.t)}</td><td>S${b.L.w} D${b.L.d}</td><td class="num">${fmt(b.kg,1)}×${b.reps}</td><td class="num"><b>${fmt(b.v,1)}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="muted small" style="margin-top:6px">1RM = peso × reps × 0,03 + peso, con la serie Bilbo de cada sesión.</div></div>`:''}`}

function vStatsGeneral(ids){ const A=ids.map(perf).filter(p=>p.n); const pct=v=>v==null?'—':fmt(100*v)+'%';
  if(!A.length) return `<div class="card muted">No hay entrenamientos en este periodo.</div>`;
  const tot=A.reduce((o,p)=>({n:o.n+p.n,kr:o.kr+p.kr,kp:o.kp+p.kp,sr:o.sr+p.sr,sp:o.sp+p.sp}),{n:0,kr:0,kp:0,sr:0,sp:0});
  const allSt=rpeStats(ids.flatMap(id=>rpeRows(id).filter(r=>inPer(r.t))));
  const mk=(l,v,p)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="p">${p}</div></div>`;
  const col=v=>v==null?'var(--muted)':v>=0.95?'var(--green)':v>=0.8?'var(--gold)':'var(--red)';
  const bilA=A.filter(p=>p.bil.length);
  return `<div class="kpis">${mk('Alumnos activos',A.length,'con sesiones en el periodo')}${mk('Sesiones',fmt(tot.n),'registradas en total')}
  ${mk('Kilos levantados',pct(tot.kp?tot.kr/tot.kp:null),`${fmt(tot.kr)} de ${fmt(tot.kp)} kg plan`)}${mk('RPE real − plan',allSt?`<span class="${dcls(allSt.mean)}">${sgn(allSt.mean)}</span>`:'—',allSt?`${allSt.n} series comparadas`:'sin RPE real')}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">Cumplimiento de kilos vs lo planificado</div><div class="muted small" style="margin-bottom:8px">En las sesiones registradas. La línea marca el 100 %.</div>
  ${hbars(A.map(p=>({l:p.name.split(' ')[0],v:p.kpct==null?null:100*p.kpct,txt:pct(p.kpct),col:col(p.kpct)})),{ref:100})}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">Series hechas vs planificadas</div><div class="muted small" style="margin-bottom:8px">Cuántas de las series de cada sesión registrada completó.</div>
  ${hbars(A.map(p=>({l:p.name.split(' ')[0],v:p.spct==null?null:100*p.spct,txt:pct(p.spct),col:col(p.spct)})),{ref:100})}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">RPE real respecto al plan</div><div class="muted small" style="margin-bottom:8px">A la derecha, se sintió más duro de lo planificado; a la izquierda, más fácil.</div>
  ${hbars(A.filter(p=>p.st).map(p=>({l:p.name.split(' ')[0],v:p.st.mean,txt:sgn(p.st.mean),col:p.st.mean>=1?'var(--gold)':p.st.mean<=-1?'#7fb0c9':'var(--muted)'})),{min:-2,max:2,zero:0,ref:0})}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Sesiones registradas</div>
  ${hbars(A.map(p=>({l:p.name.split(' ')[0],v:p.n,txt:`${p.n} (${p.done} compl.)`,col:'var(--brown)'})))}</div>
  ${bilA.length?`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Progreso Bilbo (1RM estimado)</div><div class="muted small" style="margin-bottom:8px">Primera vs última sesión del periodo.</div>
  ${hbars(bilA.map(p=>({l:p.name.split(' ')[0],v:p.bilUp??0,txt:`${fmt(p.bil[0].v,1)} → ${fmt(p.bil[p.bil.length-1].v,1)} kg`,col:(p.bilUp??0)>=0?'var(--green)':'var(--red)'})),{zero:0})}</div>`:''}
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Resumen por alumno</div><div class="tbl"><table><thead><tr><th>Alumno</th><th>Ses.</th><th>Kilos</th><th>Series</th><th>Dif. RPE</th><th>RPE día</th></tr></thead><tbody>
  ${A.map(p=>`<tr><td><button class="chip" data-cf="${p.aid}">${esc(p.name.split(' ')[0])}</button></td><td class="num">${p.n}</td><td class="num">${pct(p.kpct)}</td><td class="num">${pct(p.spct)}</td><td class="num ${p.st?dcls(p.st.mean):''}"><b>${p.st?sgn(p.st.mean):'—'}</b></td><td class="num">${p.rpeDay!=null?fmt(p.rpeDay,1):'—'}</td></tr>`).join('')}</tbody></table></div>
  <div class="muted small" style="margin-top:6px">Kilos y series: lo hecho sobre lo planificado en las sesiones que registró. Toca un nombre para ver su detalle.</div></div>`}

// Excel: una hoja por alumno con cada serie (RPE plan vs real) y sus observaciones, por fecha
function exportExcel(){ if(typeof XLSX==='undefined') return flash('No se pudo cargar el lector de Excel. Revisa tu conexión.',true);
  const wb=XLSX.utils.book_new(), used=new Set(), r2=v=>v==null||isNaN(v)?'':Math.round(v*100)/100;
  const list=Object.entries(DATA.athletes).sort((a,b)=>(a[1].coach?1:0)-(b[1].coach?1:0)||String(a[1].name).localeCompare(b[1].name));
  for(const [aid,a] of list){ const rows=rpeRows(aid), ns=notesOf(aid).slice().sort((x,y)=>x.at-y.at); if(!rows.length&&!ns.length) continue; const st=rpeStats(rows);
    const aoa=[[`${a.name} · RPE planificado vs real y observaciones`],[`Exportado el ${fdNum(Date.now())} desde Powerosso App`],[]];
    if(st) aoa.push(['Series comparadas','Diferencia media (real − plan)','Variación media (absoluta)','Desviación estándar','% dentro de ±0,5','% 1+ sobre el plan','% 1+ bajo el plan'],
      [st.n,r2(st.mean),r2(st.abs),r2(st.sd),r2(100*st.ok),r2(100*st.over),r2(100*st.under)],[]);
    aoa.push(['SERIES'],['Fecha','Mesociclo','Semana','Día','Ejercicio','Serie','kg','Reps','RPE plan','RPE real','Diferencia','RPE del día','Observación del alumno','1RM est. Bilbo']);
    rows.forEach(r=>{ const obs=r.k===1?ns.filter(o=>o.w===r.L.w&&o.d===r.L.d&&o.ex===r.i&&(o.meso||r.L.meso)===r.L.meso).map(o=>[o.tag,o.text].filter(Boolean).join(': ')).join(' | '):'';
      aoa.push([fdNum(r.t),mesoLabel(r.L.meso||''),r.L.w,`Día ${r.L.d}${r.d&&r.d.weekday?' ('+title(r.d.weekday)+')':''}`,r.name,r.k,hasR(r.s.kg)?+r.s.kg:'',r.s.reps??'',r.plan??'',r.real??'',r.plan!=null&&r.real!=null?r2(r.real-r.plan):'',r.L.rpeDay||'',obs,isBilbo(r.x)||r.s.bilbo?r2(rm1(r.s.kg,r.s.reps)):'']) });
    if(!rows.length) aoa.push(['Sin series registradas']);
    aoa.push([],['OBSERVACIONES'],['Fecha','Mesociclo','Semana','Día','Ejercicio','Observación','Comentario','Respuesta del coach','Revisada']);
    ns.forEach(o=>aoa.push([fdNum(o.at),mesoLabel(o.meso||''),o.w,o.dayLabel||`Día ${o.d}`,title(o.exName||''),o.tag||'',o.text||'',o.reply||'',o.reviewed?'Sí':'No']));
    if(!ns.length) aoa.push(['Sin observaciones']);
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[12,14,8,16,30,7,8,7,9,9,11,11,40,14].map(w=>({wch:w}));
    let nm=String(a.name||aid).replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31)||'Alumno', base=nm, k=2; while(used.has(nm.toLowerCase())) nm=base.slice(0,28)+' '+(k++); used.add(nm.toLowerCase());
    XLSX.utils.book_append_sheet(wb,ws,nm) }
  if(!wb.SheetNames.length) return flash('Todavía no hay series ni observaciones para exportar.',true);
  try{ XLSX.writeFile(wb,`powerosso-rpe-observaciones-${new Date().toISOString().slice(0,10)}.xlsx`); flash(`Excel descargado: ${wb.SheetNames.length} ${wb.SheetNames.length===1?'hoja':'hojas'}, una por alumno.`) }catch(e){ flash('No se pudo crear el Excel.',true) } }

function vNotasCoach(){const all=Object.entries(DATA.notes).map(([id,n])=>({id,...n})).sort((a,b)=>(a.reviewed?1:0)-(b.reviewed?1:0)||b.at-a.at);
  const f=S.nfilter||''; const shown=all.filter(n=>!f||n.aid===f);
  const ids=[...new Set(all.map(n=>n.aid))];
  return `<h2 class="h2">Observaciones</h2>
  <div class="chips"><button class="chip" data-nf="" aria-pressed="${!f}">Todos</button>${ids.map(id=>`<button class="chip" data-nf="${id}" aria-pressed="${f===id}">${esc(DATA.athletes[id]?.name||id)}${unread(id)?` · ${unread(id)}`:''}</button>`).join('')}</div>
  ${shown.length?`<div class="card" style="display:flex;flex-direction:column;gap:12px">${shown.map(n=>noteHtml(n,true)).join('')}</div>`:`<div class="card muted">Sin observaciones todavía. Aparecen aquí cuando un alumno deja una en un ejercicio.</div>`}`}

function vCoachAthlete(){const a=ATH(), P=PLAN(); let sub=S.csub||'rutina'; if(!P&&sub!=='notas'&&sub!=='datos') sub='cargar'; const w=P&&wkObj(S.week);
  const tabs=[['rutina','Rutina'],['dash','Dashboard'],['notas','Observaciones'+(unread(S.aid)?` (${unread(S.aid)})`:'')],['cargar','Planilla'],['datos','Datos']];
  let body='';

let ac=null, tick=null, wake=null;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.21)})}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(rest,label,set){S.timer={end:Date.now()+rest.max*1000,total:rest.max,min:rest.min,label,beeped:false,set};
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}

  <div id="t-msg"></div>
  ${set?`<div id="t-rpebox" style="width:100%">${tRpeHtml()}</div>`:''}

  <div class="btns3"><button class="btn ghost sm" data-t="-15">−15 s</button><button class="btn ghost sm" data-t="+30">+30 s</button><button class="btn sm" data-t="skip" id="t-skip">Saltar</button></div></div>`;
  clearInterval(tick); tick=setInterval(drawTimer,250); armRestAlarm(); drawTimer()}
// RPE de la serie recién hecha: se confirma con ✓; si ya está, se muestra "RPE registrado" con opción de modificar

  return `<div class="rpebox"><div class="q">${has?'Modificar RPE':'¿Qué tan dura fue la serie del 1 al 10? (RPE REAL)'} <span class="muted small">serie ${T.set.n}</span></div><div class="rpein"><input id="t-rpe" type="text" inputmode="decimal" autocomplete="off" placeholder="—" value="${has?esc(st.rpe):''}"><button class="okbtn" data-trpe="ok" aria-label="Listo">✓</button></div></div>`}
function tRpeOk(){ const T=S.timer, inp=$('#t-rpe'); if(!T||!T.set||!inp) return; const raw=inp.value.replace(',','.').trim(), v=parseFloat(raw);
  if(raw===''){ inp.style.borderColor='var(--red)'; inp.focus(); return }

  const L=ensureLog(), st=(L.sets[T.set.ex]||[])[T.set.i]; if(!st) return; st.rpe=v; L.trainedAt=Date.now(); saveLog(); T.editRpe=false; $('#t-rpebox').innerHTML=tRpeHtml(); if(S.view==='sesion'&&S.mode==='athlete') softRender() }
let restTO=null;
function armRestAlarm(){ clearTimeout(restTO); const T=S.timer; if(!T) return; restTO=setTimeout(restDone,Math.max(0,T.end-Date.now())) }
function restDone(){ const T=S.timer; if(!T||T.beeped) return; T.beeped=true; beep(); notifyRest(T.label) }

  try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg){ await reg.showNotification(title||'¡A la barra! Terminó el descanso',opt); return } }catch(e){}

function stopTimer(){clearTimeout(restTO);clearInterval(tick);S.timer=null;$('#timer').hidden=true;try{wake&&wake.release()}catch(e){}wake=null; if(S.mode==='athlete'&&S.view==='sesion') render()}
function drawTimer(){const T=S.timer; if(!T) return; const left=Math.max(0,Math.round((T.end-Date.now())/1000)); const el=$('#timer'); el.hidden=false;
  const ready=(T.total-left)>=T.min; if(left===0&&!T.beeped) restDone();
  const C=2*Math.PI*54, frac=T.total?left/T.total:0, arc=$('#t-arc');
  if(arc){arc.setAttribute('stroke-dashoffset',C*(1-frac)); arc.setAttribute('stroke',left===0?'var(--green)':'var(--gold)')}
  $('#t-left').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  const m=$('#t-msg'); m.className=ready?'go':'muted'; m.textContent=left===0?'¡A la barra!':ready?'Ya cumpliste el mínimo ('+fmtRest(T.min)+'). Puedes ir cuando estés listo.':'Mínimo recomendado '+fmtRest(T.min);
  $('#t-skip').textContent=left===0?'Listo':'Saltar'}

function readXlsx(file,ok){ if(!file) return; if(typeof XLSX==='undefined'){flash('No se pudo cargar el lector de Excel. Revisa tu conexión.',true);return}

    if(!Object.keys(r.plans).length) return flash(`“${file.name}” no tiene hojas de mesociclo con el formato SEMANA / DÍA / EJERCICIO. Los nombres de hoja que cuentan contienen Hipertrofia, Fuerza base, Volumen, Peaking o Tapering.`,true);
    const u=new Uint8Array(rd.result); let bin=''; for(let i=0;i<u.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
    ok({...r,name:file.name,mtime:new Date(file.lastModified||Date.now()).toISOString(),b64:btoa(bin)}) };

  else { const a=JSON.parse(JSON.stringify(DATA.athletes[aid])); delete a.plan; a.plans=r.plans; a.file=r.name; a.updatedAt=Date.now(); await Store.put('athletes',aid,a) }

function summary(){ const out={}; for(const [aid,a] of Object.entries(DATA.athletes)){ const o=out[a.name||aid]={};
    for(const [mk,plan] of Object.entries(plansOf(a))) o[mesoLabel(mk)]=plan.weeks.map(w=>{ const t={ton:0,carga:0,series:0,eff:0,_r:0,_n:0}; let done=0;
      w.days.forEach(d=>{const L=dayLog(w.n,d.n,aid,mk); if(L&&L.done) done++; const m=realMetrics(L); for(const k in t)t[k]+=m[k]});
      return {semana:w.n,sesiones:`${done}/${w.days.length}`,tonelaje:Math.round(t.ton),carga:Math.round(t.carga),series:t.series,seriesEfectivas:t.eff,rpeMedio:t._n?+(t._r/t._n).toFixed(2):null} }) }
  return out }

function importBackup(file){ if(!file) return; const rd=new FileReader(); rd.onload=async()=>{ let b; try{ b=JSON.parse(rd.result) }catch(e){ return flash('Ese archivo no es un respaldo de Powerosso.',true) }
    if(!b||b.app!=='powerosso'||!b.athletes) return flash('Ese archivo no es un respaldo de Powerosso.',true);

      else for(const c of ['athletes','logs','notes']) for(const [k,v] of Object.entries(b[c]||{})){ const x={...v}; if(c==='athletes') delete x.token; await Store.put(c,k,x) }
      flash(`Respaldo restaurado: ${n} alumnos.`) }catch(e){ flash('No se pudo restaurar el respaldo.',true) } };

const BAT=`<# :

rem Doble clic para ejecutar. Las lineas de abajo son PowerShell (viene incluido en Windows).

#>
$ErrorActionPreference = 'Stop'
# ---- configuracion ----
$Carpeta = 'C:\\Users\\benja\\OneDrive\\Desktop\\Alumnos'
$Url     = '__URL__'

# -----------------------
[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
$Headers = @{ apikey = $Key; Authorization = "Bearer $Key" }
function Llamar($fn, $body) {

  Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$Url/rest/v1/rpc/$fn" -Headers $Headers -ContentType 'application/json; charset=utf-8' -Body $bytes
}
Write-Host ''
Write-Host '  TEAM POWEROSSO - actualizar planillas' -ForegroundColor Yellow
Write-Host "  Carpeta: $Carpeta"
Write-Host ''
if (-not (Test-Path -LiteralPath $Carpeta)) { Write-Host '  No encuentro la carpeta. Revisa la ruta en este archivo (linea $Carpeta).' -ForegroundColor Red; return }
$archivos = Get-ChildItem -LiteralPath $Carpeta -File | Where-Object { $_.Extension -match '^\\.xls[xm]$' -and $_.Name -notlike '~$*' }
if (-not $archivos) { Write-Host '  No hay planillas .xlsx en la carpeta.'; return }
$ok = 0
foreach ($f in $archivos) {
  try {
    $fs = [IO.File]::Open($f.FullName, 'Open', 'Read', 'ReadWrite')   # funciona aunque el Excel este abierto
    try { $ms = New-Object IO.MemoryStream; $fs.CopyTo($ms); $bytes = $ms.ToArray() } finally { $fs.Close() }
    $r = Llamar 'pw_upload' @{ p_token = $Token; p_name = $f.Name; p_mtime = $f.LastWriteTimeUtc.ToString('o'); p_b64 = [Convert]::ToBase64String($bytes) }
    $res = $r.Content | ConvertFrom-Json
    $extra = ''; if ($res.new) { $extra = '  (alumno nuevo: ponle nombre en la app)' }
    Write-Host ('  OK     ' + $f.Name + '  ->  ' + $res.athlete + $extra) -ForegroundColor Green

// ---------- temas: el dorado se cambia por el color elegido (se guarda en este teléfono)
const ACC=[['dorado','Dorado',{medio:['#d4ad5e','#efd594']},['#9c7426','#7a5a18']],
  ['rojo','Rojo',{suave:['#e88080','#f6b8b8'],medio:['#e5434d','#ff8f94'],intenso:['#ff2436','#ff6b74']},['#b3202a','#8c1820']],
  ['azul','Azul',{suave:['#86b6ea','#c0daf7'],medio:['#4f8fe0','#9cc4f5'],intenso:['#2f7bff','#78aaff']},['#1f5fbf','#174a94']],
  ['verde','Verde',{suave:['#86d6a6','#c2eed3'],medio:['#3fbf72','#93e2b2'],intenso:['#12c45e','#5ff09a']},['#1d7a45','#155c33']],
  ['rosa','Rosa',{suave:['#f2a0c8','#f9d0e4'],medio:['#e45a9c','#f5a3cb'],intenso:['#ff2f93','#ff7ab8']},['#b3216a','#8a1952']]];
const TONES=[['suave','Suave'],['medio','Medio'],['intenso','Intenso']];
function getTheme(){ let t={}; try{ t=JSON.parse(localStorage.getItem('powerosso.theme')||'{}') }catch(e){} const a=ACC.find(x=>x[0]===t.acc)||ACC[0]; return {acc:a[0],tone:a[2][t.tone]?t.tone:'medio'} }
function setTheme(acc,tone){ const t=getTheme(); if(acc){ t.acc=acc; if(!tone) t.tone=t.tone||'medio' } if(tone) t.tone=tone; try{ localStorage.setItem('powerosso.theme',JSON.stringify(t)) }catch(e){} applyTheme() }
function applyTheme(){ const t=getTheme(), a=ACC.find(x=>x[0]===t.acc), [g1,g2]=a[2][t.tone]||a[2].medio, [l1,l2]=a[3];
  let el=document.getElementById('theme-css'); if(!el){ el=document.createElement('style'); el.id='theme-css'; document.head.appendChild(el) }
  el.textContent=`:root{--gold:${g1};--gold-2:${g2}} @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--gold:${l1};--gold-2:${l2}}} :root[data-theme="light"]{--gold:${l1};--gold-2:${l2}}` }
applyTheme();
function vAyuda(){ const D=(t,body,open)=>`<details${open?' open':''}><summary>${t}</summary>${body}</details>`;
  return `<h2 class="h2">Ayuda</h2><div class="muted small">Cómo funciona Powerosso App y cómo sacarle el máximo. Toca cada tema para abrirlo.</div>
  <div class="card help">
  ${D('1. Tu link y la app en el teléfono',`<ul><li>Entras con el link personal que te envió tu coach. No lo compartas: es tu acceso.</li><li>Para tenerla como app: abre tu link en <b>Chrome</b> → menú <b>⋮</b> → <b>Instalar app</b> (o "Agregar a pantalla principal"). Desde ahí abre directo en tu planificación.</li><li>Necesitas internet para que se guarde lo que anotas y lo vea tu coach.</li></ul>`,true)}
  ${D('2. Elegir semana y día',`<ul><li><b>Mantén presionado un día</b> para reiniciarlo: se borran las series, kg, reps y RPE de ese día (te pregunta antes) y vuelve a quedar pendiente.</li><li>Arriba ves el mesociclo y las semanas (S1, S2…). La app abre en tu semana actual; toca otra para cambiar.</li><li><b>Vista semana</b> muestra todos los entrenamientos de la semana en tablas, como en la planilla (peso, series, reps, RPE, descanso, %RM y lo que ya hiciste). <b>Entrenar</b> vuelve a la lista de días para entrenar.</li><li>En <b>Entrenar</b> eliges el día. Cada día muestra si está <b>Pendiente</b>, <b>En curso</b> o <b>Hecho</b>.</li><li>Si abres un día que ya terminaste, la app pregunta si quieres <b>repetirlo</b>. Si dices que sí, se borra lo anotado antes y queda con la fecha de hoy (sirve si hiciste una prueba). Si dices que no, ves su resumen.</li></ul>`)}
  ${D('Calentamiento y aproximaciones',`<ul><li>Al abrir un día aparece el <b>Calentamiento recomendado</b>: 4 ejercicios de movilidad (piernas y lumbar en días de pierna; brazos y tronco en días de torso) con 1 min de descanso entre cada uno. Puedes <b>Iniciar</b> o <b>Saltar</b>.</li><li>Antes de squat, press banca y peso muerto aparecen las <b>Aproximaciones</b>: escribe tu peso de trabajo y la app te guía serie por serie (barra vacía, 40%, 60%, 75% y 90%) con su descanso. Los pesos se redondean a 2,5 kg.</li><li>En <b>Entrenar</b> puedes activar o desactivar el calentamiento y las aproximaciones. Tu coach también puede cambiarlo.</li></ul>`)}
  ${D('3. Durante el entrenamiento: kg y reps',`<ul><li>Cada ejercicio muestra el peso, las series, las reps, el RPE y el descanso planificados.</li><li>Los cuadros de <b>kg</b> y <b>reps</b> son editables: vienen con lo planificado (o con tu serie anterior). Si levantaste otro peso o hiciste otras reps, <b>cámbialos antes de apretar "Serie hecha"</b>. Queda registrado exactamente lo que escribiste.</li><li>En series AMRAP o al fallo, escribe cuántas reps hiciste.</li><li>Arriba ves las series que ya hiciste (S1, S2…) con su peso, reps y RPE.</li></ul>`)}
  ${D('4. Serie hecha y descanso',`<ul><li>Al apretar <b>Serie hecha</b> se guarda la serie y parte el descanso.</li><li>El círculo muestra el tiempo que queda y el <b>mínimo recomendado</b>; cuando lo cumples puedes seguir si te sientes listo.</li><li><b>−15 s</b> y <b>+30 s</b> ajustan el tiempo. <b>Saltar</b> cierra el descanso.</li><li>Al terminar el descanso suena, vibra y te llega una <b>notificación</b>, aunque estés fuera de la app; si tienes reloj conectado, vibra también. Actívalo en <b>Tema → Aviso al terminar el descanso</b>.</li><li>Cuando completas todas las series de un ejercicio, la app pasa sola al siguiente.</li></ul>`)}
  ${D('5. RPE real (qué tan dura fue la serie)',`<ul><li>RPE del 1 al 10: 10 = no podías hacer ni una rep más, 9 = te quedaba 1, 8 = te quedaban 2, y así. Se aceptan decimales (8,5).</li><li>Es <b>opcional</b>, pero le sirve mucho a tu coach para ajustar tus cargas.</li><li>Puedes anotarlo en el cuadro que está bajo "Serie hecha" (rellénalo una vez hecha la serie) o en el descanso.</li><li>En el cuadro o en el descanso escribes el número y aprietas <b>✓</b>: queda <b>RPE registrado</b> en el ejercicio. Con <b>Modificar</b> lo cambias.</li><li>Al terminar la sesión te pregunta el <b>RPE del día</b> completo.</li></ul>`)}
  ${D('6. Saltar, volver y series no hechas',`<ul><li><b>Saltar ejercicio</b> sin marcar "Serie hecha" cuenta como que <b>esas series no se hicieron</b>. Tu coach lo ve así en su panel.</li><li>Si hiciste una serie, márcala siempre con "Serie hecha", aunque sea con otro peso o reps.</li><li><b>Anterior</b> te lleva al ejercicio previo para completar series que te faltaron.</li><li>Para <b>corregir el RPE</b> de una serie ya hecha, toca esa serie (S1, S2…) arriba de la tarjeta, escribe el nuevo valor y aprieta ✓.</li><li>Puedes salir y volver: el día queda <b>En curso</b> y retomas donde quedaste.</li></ul>`)}
  ${D('7. Serie Bilbo y 1RM estimado',`<ul><li>En la serie de <b>Press de banca Bilbo</b>, al escribir las reps ves tu <b>1RM estimado</b>: peso × reps × 0,03 + peso.</li><li>Queda guardado y tu coach ve tu avance sesión a sesión.</li></ul>`)}
  ${D('8. Observaciones para tu coach',`<ul><li>En cada ejercicio puedes tocar <b>Dejar observación</b>: elige una opción (Intensidad perfecta, Podría hacer más, Muy pesado, Molestia / dolor, Duda técnica) y escribe un comentario si quieres.</li><li>Tu coach recibe el aviso y te puede responder. Las respuestas aparecen en <b>Mis notas</b>.</li></ul>`)}
  ${D('9. Terminar la sesión y resumen',`<ul><li>En el resumen puedes <b>tomar o elegir una foto</b>: la app le pone tus datos de la sesión (kilos movidos, series, reps, RPE promedio, máx. intensidad, máx. volumen y mejores series o grupos musculares). Eliges el formato en el desplegable bajo la foto, mueves el contenido arrastrando con un dedo y lo agrandas o achicas pellizcando con dos (o con las barras), y la guardas en tu teléfono o la compartes. El RPE que aparece (promedio y @ en cada serie) es el que anotaste; si no lo anotaste, el planificado. En el <b>Dashboard</b> también puedes hacer una foto con los datos de toda la semana.</li><li>En el último ejercicio aparece <b>Terminar sesión</b>. Luego marcas el RPE del día y ves el <b>resumen</b>: kilos levantados, carga, series efectivas, RPE medio y grupos musculares, comparados con el plan.</li></ul>`)}
  ${D('10. Dashboard',`<ul><li><b>Kilos levantados / tonelaje</b>: suma de kg × reps de tus series.</li><li><b>Carga</b>: tonelaje × RPE / 10.</li><li><b>Series efectivas</b>: series con RPE 7 o más.</li><li>También ves los grupos musculares trabajados, el tonelaje por día y por levantamiento, y tu peso más alto por semana.</li></ul>`)}
  ${D('11. Tema y avisos',`<ul><li>En <b>Tema</b> eliges el color de la app (dorado, rojo, azul, verde o rosa) y su tonalidad. Se guarda en tu teléfono.</li><li>Ahí también activas y pruebas el aviso del descanso.</li></ul>`)}
  ${D('12. Si algo no funciona',`<ul><li>Revisa tu internet y vuelve a abrir la app.</li><li>Si dice que el link no es válido, pídele a tu coach tu link actual.</li><li>Si no te llegan los avisos: permite las notificaciones de Chrome (o Powerosso) en los ajustes del teléfono y quita el ahorro de batería para Chrome. Con la pantalla bloqueada mucho rato, algunos teléfonos pausan la app.</li></ul>`)}
  </div>`}
function vAvisos(){ const st=!('Notification' in window)?'no':Notification.permission;
  return `<div class="card"><div class="eyebrow" style="margin-bottom:4px">Aviso al terminar el descanso</div>
  <div class="small muted" style="margin-bottom:10px">Cuando se acaba el descanso, el teléfono suena, vibra y te llega una notificación, aunque estés fuera de la app. Si tienes un reloj conectado que recibe las notificaciones del teléfono, también vibra en el reloj.</div>
  ${st==='granted'?`<div class="row"><span class="pill ok">Avisos activados</span><button class="chip" data-act="notif-on">Probar aviso</button></div>`
   :st==='denied'?`<div class="pill red">Notificaciones bloqueadas</div><div class="small muted" style="margin-top:6px">Actívalas en Ajustes del teléfono → Apps → Chrome (o Powerosso) → Notificaciones, y vuelve a abrir la app.</div>`
   :st==='no'?`<div class="small muted">Este navegador no permite notificaciones. Instala la app desde Chrome (⋮ → Instalar app).</div>`
   :`<button class="btn goldb sm" data-act="notif-on">Activar avisos</button>`}</div>`}
function vTema(){ const t=getTheme(), a=ACC.find(x=>x[0]===t.acc);
  return `<div class="card"><div class="eyebrow" style="margin-bottom:4px">Personalización</div><div class="small muted" style="margin-bottom:10px">Elige el color de la app (negro y blanco con tu color). Se guarda en este teléfono.</div>
  <div class="chips">${ACC.map(x=>`<button class="chip" data-theme="${x[0]}" aria-pressed="${t.acc===x[0]}"><i class="sw" style="background:${(x[2][t.acc===x[0]?t.tone:'medio']||x[2].medio)[0]}"></i>${x[1]}</button>`).join('')}</div>
  ${Object.keys(a[2]).length>1?`<div class="small muted" style="margin:10px 0 6px">Tonalidad</div><div class="chips">${TONES.map(([k,l])=>`<button class="chip" data-tone="${k}" aria-pressed="${t.tone===k}"><i class="sw" style="background:${a[2][k][0]}"></i>${l}</button>`).join('')}</div>`:''}</div>`}
const installBanner=()=>installEv?`<div class="banner"><span>Instala Powerosso como app en tu teléfono</span><button class="chip" data-act="install">Instalar</button></div>`:'';
(async function boot(){
  await Store.init();
  try{ if(Store.kind==='supa'&&'serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}) }catch(e){}
  if(Store.kind==='supa'){
    if(!Store.token){ S.mode='nolink'; return render() }
    try{ await Store.pull(true) }catch(e){ S.mode='nolink'; if(e.status){ S.badLink=true; if(Store.fromSaved) savedToken.clear() } else S.netErr=true; return render() }
    savedToken.set(Store.token,S.isCoach);
    S.ready=3; route();
    const again=()=>{ if(document.hidden) return; Store.pull(false).then(ch=>ch&&softRender()).catch(()=>{}) };
    setInterval(again,20000); document.addEventListener('visibilitychange',again); return }
  if(Store.kind==='db'){ let u=null; try{u=await window.claude.use('user')}catch(e){} S.isCoach=u?await u.isOwner():false }
  else S.isCoach=true;
  const loaded=new Set(); ['athletes','logs','notes'].forEach(c=>Store.listen(c,o=>{DATA[c]=o; if(loaded.size<3){ loaded.add(c); S.ready=loaded.size; if(loaded.size===3) route() } else softRender()}));
})();
</script>
