<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0c">
<script>
// Si el celular abre la página en "modo escritorio" (ignora el ancho del teléfono), se agranda para que se vea como app.
(function(){try{var fit=function(){var d=document.documentElement;
  if(('ontouchstart' in window||navigator.maxTouchPoints>0)&&screen.width<700&&window.innerWidth>screen.width*1.4){d.style.zoom=(window.innerWidth/screen.width).toFixed(3)}else d.style.zoom=''};
  fit();addEventListener('resize',fit)}catch(e){}})();
</script>
<title>Powerosso App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one app column (phone width) centred; sticky brand header, bottom tab bar.
   Palette taken from the Team Powerosso crest: black shield, gold trim, crimson POWER, bear brown, cream. Dark-first. */
:root{
  --bg:#0b0a0c; --surface:#16141a; --surface-2:#211e25; --line:#332e2a; --fg:#f6f2ea; --muted:#a59d90;
  --gold:#d4ad5e; --gold-2:#efd594; --red:#c3242f; --red-fg:#ff5b63; --brown:#9a6a44; --green:#5cc489; --amber:#e8b64a;
  --on-red:#fff8ef;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f1e9da; --line:#ddd0b9; --fg:#140f0c; --muted:#6c6052;
  --gold:#9c7426; --gold-2:#7a5a18; --red:#a3141f; --red-fg:#a3141f; --brown:#7a4f2e; --green:#1d7a45; --amber:#9a6a00; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f1e9da; --line:#ddd0b9; --fg:#140f0c; --muted:#6c6052;
  --gold:#9c7426; --gold-2:#7a5a18; --red:#a3141f; --red-fg:#a3141f; --brown:#7a4f2e; --green:#1d7a45; --amber:#9a6a00; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.blk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--gold);padding:10px 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:46px;height:auto;flex:0 0 auto}
.brand .who{min-width:0;flex:1}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gold{color:var(--gold)}
.macro{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.macro h1{font:800 32px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.weeks{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.wk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:5px 10px;font:600 13px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:52px}
.wk small{font:500 9px var(--mono);color:var(--muted);letter-spacing:.04em}
.wk[aria-pressed="true"]{background:var(--gold);color:#140f0c;border-color:var(--gold)}
.wk[aria-pressed="true"] small{color:#140f0c}
.wkinfo{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.wkinfo b{color:var(--fg);font-weight:600}
.banner{background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:480px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 13px var(--body);padding:12px 4px 10px;cursor:pointer;position:relative}
nav.tabs button[aria-current="true"]{color:var(--fg);box-shadow:inset 0 3px 0 var(--gold)}
nav.tabs .badge{position:absolute;top:6px;margin-left:4px;background:var(--red);color:var(--on-red);font:600 10px var(--mono);border-radius:999px;padding:1px 5px}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.h2{font:700 24px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.pill{font:500 11px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.pill.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.pill.red{color:var(--red-fg);border-color:color-mix(in srgb,var(--red-fg) 45%,transparent)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--red);color:var(--on-red);font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.btn.goldb{background:var(--gold);color:#140f0c}
.btn.sm{padding:9px 12px;font-size:15px}
.btn.inline{width:auto;display:inline-block}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.day .dn{font:800 30px/1 var(--display);text-align:center;color:var(--muted)}
.day .dn small{display:block;font:500 10px var(--mono);letter-spacing:.06em}
.day.done .dn{color:var(--gold)}
.day .t{font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.dots i.d{background:var(--gold)}.dots i.c{background:var(--red)}
.exname{font:700 26px/1.05 var(--display);text-transform:uppercase;margin:4px 0 2px;text-wrap:balance}
.load{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.load .kg{font:800 64px/1 var(--display);color:var(--fg)}
.load .u{font:600 20px var(--display);color:var(--gold)}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.spec div{background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.spec b{display:block;font:600 16px var(--mono);overflow-wrap:anywhere}
.spec span{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inputs input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:600 22px var(--mono);padding:9px 4px;text-align:center}
input.t,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:15px var(--body);padding:10px}
textarea{resize:vertical;min-height:64px}
.setlog{display:flex;flex-wrap:wrap;gap:6px}
.setlog span{font:500 12px var(--mono);background:var(--surface-2);border-radius:8px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 11px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#140f0c}
.note{border-left:3px solid var(--gold);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:3px}
.note.bad{border-color:var(--red-fg)}.note.ok{border-color:var(--green)}.note.done{opacity:.65}
.note .meta{font:500 11px var(--mono);color:var(--muted);letter-spacing:.02em}
.note .reply{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 8px}
.timer{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 95%,transparent);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.timer[hidden]{display:none}
[hidden]{display:none!important}
.rpebox{width:100%;background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;text-align:left;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 18%,transparent)}
.rpebox .q{font-weight:600;margin-bottom:8px}
.rpebox input{width:100%;font:700 30px var(--mono);text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.rpebox input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.rpe10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.rpe10 button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 16px var(--mono)}
.rpe10 button[aria-pressed=true]{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.pie{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center}
.pie ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.pie li{display:grid;grid-template-columns:12px 1fr auto;gap:6px;align-items:center}
.pie li i{width:10px;height:10px;border-radius:2px}
.timer .in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ring{position:relative;width:min(78vw,280px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tt b{font:800 72px/1 var(--display);font-variant-numeric:tabular-nums}
.timer .go{color:var(--green);font-weight:600}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .v{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi .p{font-size:12px;color:var(--muted)}
.kpi .l{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.tbl.wrap td{white-space:normal;font-size:12.5px}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbl td.pl{color:var(--muted)}
.hb{display:grid;grid-template-columns:90px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.hb .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hb .tr b{display:block;height:100%;border-radius:5px}
.warn{border-left:3px solid var(--amber);padding:6px 0 6px 10px;font-size:13px}
.warn.chk{border-color:var(--red-fg)}
.warn small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px}
.file{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;position:relative}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.toast{background:color-mix(in srgb,var(--green) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:13px}
.toast.err{background:color-mix(in srgb,var(--red-fg) 14%,var(--surface));border-color:color-mix(in srgb,var(--red-fg) 40%,transparent)}
.ath{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);background:var(--surface-2);color:var(--gold);border:1px solid var(--gold)}
.link{font:500 12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
.dayplan{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.splash img{width:min(60vw,240px)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .2s ease both}@keyframes in{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<script>
// Powerosso: lector del formato de planificación (hoja tipo "HIPERTROFIA").
// Recibe una matriz de filas (array de arrays, como XLSX.utils.sheet_to_json(ws,{header:1})) y devuelve el plan.
function parsePlan(rows, sheetName, firstRow){
  firstRow = firstRow || 1;
  const S = v => (v === null || v === undefined) ? '' : String(v).trim();
  const up = v => S(v).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const plan = {sheet: sheetName, macro: sheetName, title:'', details:'', params:{}, weeks:[], warnings:[]};
  let week=null, day=null, cols=null, titleCol=1;
  // La columna del título es la de la primera cabecera "EJERCICIO" (si no hay, la primera con "SEMANA n")
  // (la columna donde más se repite "EJERCICIO": así no la confunde una tabla de récords al lado)
  const cnt={}; for (const r of rows) (r||[]).forEach((c,i)=>{ if(up(c)==='EJERCICIO') cnt[i]=(cnt[i]||0)+1 });
  const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a-b)[0]; const found=best!==undefined; if(found) titleCol=+best;
  if(!found) for (const r of rows){ const i=(r||[]).findIndex(c=>/^SEMANA\s*\d+/.test(up(c))); if(i>=0){titleCol=i;break;} }
  const rest = txt => {
    const t = up(txt); if(!t) return null;
    const m = t.match(/(\d+(?:[.,]\d+)?)\s*(?:-|–|A)?\s*(\d+(?:[.,]\d+)?)?\s*(MIN|S|SEG)/);
    if(!m) return null;
    const k = m[3]==='MIN'?60:1, a=parseFloat(m[1].replace(',','.'))*k, b=m[2]?parseFloat(m[2].replace(',','.'))*k:a;
    return {min:Math.round(a), max:Math.round(b), text:S(txt)};
  };
  const repsNum = r => { const t=up(r); if(t==='AMRAP') return 10; const m=t.match(/\d+/g); if(!m) return 0; return m.length>1?(+m[0]+ +m[1])/2:+m[0]; };
  rows.forEach((r, idx) => {
    { const i=(r||[]).findIndex(c=>up(c)==='1RM'); if(i>=0 && rows[idx+1]) for(let c=i+1;c<r.length;c++){ if(S(r[c]) && typeof rows[idx+1][c]==='number') plan.params['1RM '+S(r[c])+' (kg)']=rows[idx+1][c]; } }
    r = r || []; const b = S(r[titleCol]), B = up(r[titleCol]), rowN = idx+firstRow;
    // parámetros a la derecha (pares etiqueta/valor)
    for (let c=titleCol+12;c<r.length-1;c++){ if(typeof r[c+1]==='number' && /1RM|BILBO|\(KG\)/.test(up(r[c])) && !(S(r[c]) in plan.params)) plan.params[S(r[c])]=r[c+1]; }
    if(!b) return;
    // "SEMANA 3 – ...", "HIPERTROFIA SEMANA 3 (RPE 7)" o "SEMANA 3(8 DE JUNIO)"
    const wm = B.match(/^(?:(?:HIPERTROFIA|FUERZA\s*BASE|VOLUMEN|PEAKING|TAP+ERING|DESCARGA)(?:\s*\d+)?\s+)?SEMANA\s*(\d+)\b\s*[–-]?\s*(.*)$/);
    if (wm){ week={n:+wm[1], label:S(b).replace(/^.*?SEMANA\s*\d+\s*[–-]?\s*/i,'').replace(/^\((.*)\)$/,'$1'), deload:/DESCARGA/.test(B), days:[]}; plan.weeks.push(week); day=null; return; }
    const dm = B.match(/^DIA\s*(\d+)\s*[–:-]?\s*(.*)$/);
    if (dm){ if(!week){ plan.warnings.push({row:rowN,msg:'Día antes de la primera semana'}); return; }
      const restTxt=S(b).replace(/^D[IÍií]A\s*\d+\s*[–:-]?\s*/i,''); const ci=restTxt.indexOf(':');
      const WD=/^(LUNES|MARTES|MI[EÉ]RCOLES|JUEVES|VIERNES|S[AÁ]BADO|DOMINGO)\b/i;
      const wd=ci>0?restTxt.slice(0,ci).trim():''; const isWd=WD.test(wd)&&wd.replace(WD,'').trim()==='';
      const lead=!isWd&&ci<0&&restTxt.match(WD);   // "DÍA 4: SÁBADO(FULLBODY)" o "DÍA 1: LUNES"
      day={n:+dm[1], weekday:isWd?wd:lead?lead[1]:'', focus:isWd?restTxt.slice(ci+1).trim():lead?restTxt.slice(lead[0].length).replace(/^[\s(–:-]+|\)\s*$/g,'').trim():restTxt, exercises:[]}; week.days.push(day);
      if(r.slice(titleCol+1).some(v=>/^D[IÍ]A\s*\d+/i.test(S(v)))) plan.warnings.push({row:rowN, where:`Semana ${week.n}`, kind:'check', msg:'Hay una segunda tabla de día al lado (más a la derecha); la app solo carga la de la izquierda'});
      return; }
    if (B==='EJERCICIO'){ cols={}; let stop=false; r.forEach((h,c)=>{ const H=up(h); if(c>titleCol && H==='EJERCICIO') stop=true; if(stop||c<=titleCol) return;
        const k=/^PESO/.test(H)?'kg':H==='SERIES'?'sets':/^REP(ETICION|S\b|$)/.test(H)?'reps':/^RPE(\s*\(@\))?$/.test(H)?'rpe':/^DESCANSO/.test(H)?'rest':/^%/.test(H)?'pct':/^RANGO/.test(H)?'range':null;
        if(k && (cols[k]===undefined || k==='range')) cols[k]=c; }); return; }
    if (!week){ if(!plan.title) plan.title=b; else if(!plan.details) plan.details=b; return; }
    if (!day || !cols || /^OBJETIVO/.test(B)) return;
    const g = k => cols[k]===undefined?undefined:r[cols[k]];

    if(await this.readFiles()) changed=true; return changed },
  async readFiles(){ let ch=false; const need=[...new Set(Object.values(DATA.athletes).map(a=>a.file).filter(Boolean))];

  local(){try{return JSON.parse(localStorage.getItem('powerosso.v3'))||{}}catch(e){return {}}},

    if(this.kind==='db'){ const k=coll+'/'+id; this.q[k]=(this.q[k]||Promise.resolve()).then(()=>this.db.collection(coll).doc(id).set(body)).catch(e=>flash(e&&e.code==='invalid_argument'?'No tienes permiso para guardar aquí. Pide a tu coach que te comparta la app como editor.':e&&e.code==='quota_exceeded'?'La base de datos está llena.':'No se pudo guardar. Revisa tu conexión.',true)); return this.q[k] }

    if(this.kind==='db') return this.db.collection(coll).doc(id).delete().catch(()=>{}); const o=this.local(); if(o[coll]) delete o[coll][id]; this.saveLocal(o); return Promise.resolve() }

const DATA={athletes:{},logs:{},notes:{}};
// Mesociclos: solo cuentan las hojas cuyo nombre contiene una de estas palabras (sin importar mayúsculas ni tildes)
const MESOS=[['HIPERTROFIA','Hipertrofia',/HIPERTROFIA/],['FUERZA BASE','Fuerza base',/FUERZA\s*BASE/],['VOLUMEN','Volumen',/VOLUMEN/],['PEAKING','Peaking',/PEAKING/],['TAPERING','Tapering',/TAP+ERING/]];
const normU=t=>String(t||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const mesoLabel=k=>(MESOS.find(m=>m[0]===k)||[k,k])[1];
function wbPlans(wb){ const plans={}, skipped=[];
  for(const n of wb.SheetNames){ const m=MESOS.find(x=>x[2].test(normU(n))); if(!m) continue; const ws=wb.Sheets[n]; if(!ws||!ws['!ref']) continue;
    const p=parsePlan(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),n,XLSX.utils.decode_range(ws['!ref']).s.r+1);
    const ex=p.weeks.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.exercises.length,0),0); if(!ex){skipped.push(n);continue}
    p.weeks=p.weeks.filter(w=>w.days.some(d=>d.exercises.length)); p.meso=m[0]; p.macro=m[1].toUpperCase(); p.nEx=ex;
    if(!plans[m[0]]||ex>plans[m[0]].nEx) plans[m[0]]=p }
  return {plans,skipped,sheets:wb.SheetNames} }
// planes de un alumno: de su planilla en Supabase, o guardados en su ficha (artifact / navegador)
function plansOf(a){ if(!a) return {}; if(Store.kind==='supa') return (Store.parsed[a.file]||{}).plans||{}; if(a.plans) return a.plans; if(a.plan) return {[a.plan.meso||'HIPERTROFIA']:a.plan}; return {} }
function mesoOf(a){ const P=plansOf(a); if(a&&a.meso&&P[a.meso]) return a.meso; const m=MESOS.find(x=>P[x[0]]); return m?m[0]:null }
const planOf=a=>{const k=mesoOf(a); return k?plansOf(a)[k]:null};

function planMetrics(day){let t=0,c=0,s=0,e=0,rs=0,rn=0;
  day.exercises.forEach(x=>{const kg=x.kg||0, reps=x.repsN||0; t+=kg*reps*x.sets; c+=kg*reps*x.sets*(x.rpeN||0)/10; s+=x.sets; if((x.rpeN||0)>=EFF)e+=x.sets; if(x.rpeN){rs+=x.rpeN*x.sets;rn+=x.sets}});
  return {ton:t,carga:c,series:s,eff:e,rpe:rn?rs/rn:null,_r:rs,_n:rn}}
function realMetrics(log){let t=0,c=0,s=0,e=0,rs=0,rn=0; if(!log) return {ton:0,carga:0,series:0,eff:0,rpe:null,_r:0,_n:0};
  Object.values(log.sets||{}).forEach(arr=>arr.forEach(st=>{const kg=+st.kg||0,r=+st.reps||0,rpe=+(st.rpe??st.rpePlan)||0; t+=kg*r; c+=kg*r*rpe/10; s++; if(rpe>=EFF)e++; if(rpe){rs+=rpe;rn++}}));
  return {ton:t,carga:c,series:s,eff:e,rpe:rn?rs/rn:null,_r:rs,_n:rn}}
function weekMetrics(w,real){const a={ton:0,carga:0,series:0,eff:0,_r:0,_n:0};
  w.days.forEach(d=>{const m=real?realMetrics(dayLog(w.n,d.n)):planMetrics(d); for(const k in a)a[k]+=m[k]}); a.rpe=a._n?a._r/a._n:null; return a}
function heaviest(w,cat){let plan=null,real=null;
  w.days.forEach(d=>d.exercises.forEach((x,i)=>{ if(LIFT(x.name)!==cat) return; if(x.kg!=null) plan=Math.max(plan||0,x.kg); const st=(dayLog(w.n,d.n)||{sets:{}}).sets[i]; if(st&&st.length) real=Math.max(real||0,...st.map(s=>+s.kg||0)) }));
  return {plan,real}}
function weekDone(w,aid=S.aid){return w.days.filter(d=>(dayLog(w.n,d.n,aid)||{}).done).length}
function currentWeek(aid=S.aid){const W=planOf(DATA.athletes[aid]).weeks; let last=-1; W.forEach((w,i)=>{ if(w.days.some(d=>dayLog(w.n,d.n,aid))) last=i }); if(last<0) return W[0].n; const w=W[last]; if(w.days.every(d=>(dayLog(w.n,d.n,aid)||{}).done) && W[last+1]) return W[last+1].n; return w.n}

  return `<div class="card"><div class="eyebrow" style="margin-bottom:6px">${coach?`${dayName(d)} · ${title(d.focus)}`:'Lo que hiciste'}</div><div class="tbl wrap"><table><thead><tr><th>Ejercicio</th><th>Plan</th><th>Real</th></tr></thead><tbody>
  ${d.exercises.map((x,i)=>{const st=(L&&L.sets[i])||[]; const best=st.length?st.reduce((a,s)=>(+s.kg>=+a.kg?s:a)):null; const ns=exNotes(w.n,d.n,i);
    return `<tr><td>${title(x.name)}${ns.length?`<div class="small gold">${ns.map(n=>esc(n.tag||'Nota')+(n.text?': '+esc(n.text):'')).join('<br>')}</div>`:''}</td><td class="pl num">${x.sets}×${esc(x.reps)}${x.kg!=null?'<br>'+fmt(x.kg,1)+' kg':''}${x.rpe!=null?' @'+esc(x.rpe):''}</td><td class="num">${st.length?`${st.length}/${x.sets}<br>${best.kg!=null&&best.kg!==''?fmt(+best.kg,1)+'×':''}${best.reps}${best.rpe!=null&&best.rpe!==''?' @'+fmt(+best.rpe,1):''}`:'<span class="muted">—</span>'}</td></tr>`}).join('')}
  </tbody></table></div></div>`}

function kpis(r,p){const k=(l,v,pv,u='')=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}${u}</div><div class="p">plan ${pv}${u}</div></div>`;
  return `<div class="kpis">${k('Tonelaje',fmt(r.ton/1000,2),fmt(p.ton/1000,2),' t')}${k('Carga (kg×RPE/10)',fmt(r.carga/1000,2),fmt(p.carga/1000,2),' t')}${k('Series efectivas',fmt(r.eff),fmt(p.eff))}${k('RPE medio',fmt(r.rpe,1),fmt(p.rpe,1))}</div>`}

// grupos musculares por nombre del ejercicio (el orden importa: "curl femoral" antes que "curl")
const MUSC=[['Isquios y glúteos',/CURL FEMORAL|FEMORAL|DEADLIFT|PESO MUERTO|RUMANO|HIP\s*THRUST|BUENOS DIAS|GOOD MORNING|GLUTE|PUENTE|BLOCK\s*PULL|NORDIC|PATADA/],
  ['Cuádriceps',/SQUAT|SENTADILLA|PRENSA|BULGARA|CUADRI|ZANCADA|ESTOCADA|HACK|LEG PRESS|STEP|SISSY|GOBLET/],
  ['Brazos',/CURL|BICEP|TRICEP|FRANCES|MARTILLO|PRESS CERRADO|COPA|KICKBACK|PUSH ?DOWN/],
  ['Hombros',/MILITAR|HOMBRO|ELEVACION|LATERAL|FACE ?PULL|OVERHEAD|ARNOLD|PAJARO|POSTERIOR/],
  ['Pecho',/BANCA|BENCH|INCLINADO|DECLINADO|APERTURA|FONDOS|PEC|FLEXION|CRUCE|PUSH ?UP/],
  ['Espalda',/JALON|REMO|DOMINADA|PULL|ROW|DORSAL|PULLOVER|ENCOGIMIENTO|LUMBAR/],
  ['Core',/ABDOM|PLANCHA|CORE|CRUNCH|RUEDA|PALLOF|OBLICUO/]];
const MCOL={'Cuádriceps':'var(--red)','Isquios y glúteos':'var(--brown)','Pecho':'var(--gold)','Espalda':'#5f8fa8','Hombros':'#c47a3a','Brazos':'#8fa864','Core':'#a58fc4','Otros':'var(--muted)'};
const muscle=n=>{const t=normU(n); const m=MUSC.find(x=>x[1].test(t)); return m?m[0]:'Otros'};
function pieMuscles(pairs){ const real={}, plan={};
  pairs.forEach(([w,d])=>{ const L=dayLog(w.n,d.n); d.exercises.forEach((x,i)=>{ const g=muscle(x.name); plan[g]=(plan[g]||0)+(x.kg||0)*(x.repsN||0)*x.sets;
    ((L&&L.sets[i])||[]).forEach(st=>real[g]=(real[g]||0)+(+st.kg||0)*(+st.reps||0)) }) });
  const useReal=Object.values(real).some(v=>v>0), src=useReal?real:plan, tot=Object.values(src).reduce((a,b)=>a+b,0);
  if(!tot) return `<div class="muted small">Aún no hay tonelaje registrado.</div>`;
  const items=Object.entries(src).filter(([g,v])=>v>0).sort((a,b)=>b[1]-a[1]); let ang=-Math.PI/2; const R=60,c=66;
  const arcs=items.map(([g,v])=>{ const f=v/tot; if(f>0.9999) return `<circle cx="${c}" cy="${c}" r="${R}" fill="${MCOL[g]}"/>`; const a2=ang+f*2*Math.PI;
    const p=`M${c},${c} L${c+R*Math.cos(ang)},${c+R*Math.sin(ang)} A${R},${R} 0 ${f>.5?1:0} 1 ${c+R*Math.cos(a2)},${c+R*Math.sin(a2)} Z`; ang=a2; return `<path d="${p}" fill="${MCOL[g]}" stroke="var(--surface)" stroke-width="1.5"/>` }).join('');
  return `<div class="pie"><svg viewBox="0 0 132 132" role="img" aria-label="Tonelaje por grupo muscular">${arcs}<circle cx="${c}" cy="${c}" r="30" fill="var(--surface)"/><text x="${c}" y="${c-2}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)" font-family="var(--mono)">${fmt(tot/1000,1)}</text><text x="${c}" y="${c+13}" text-anchor="middle" font-size="10" fill="var(--muted)">t ${useReal?'real':'plan'}</text></svg>
  <ul>${items.map(([g,v])=>`<li><i style="background:${MCOL[g]}"></i><span>${g}</span><span class="num">${fmt(v/1000,2)} t · <b>${fmt(100*v/tot)}%</b></span></li>`).join('')}</ul></div>
  ${useReal?'':'<div class="muted small" style="margin-top:6px">Todavía sin series registradas: se muestra lo planificado.</div>'}`}
function vDash(){const w=wkObj(S.week), rm=weekMetrics(w,true), pm=weekMetrics(w,false), done=weekDone(w);
  const pd=S.pieDay&&w.days.find(d=>d.n===S.pieDay); const pieSel=pd?[[w,pd]]:w.days.map(d=>[w,d]);
  const ex=w.days.flatMap(d=>{const L=dayLog(w.n,d.n); return L?d.exercises.map((x,i)=>({d,x,st:(L.sets||{})[i]||[]})).filter(o=>o.st.length):[]});
  const cats={'Sentadilla':0,'Banca':0,'Peso muerto':0,'Accesorio':0}; ex.forEach(o=>o.st.forEach(s=>cats[LIFT(o.x.name)]+=(+s.kg||0)*(+s.reps||0)));
  const cmax=Math.max(1,...Object.values(cats)); const ccol={'Sentadilla':'var(--red)','Banca':'var(--gold)','Peso muerto':'var(--brown)','Accesorio':'var(--muted)'};
  return `<div class="row"><div><div class="eyebrow">Semana ${w.n}${phase(w)?' · '+title(phase(w)):''}</div><h2 class="h2">Dashboard semanal</h2></div><span class="pill ${done===w.days.length?'ok':'warn'}">${done}/${w.days.length} sesiones</span></div>
  ${kpis(rm,pm)}
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Grupos musculares (tonelaje)</div>
  <div class="chips" style="margin-bottom:10px"><button class="chip" data-pieday="0" aria-pressed="${!pd}">Semana</button>${w.days.map(d=>`<button class="chip" data-pieday="${d.n}" aria-pressed="${pd===d}">${dayShort(d)}</button>`).join('')}</div>${pieMuscles(pieSel)}</div>
  <div class="card"><div class="row"><span class="eyebrow">Tonelaje por día</span><span class="legend"><span><i style="background:var(--surface-2);outline:1px solid var(--line)"></i>Plan</span><span><i style="background:var(--red)"></i>Real</span></span></div>${dayChart(w)}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Tonelaje real por levantamiento</div><div style="display:flex;flex-direction:column;gap:8px">
  ${Object.entries(cats).map(([c,v])=>`<div class="hb"><span>${c}</span><div class="tr"><b style="width:${100*v/cmax}%;background:${ccol[c]}"></b></div><span class="num" style="text-align:right">${fmt(v/1000,2)} t</span></div>`).join('')}</div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Peso más alto por semana (kg)</div>${topTable()}<div class="muted small" style="margin-top:6px">Número fuerte = levantado en la app · gris = planificado.</div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Ejercicios realizados con la app</div>
  ${ex.length?`<div class="tbl"><table><thead><tr><th>Ejercicio</th><th>Día</th><th>Series</th><th>Mejor</th><th>e1RM</th></tr></thead><tbody>${ex.map(o=>{const b=o.st.reduce((a,s)=>(+s.kg>=+a.kg?s:a)); const e=(o.x.kg!=null&&+b.reps&&+b.kg)?e1rm(+b.kg,+b.reps,+(b.rpe??b.rpePlan)||8):null; return `<tr><td>${title(o.x.name)}</td><td>${dayShort(o.d)}</td><td class="num">${o.st.length}/${o.x.sets}</td><td class="num">${b.kg!=null&&b.kg!==''?fmt(+b.kg,1):esc(title(o.x.load||'—'))}×${b.reps}</td><td class="num">${LIFT(o.x.name)!=='Accesorio'&&e?fmt(e,0):'—'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="muted">Todavía no hay sesiones registradas esta semana. Empieza un día desde Entrenar.</div>`}</div>
  ${S.mode==='athlete'?`<button class="btn ghost" data-act="tomenu">Volver al menú</button>`:''}`}

function dayChart(w){const W=320,H=150,P=26,bw=(W-P)/w.days.length; const vals=w.days.map(d=>({p:planMetrics(d).ton,r:realMetrics(dayLog(w.n,d.n)).ton}));
  const mx=Math.max(1,...vals.flatMap(v=>[v.p,v.r])); const step=mx>20000?10000:mx>8000?5000:2000; const top=Math.ceil(mx/step)*step; const y=v=>H-18-(v/top)*(H-30);
  let g=''; for(let t=0;t<=top;t+=step){g+=`<line x1="${P}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P-4}" y="${y(t)+3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t/1000}t</text>`}
  const bars=vals.map((v,i)=>{const x=P+i*bw+bw*0.15, b=bw*0.34; return `<rect x="${x}" y="${y(v.p)}" width="${b}" height="${H-18-y(v.p)}" rx="2" fill="var(--surface-2)" stroke="var(--line)"/><rect x="${x+b+2}" y="${y(v.r)}" width="${b}" height="${H-18-y(v.r)}" rx="2" fill="var(--red)"/><text x="${x+b}" y="${H-4}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${dayShort(w.days[i])}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tonelaje plan y real por día">${g}${bars}</svg>`}

function topTable(){const W=PLAN().weeks.filter(w=>!w.deload);
  return `<div class="tbl"><table><thead><tr><th>Levantamiento</th>${W.map(w=>`<th>S${w.n}</th>`).join('')}</tr></thead><tbody>
  ${['Sentadilla','Banca','Peso muerto'].map(c=>`<tr><td>${c}</td>${W.map(w=>{const h=heaviest(w,c); return h.real?`<td class="num"><b>${fmt(h.real,1)}</b></td>`:`<td class="num pl">${h.plan!=null?fmt(h.plan,1):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}

let ac=null, tick=null, wake=null;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.21)})}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

  clearInterval(tick); tick=setInterval(drawTimer,250); drawTimer()}
function stopTimer(){clearInterval(tick);S.timer=null;$('#timer').hidden=true;try{wake&&wake.release()}catch(e){}wake=null; if(S.mode==='athlete'&&S.view==='sesion') render()}
function drawTimer(){const T=S.timer; if(!T) return; const left=Math.max(0,Math.round((T.end-Date.now())/1000)); const el=$('#timer'); el.hidden=false;
  const ready=(T.total-left)>=T.min; if(left===0&&!T.beeped){T.beeped=true;beep()}
  const C=2*Math.PI*54, frac=T.total?left/T.total:0, arc=$('#t-arc');
  if(arc){arc.setAttribute('stroke-dashoffset',C*(1-frac)); arc.setAttribute('stroke',left===0?'var(--green)':'var(--gold)')}
  $('#t-left').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  const m=$('#t-msg'); m.className=ready?'go':'muted'; m.textContent=left===0?'¡A la barra!':ready?'Ya cumpliste el mínimo ('+fmtRest(T.min)+'). Puedes ir cuando estés listo.':'Mínimo recomendado '+fmtRest(T.min);
  $('#t-skip').textContent=left===0?'Listo':'Saltar'}

function summary(){ const out={}; for(const [aid,a] of Object.entries(DATA.athletes)){ const o=out[a.name||aid]={};
    for(const [mk,plan] of Object.entries(plansOf(a))) o[mesoLabel(mk)]=plan.weeks.map(w=>{ const t={ton:0,carga:0,series:0,eff:0,_r:0,_n:0}; let done=0;
      w.days.forEach(d=>{const L=dayLog(w.n,d.n,aid,mk); if(L&&L.done) done++; const m=realMetrics(L); for(const k in t)t[k]+=m[k]});
      return {semana:w.n,sesiones:`${done}/${w.days.length}`,tonelaje:Math.round(t.ton),carga:Math.round(t.carga),series:t.series,seriesEfectivas:t.eff,rpeMedio:t._n?+(t._r/t._n).toFixed(2):null} }) }

const BAT=`<# :

# -----------------------
[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

function Llamar($fn, $body) {

  $bytes = [Text.Encoding]::UTF8.GetBytes($json)

}
Write-Host ''

$archivos = Get-ChildItem -LiteralPath $Carpeta -File | Where-Object { $_.Extension -match '^\\.xls[xm]$' -and $_.Name -notlike '~$*' }
if (-not $archivos) { Write-Host '  No hay planillas .xlsx en la carpeta.'; return }

foreach ($f in $archivos) {

    $r = Llamar 'pw_upload' @{ p_token = $Token; p_name = $f.Name; p_mtime = $f.LastWriteTimeUtc.ToString('o'); p_b64 = [Convert]::ToBase64String($bytes) }
    $res = $r.Content | ConvertFrom-Json

    Write-Host ('  OK     ' + $f.Name + '  ->  ' + $res.athlete + $extra) -ForegroundColor Green
    $ok++
  } catch {

  }
}
Write-Host ''
Write-Host "  $ok de $($archivos.Count) planillas actualizadas."
try {
  $dir = Join-Path $Carpeta 'Respaldos Powerosso'

  [IO.File]::WriteAllBytes($ruta, $r.RawContentStream.ToArray())
  Write-Host "  Respaldo guardado en: $ruta"
} catch {
  Write-Host ('  No se pudo guardar el respaldo: ' + $_.Exception.Message) -ForegroundColor Red
}
Write-Host ''

      S.toast=''; render(); return startTimer(x.rest,nextLabel(),{ex:S.ex,i:arr.length-1,name:x.name,n:arr.length,plan:x.rpeN}) }
    case 'nextex': case 'skip': S.ex=Math.min(S.ex+1,d.exercises.length-1); S.toast=''; S.obsOpen=false; return render();
    case 'prevex': S.ex=Math.max(0,S.ex-1); S.toast=''; S.obsOpen=false; return render();
    case 'finish': { const L=ensureLog(); L.done=true; L.finishedAt=Date.now(); saveLog(); stopTimer(); S.dayRpe=L.rpeDay??null; S.view='rpedia'; S.toast=''; return render() }
    case 'rpedia-save': { const L=ensureLog(); L.rpeDay=S.dayRpe??null; saveLog(); S.view='resumen'; return render() }
    case 'rpedia-skip': S.view='resumen'; return render();
    case 'tomenu': S.tab='entrenar'; S.view='dias'; S.toast=''; window.scrollTo(0,0); return render();
    case 'todash': S.tab='dashboard'; S.view='dias'; return render();
    case 'obs-open': S.obsOpen=true; S.obsTag=null; render(); return;
    case 'obs-cancel': S.obsOpen=false; return render();
    case 'obs-save': { const txt=($('#obs-txt').value||'').trim(); if(!S.obsTag&&!txt) return flash('Elige una opción o escribe algo.',true);
      const x=d.exercises[S.ex], id=`${S.aid}~${Date.now().toString(36)}${rnd()}`;
      Store.put('notes',id,{aid:S.aid,meso:mesoOf(ATH()),w:S.week,d:S.day,dayLabel:dayName(d),ex:S.ex,exName:x.name,tag:S.obsTag||'',text:txt,at:Date.now(),reviewed:false,reply:''});
      S.obsOpen=false; S.toast='Observación guardada. Tu coach la verá en su panel.'; S.toastErr=false; return render() }
    case 'to-coach': history.replaceState(null,'',location.pathname+location.search); return route();
    case 'coach-back': S.ctab='alumnos'; S.toast=''; return render();
    case 'add': S.adding=true; S.pending=null; return render();
    case 'add-cancel': S.adding=false; return render();
    case 'add-save': { const name=($('#new-name').value||'').trim(); if(!name) return flash('Escribe el nombre del alumno.',true); if(!S.pending) return flash('Elige su Excel antes de crear el alumno.',true);
      const id=`${slug(name.split(' ')[0])}-${rnd()}`, r=S.pending; S.adding=false; S.pending=null;
      Promise.resolve(Store.put('athletes',id,{name,coach:false,createdAt:Date.now()})).then(()=>setPlanilla(id,r)).then(()=>{ if(Store.kind==='supa') return Store.pull(true) }).then(()=>flash(`${name} agregado. Copia su link y envíaselo.`)); return }
    case 'ed-save': { const nm=($('#ed-name').value||'').trim(); if(!nm) return flash('Escribe un nombre.',true); const at=JSON.parse(JSON.stringify(ATH())); at.name=nm; Store.put('athletes',S.aid,at); return flash('Nombre guardado.') }
    case 'ed-del': { const at=ATH(); if(!confirm(`¿Eliminar a ${at.name} con todos sus registros y observaciones? Exporta un respaldo antes si quieres guardarlos.`)) return;
      Store.del('athletes',S.aid); Object.keys(DATA.logs).filter(k=>DATA.logs[k].aid===S.aid).forEach(k=>Store.kind==='supa'?delete DATA.logs[k]:Store.del('logs',k)); Object.keys(DATA.notes).filter(k=>DATA.notes[k].aid===S.aid).forEach(k=>Store.kind==='supa'?delete DATA.notes[k]:Store.del('notes',k));
      S.ctab='alumnos'; return flash(`${at.name} eliminado.`) }
    case 'export': return exportBackup();
    case 'copy-all': { const t=Object.entries(DATA.athletes).filter(([k,x])=>!x.coach).sort((x,y)=>String(x[1].name).localeCompare(y[1].name)).map(([k,x])=>`${x.name}: ${linkFor(k)}`).join('\n');
      try{ navigator.clipboard.writeText(t).then(()=>flash('Links de todos copiados. Pégalos donde quieras.')).catch(()=>flash('No se pudo copiar. Copia cada link desde su tarjeta.',true)) }catch(e){ flash('No se pudo copiar. Copia cada link desde su tarjeta.',true) } return }
    case 'bat': return downloadBat();
    case 'reply-cancel': S.replyTo=null; return render();
    case 'reply-save': { const n=DATA.notes[a.id], txt=($('#reply-txt').value||'').trim(); Store.put('notes',a.id,{...n,reply:txt,reviewed:true,seen:false}); S.replyTo=null; return render() }
  }
});

function route(){ const h=decodeURIComponent((location.hash||'').slice(1));
  stopTimer(); S.toast=''; S.view='dias'; S.tab='entrenar'; S.week=null;
  if(h&&DATA.athletes[h]&&(Store.kind!=='supa'||S.isCoach||h===S.myAid)){S.mode='athlete'; S.aid=h}
  else if(!S.isCoach&&S.myAid&&DATA.athletes[S.myAid]){S.mode='athlete'; S.aid=S.myAid}
  else if(S.isCoach){S.mode='coach'; if(S.ctab!=='notas') S.ctab='alumnos'}
  else S.mode=h&&S.ready<3?'loading':'nolink';
  render()}
window.addEventListener('hashchange',route);
function setMeso(aid,k){ const at=JSON.parse(JSON.stringify(DATA.athletes[aid])); at.meso=k; Store.put('athletes',aid,at); if(aid===S.aid) S.week=null; flash(`${at.name.split(' ')[0]} ahora está en ${mesoLabel(k)}.`) }
document.addEventListener('input',e=>{const t=e.target; if(!t.dataset||!t.dataset.rpeset) return; const [ex,i]=t.dataset.rpeset.split(':').map(Number);
  const st=(ensureLog().sets[ex]||[])[i]; if(!st) return; const raw=t.value.replace(',','.').trim(), v=parseFloat(raw);
  if(raw===''){ st.rpe=null; t.style.borderColor=''; } else if(!isNaN(v)&&v>=1&&v<=10){ st.rpe=v; t.style.borderColor=''; } else { t.style.borderColor='var(--red)'; return }
  clearTimeout(S.rpeT); S.rpeT=setTimeout(saveLog,400)});
document.addEventListener('change',e=>{const t=e.target; if(t.dataset&&t.dataset.meso) setMeso(t.dataset.meso,t.value)});
// no borrar lo que alguien está escribiendo cuando llegan datos nuevos
function softRender(){const ae=document.activeElement; if(ae&&/INPUT|TEXTAREA/.test(ae.tagName)&&ae.closest('main')){S.dirty=true;return} render()}
document.addEventListener('focusout',()=>setTimeout(()=>{const ae=document.activeElement; if(S.dirty&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName))){S.dirty=false;render()}},50));

(async function boot(){
  await Store.init();
  if(Store.kind==='supa'){
    if(!Store.token){ S.mode='nolink'; return render() }
    try{ await Store.pull(true) }catch(e){ S.mode='nolink'; if(e.status) S.badLink=true; else S.netErr=true; return render() }
    S.ready=3; route();
    const again=()=>{ if(document.hidden) return; Store.pull(false).then(ch=>ch&&softRender()).catch(()=>{}) };
    setInterval(again,20000); document.addEventListener('visibilitychange',again); return }
  if(Store.kind==='db'){ let u=null; try{u=await window.claude.use('user')}catch(e){} S.isCoach=u?await u.isOwner():false }
  else S.isCoach=true;
  const loaded=new Set(); ['athletes','logs','notes'].forEach(c=>Store.listen(c,o=>{DATA[c]=o; if(loaded.size<3){ loaded.add(c); S.ready=loaded.size; if(loaded.size===3) route() } else softRender()}));
})();
</script>
